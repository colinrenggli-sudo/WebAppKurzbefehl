# ==================================================================
# Web-Apps auf dem eigenen Server
#
#   docker compose up -d        starten
#   docker compose pull && docker compose up -d    aktualisieren
#
# Der Webserver liest das Repo direkt aus dem Verzeichnis, in dem
# diese Datei liegt – schreibgeschützt. Neue Inhalte kommen per
# "git pull" (siehe update.sh), ein Neustart ist dafür nicht nötig.
# ==================================================================
name: webapps

services:
  web:
    image: nginx:alpine
    container_name: webapps
    restart: unless-stopped
    ports:
      # Aussen 8088, damit nichts mit der Unraid-Oberfläche kollidiert.
      - "8088:8080"
    volumes:
      - ..:/srv/web:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Vom Server geholte Schlafdaten. Liegt bewusst ausserhalb des
      # Repos, damit nichts davon versehentlich in GitHub landet.
      - ${DATEN:-../../daten}:/srv/web/daten:ro
    environment:
      - TZ=Europe/Zurich
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/schlaf/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------
  # Cloudflare Tunnel – erst einkommentieren, wenn der Tunnel im
  # Cloudflare-Dashboard angelegt ist (Zero Trust → Networks →
  # Tunnels → Create → Docker). Das Token gehört in deploy/.env:
  #     TUNNEL_TOKEN=eyJhIjoi...
  # Diese Datei ist per .gitignore ausgenommen – Token nie einchecken.
  # ----------------------------------------------------------------
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared-webapps
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  #   depends_on:
  #     - web

  # ----------------------------------------------------------------
  # Holt die Fitbit-Schlafdaten von selbst und legt sie unter
  # /daten/schlaf.json ab, wo die App sie beim Öffnen liest.
  # Läuft nur mit --profile sync, damit ein Setup ohne Fitbit nichts
  # Unnötiges startet.
  #
  #   Einmalig verknüpfen:
  #     docker compose --profile sync run --rm fitbit-sync python sync.py setup
  #   Danach dauerhaft:
  #     docker compose --profile sync up -d
  #
  # FITBIT_CLIENT_ID und FITBIT_REDIRECT gehören in deploy/.env.
  # ----------------------------------------------------------------
  fitbit-sync:
    image: python:3.12-alpine
    container_name: fitbit-sync
    profiles: ["sync"]
    restart: unless-stopped
    working_dir: /app
    command: ["python", "sync.py", "loop"]
    volumes:
      - ./fitbit-sync:/app:ro
      - ${DATEN:-../../daten}:/daten
    environment:
      - TZ=Europe/Zurich
      - FITBIT_CLIENT_ID=${FITBIT_CLIENT_ID:-}
      - FITBIT_REDIRECT=${FITBIT_REDIRECT:-}
      - DAYS=${DAYS:-90}
      - INTERVAL=${INTERVAL:-21600}
      - PYTHONUNBUFFERED=1

  # ----------------------------------------------------------------
  # claude-hub – der Serverteil von CODEWERK.
  #   · POST /api/boost  löst die Boost-Routine aus; der Routinen-Token
  #                      bleibt hier und muss nicht aufs Handy
  #   · POST /api/feed   nimmt die stündliche Übersicht entgegen
  #   · GET  /api/feed   liefert sie der App aus
  #
  # Läuft nur mit --profile hub, damit ein Setup ohne CODEWERK nichts
  # Unnötiges startet:
  #     docker compose --profile hub up -d
  #
  # Alle Token gehören in deploy/.env (per .gitignore ausgenommen):
  #     ROUTINE_FIRE_URL=https://api.anthropic.com/v1/claude_code/routines/trig_…/fire
  #     ROUTINE_TOKEN=sk-ant-oat01-…
  #     HUB_TOKEN=<selbst ausgedacht, lang>
  #     INGEST_TOKEN=<selbst ausgedacht, lang>
  #     ALLOW_ORIGIN=https://colinrenggli-sudo.github.io
  # ----------------------------------------------------------------
  claude-hub:
    image: python:3.12-alpine
    container_name: claude-hub
    profiles: ["hub"]
    restart: unless-stopped
    working_dir: /app
    command: ["python", "hub.py"]
    ports:
      # Aussen 8090; hinter dem Cloudflare-Tunnel auf eine eigene
      # Hostname-Regel legen, z. B. hub.deine-domain.ch → claude-hub:8090
      - "8090:8090"
    volumes:
      - ./claude-hub:/app:ro
      - ${DATEN:-../../daten}:/daten
    environment:
      - TZ=Europe/Zurich
      - ROUTINE_FIRE_URL=${ROUTINE_FIRE_URL:-}
      - ROUTINE_TOKEN=${ROUTINE_TOKEN:-}
      - HUB_TOKEN=${HUB_TOKEN:-}
      - INGEST_TOKEN=${INGEST_TOKEN:-}
      - ALLOW_ORIGIN=${ALLOW_ORIGIN:-*}
      - FEED_FILE=/daten/claude-feed.json
      - PORT=8090
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
