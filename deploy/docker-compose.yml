# ==================================================================
# Web-Apps auf dem eigenen Server
#
#   docker compose up -d        starten
#   docker compose pull && docker compose up -d    aktualisieren
#
# Der Webserver liest das Repo direkt aus dem Verzeichnis, in dem
# diese Datei liegt – schreibgeschützt. Neue Inhalte kommen per
# "git pull" (siehe update.sh), ein Neustart ist dafür nicht nötig.
# ==================================================================
name: webapps

services:
  web:
    image: nginx:alpine
    container_name: webapps
    restart: unless-stopped
    ports:
      # Aussen 8088, damit nichts mit der Unraid-Oberfläche kollidiert.
      - "8088:8080"
    volumes:
      - ..:/srv/web:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Vom Server geholte Schlafdaten. Liegt bewusst ausserhalb des
      # Repos, damit nichts davon versehentlich in GitHub landet.
      - ${DATEN:-../../daten}:/srv/web/daten:ro
    environment:
      - TZ=Europe/Zurich
    depends_on:
      - high-sync
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/schlaf/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------
  # HIGH: hält den Zustand der App und verschickt die Erinnerungen.
  # Nur über nginx erreichbar (kein ports:-Eintrag), damit App und
  # Schnittstelle auf derselben Adresse liegen.
  #
  # In deploy/.env gehören:
  #   SYNC_TOKEN=<langer Zufallsschlüssel>
  #   VAPID_PUBLIC_KEY=…
  #   VAPID_PRIVATE_KEY=…
  #   VAPID_SUBJECT=mailto:du@example.ch
  # Erzeugen: siehe deploy/high-sync/README.md
  # ----------------------------------------------------------------
  high-sync:
    build: ./high-sync
    container_name: high-sync
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - ${HIGH_DATA:-../../high-daten}:/data
    environment:
      - TZ=Europe/Zurich
      - DATA_DIR=/data
      - SYNC_TOKEN=${SYNC_TOKEN:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------
  # Cloudflare Tunnel. Läuft nur mit --profile tunnel, damit diese
  # Datei nicht bearbeitet werden muss: eine geänderte, versionierte
  # Datei bringt sonst jedes spätere «git pull» zum Stehen – und damit
  # kämen stillschweigend keine Updates mehr an.
  #
  #   Tunnel anlegen: Cloudflare → Zero Trust → Networks → Tunnels →
  #                   Create → Docker. Das Token in deploy/.env:
  #                       TUNNEL_TOKEN=eyJhIjoi...
  #   Starten:        docker compose --profile tunnel up -d
  #
  # deploy/.env ist per .gitignore ausgenommen – Token nie einchecken.
  # ----------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-webapps
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - web

  # ----------------------------------------------------------------
  # Holt die Fitbit-Schlafdaten von selbst und legt sie unter
  # /daten/schlaf.json ab, wo die App sie beim Öffnen liest.
  # Läuft nur mit --profile sync, damit ein Setup ohne Fitbit nichts
  # Unnötiges startet.
  #
  #   Einmalig verknüpfen:
  #     docker compose --profile sync run --rm fitbit-sync python sync.py setup
  #   Danach dauerhaft:
  #     docker compose --profile sync up -d
  #
  # FITBIT_CLIENT_ID und FITBIT_REDIRECT gehören in deploy/.env.
  # ----------------------------------------------------------------
  fitbit-sync:
    image: python:3.12-alpine
    container_name: fitbit-sync
    profiles: ["sync"]
    restart: unless-stopped
    working_dir: /app
    command: ["python", "sync.py", "loop"]
    volumes:
      - ./fitbit-sync:/app:ro
      - ${DATEN:-../../daten}:/daten
    environment:
      - TZ=Europe/Zurich
      - FITBIT_CLIENT_ID=${FITBIT_CLIENT_ID:-}
      - FITBIT_REDIRECT=${FITBIT_REDIRECT:-}
      - DAYS=${DAYS:-90}
      - INTERVAL=${INTERVAL:-21600}
      - PYTHONUNBUFFERED=1
