# ==================================================================
# nginx-Konfiguration für die Web-Apps aus diesem Repo
#
# Serviert das Repo-Verzeichnis als statische Seite:
#   /            → Kurzbefehl-App
#   /schlaf/     → SCHLAFWERK
#   /dach/       → DACHWERK
#   /raumdesign/ → RAUMWERK
#   /shop/       → ELF11 Shop
#
# Zwei Punkte, an denen solche Setups sonst hängen bleiben:
#   · index.html und sw.js dürfen nicht lange zwischengespeichert
#     werden, sonst klebt der Browser tagelang auf einer alten
#     Version. Icons und Bilder dagegen ruhig lange.
#   · Weiterleitungen müssen relativ sein (absolute_redirect off),
#     sonst schickt nginx hinter dem Tunnel auf Port 8088 statt auf
#     die öffentliche Adresse – der Klassiker bei /schlaf ohne
#     Schrägstrich am Ende.
# ==================================================================

server {
    listen       8080;
    server_name  _;

    root  /srv/web;
    index index.html;
    charset utf-8;

    absolute_redirect off;
    port_in_redirect  off;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    application/manifest+json image/svg+xml text/markdown;

    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header Referrer-Policy        "same-origin" always;

    # Hinweis: nginx vererbt add_header nur, wenn ein location-Block selbst
    # keine add_header-Zeile hat. Darum wiederholen die Blöcke unten alle
    # drei Kopfzeilen – sonst fehlen X-Frame-Options und Referrer-Policy
    # ausgerechnet bei index.html.

    # Git-Innereien und Werkzeuge nie ausliefern (muss vor den
    # anderen Regex-Regeln stehen – die erste Übereinstimmung gewinnt)
    location ~ ^/(\.git|deploy)(/|$) { return 404; }

    # Deine Schlafdaten. Im Heimnetz und über Tailscale erreichbar,
    # durch den Cloudflare-Tunnel nicht: Anfragen von dort tragen einen
    # CF-Ray-Kopf, und die beantwortet nginx mit 404. Wer die Daten
    # bewusst öffentlich haben will, entfernt die if-Zeile.
    location ^~ /daten/ {
        if ($http_cf_ray) { return 404; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header Referrer-Policy        "same-origin" always;
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    # App-Hülle: immer beim Server rückfragen
    location ~* \.(html|webmanifest)$ {
        add_header Cache-Control          "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                   always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header Referrer-Policy        "same-origin" always;
    }
    location ~* /sw\.js$ {
        add_header Cache-Control          "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"                   always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header Referrer-Policy        "same-origin" always;
    }
    location ~* /manifest\.json$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header Referrer-Policy        "same-origin" always;
    }

    # Unveränderliches Beiwerk
    location ~* \.(png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header Referrer-Policy        "same-origin" always;
    }

    # HIGH: Abgleich und Erinnerungen. Der Dienst läuft im Container
    # «high-sync» und ist absichtlich nur hierüber erreichbar – dadurch
    # liegen App und Schnittstelle auf derselben Herkunft, und es braucht
    # weder CORS noch eine zweite Adresse.
    location ^~ /api/ {
        proxy_pass http://high-sync:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Der Zustand kann mit den Jahren wachsen; 16 MB sind reichlich.
        client_max_body_size 16m;
        add_header Cache-Control          "no-store" always;
        add_header X-Content-Type-Options "nosniff"  always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header Referrer-Policy        "same-origin" always;
    }

    location / {
        try_files $uri $uri/ =404;
        autoindex off;
    }

    access_log off;
}
