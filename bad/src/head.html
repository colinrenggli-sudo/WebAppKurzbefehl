<!-- ==================================================================
     BADWERK — Showroom-System fuer den Sanitaerhandel
     ------------------------------------------------------------------
     Eine einzige, self-contained Datei. Kein Build noetig, kein Server,
     kein Konto. Doppelklick genuegt.

     Erzeugt aus bad/src/ mit  python3 build.py  — Aenderungen bitte
     dort machen, diese Datei wird ueberschrieben.

     Drei Oberflaechen aus einer Datei, getrennt durch den Anmeldecode:
       Konsole   (1234 Carlos, Inhaber; weitere Codes im Anmeldeschirm)
                 -> PC: Dashboard, Auftraege, Lieferanten, Postausgang
                 -> Tablet: Offerte im Showroom, Unterschrift, Zahlung
       Lager     (98765) -> Handy: QR scannen, Wareneingang buchen
       Portale   ohne Code, ueber Links mit Token:
                 ?k=  Kunde (Offerte, Zahlung, Termin)
                 ?l=  Lieferant (Bestellung bestaetigen)
                 ?m=  Monteur (Termin, Fertigmeldung)
                 ?p=  Partnerbetrieb (Showroom-Termin buchen)
                 ?scan=  Lagerposition buchen (aus dem QR-Code)

     Daten liegen im Browser (localStorage). Optionaler Firestore-Sync
     verbindet PC, Tablet und Handy live.
     Konzept: bad/KONZEPT.md · Recherche: bad/RECHERCHE.md
     ================================================================== -->
