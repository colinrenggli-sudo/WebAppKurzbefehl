# Schweizer Bauwirtschaft: Marktstruktur, Digitalisierungsgrad, Schmerzpunkte

**Recherchestand: 17. August 2026** | Zielgruppe: Pitch an Stirnimann Bau AG (Bauhauptgewerbe-KMU, Zentralschweiz)

> **Methodenhinweis:** Alle Fetch-Zugriffe auf `.ch`-Domains (baumeister.swiss, bfs.admin.ch, baublatt.ch, pwc.ch, presseportal.ch) wurden vom Netzwerk-Proxy blockiert. Die Recherche stützt sich daher auf indexierte Suchresultate mit wörtlichen Zitaten der Quellseiten. Wo eine Zahl nicht gegengeprüft werden konnte, ist das markiert. Es wurden keine Zahlen, Studien oder Zitate erfunden.

---

## 1. Marktstruktur: Grössenordnungen

| Kennzahl | Wert | Quelle |
|---|---|---|
| Bauwirtschaft gesamt: Beschäftigte | > 500'000 (jeder 10. Arbeitsplatz, fünftgrösster Arbeitgeber) | [2] |
| Bauwirtschaft gesamt: Unternehmen | > 75'000, überwiegend KMU | [2] |
| Bauwirtschaft gesamt: Umsatz | > 65 Mrd. CHF/Jahr, 12 % des BIP | [2] |
| Bauhauptgewerbe: Beschäftigte | 90'000 (SBV) / ~80'000 dem LMV unterstellt | [1], [9] |
| Bauhauptgewerbe: Umsatz | 23 Mrd. CHF/Jahr; Prognose 2026: **24,4 Mrd. CHF (+1,9 %)** | [1], [3] |
| Beschäftigte Hoch-, Tief- und Ausbau | 335'000 (2022), gegenüber 310'000 (2011) | [4] |
| Bauausgaben Schweiz | 67 Mrd. CHF (2023); Wohnbau 52 % der Bauinvestitionen = 30,6 Mrd. | [2] |

**WARNUNG – widersprüchliche Angabe:** Die SBV-Seite formuliert wörtlich: *«50'000 Unternehmen des Bauhauptgewerbes erwirtschaften mit 90'000 Beschäftigten 23 Milliarden Franken Umsatz pro Jahr»* [1]. Diese Firmenzahl ist rechnerisch unplausibel (1,8 Beschäftigte pro Betrieb) und steht im Widerspruch zu Bauenschweiz, das für die *gesamte* Bauwirtschaft inkl. Planer und Ausbau über 75'000 Unternehmen nennt [2]. **Empfehlung für das Deck: die Firmenzahl nicht verwenden.** Belastbar sind Beschäftigte (90'000) und Umsatz (23–24,4 Mrd.).

### Konjunktur (aktuellster Stand)
- Q1 2026: Umsatz **+5,6 % auf über 4,9 Mrd. CHF**; Treiber Wohnbau und öffentliche Hochbauprojekte [3]
- Arbeitsvorrat Ende Dezember 2025: **+4,5 %** über Vorjahr [3]
- Hochbausumme 2025: rund 55 Mrd. CHF, zweitbester Wert der Zeitreihe; Q4 2025 Hochbau +7,5 % [4]
- Wirtschaftsbau schwächelt seit zwei Jahren: Quartalsumsatz von 0,8 auf 0,7 Mrd. gesunken [3]
- Kanton Luzern: **+2'300 Baustellen-Arbeitsplätze in zehn Jahren**, Rang 3 aller Kantone absolut [4]

---

## 2. Wie dünn sind die Margen wirklich?

- **2–3 % Gewinnmarge** im Bauhauptgewerbe (2022), bedingt durch harten Preiswettbewerb; Materialpreissteigerungen konnten nur teilweise weitergegeben werden [5]
- **Nachhaltig gesund wären 4–6 % Umsatzrendite** – dieser Wert wird laut Branchenaussage nicht erreicht [5]
- Cashflow-Margen im Hoch- und Tiefbau sind im letzten Jahrzehnt um **1–2 Prozentpunkte gesunken**, was Investitionen erschwert [5]
- EBITDA-Bandbreite 3–6 %, mit Spezialisierung/Vorfertigung 6–8 % (Bewertungsplattform Val Index, 2026) [6] – *geringere Verlässlichkeit, kommerzielle Quelle*

**SCHÄTZUNG (eigene Rechnung, keine Quelle):** Bei 3 % Marge erhöht eine Kostensenkung von 1 % des Umsatzes den Gewinn um rund einen Drittel. Auf einen Betrieb mit 20 Mio. CHF Umsatz gerechnet: 200'000 CHF eingesparte Kosten ≈ 600'000 → 800'000 CHF Gewinn. **Das ist der zentrale Verkaufshebel: In einer 3-%-Branche zahlt sich Administration direkt auf die Marge durch.**

### Produktivität: der Elefant im Raum
- Arbeitsproduktivität Schweiz gesamt **1997–2023: +21 %**; Baubranche im gleichen Zeitraum **–2 %** (Avenir Suisse) [7]
- Zweite Quelle: Baugewerbe **1991–2021: –4,2 %**, Gesamtwirtschaft +45 %, verarbeitendes Gewerbe +90 % [7]
- Ursache laut Avenir Suisse: «Kostenkrankheit» arbeitsintensiver Branchen mit geringen Automatisierungsmöglichkeiten plus verpasste Effizienzentwicklungen der Industrie [7]

---

## 3. Fachkräftemangel

- **SBV-Studie (durchgeführt von Demografik):** Bis 2040 fehlen dem Bauhauptgewerbe **5'600 Fachkräfte**. Bei Maurern werden **31 %**, bei Bauvorarbeitern **33 %** mehr Personal gebraucht, als voraussichtlich verfügbar sein wird; allein bei den Maurern rund 2'500 Personen. Haupttreiber: Altersüberhang bei Maurern, Bauvorarbeitern und Polieren [8]
- **Lernende Maurer/in EFZ:** 2010 rund 1'200 Lehrbeginne, 2019 nur noch gut 700, 2024 wieder **722 (+10 %)**. Ab Lehrstart 2025 gelten totalrevidierte Bildungsverordnungen – Auslöser waren tiefe QV-Erfolgsquoten und der Rückgang der Lernendenzahlen [15]
- **Entspannung 2025:** Fachkräftemangel-Index rund 22 % unter Vorjahr; offene Stellen –8 %, RAV-Stellensuchende +17 %; Deutschschweiz –23 %, lateinische Schweiz –17 % [16]
- **Rekrutierungskosten Schweiz:** durchschnittlich **13'570 CHF** pro Einstellung [17] – *Beratungsquelle, mittlere Verlässlichkeit*
- **Löhne:** LMV-Personal verdient 2026 im Schnitt **6'282 CHF/Monat ≈ 82'000 CHF/Jahr**; Lohnklasse C (ohne Ausbildung) 4'959, Maurer mit EFZ 6'148, Polier 7'908 CHF/Monat [18]

**Nicht belegbar:** Branchenspezifische Fluktuationsraten und Kosten offener Stellen im Schweizer Bauhauptgewerbe. Es existiert keine auffindbare Erhebung dazu.

---

## 4. Sprachenvielfalt auf der Baustelle

Nationalitätenstruktur des Baustellenpersonals im Bauhauptgewerbe **2024** (SBV-Lohnerhebung, via Statista):
- **34,7 % Schweizer, 31,0 % Portugiesen** – zwei Nationen stellen zwei Drittel des Personals
- Rund **100 Nationalitäten** vertreten; ca. **90 % der Ausländer stammen aus der EU** [19]
- Nach Portugal folgen Italien und Ex-Jugoslawien [19]
- In den **tiefen Lohnklassen C, B und A liegt der Ausländeranteil über 80 %**, in den höheren Klassen 30–50 % [19]

**Nicht belegbar:** Exakte prozentuale Aufteilung nach Albanisch, Serbisch/Kroatisch, Türkisch, Polnisch, Spanisch oder Englisch als Baustellensprache. Die SBV-Erhebung publiziert Nationalitäten, keine Sprachanteile; die Detailtabelle liegt hinter Statista-Paywall.

**BELEGTE OPERATIVE FOLGE:** Wenn ein Drittel des Personals Portugiesisch spricht und über 80 % der ungelernten Lohnklassen ausländisch sind, sind deutschsprachige Papierrapporte, Sicherheitsunterweisungen und Qualitätsanweisungen strukturell fehleranfällig. Das ist der stärkste inhaltliche Anknüpfungspunkt für KI-Übersetzung – zumal Übersetzung mit **52 %** bereits die häufigste KI-Anwendung in Schweizer KMU ist [20].

---

## 5. Digitalisierungsgrad

**pom+ Digital Real Estate & Construction Studie 2026** (11. Ausgabe, ~200 befragte Fach- und Führungskräfte, mit bauen digital Schweiz / buildingSMART Switzerland) [10]:
- Gesamtindex **DRE-i: 4,3 von 10 Punkten** (2025: 4,0)
- **Bauwirtschaft separat erstmals gemessen: 4,0 Punkte** – Schlusslicht, unter Real Estate Management (4,6)
- Zentrale Hemmnisse: **Investitions- und Kostenfragen**
- KI erstmals unter den als am nützlichsten bewerteten Technologien; vier KI-Zukunftsszenarien entwickelt

**KI-Adoption in Schweizer KMU (AXA KMU-Arbeitsmarktstudie 2025)** [20]:
| Kategorie | 2024 | 2025 |
|---|---|---|
| KI bewusst in Arbeitsprozesse integriert | 22 % | **34 %** |
| KI wird erprobt | 33 % | 37 % |
| Verzichtet auf KI | 45 % | **29 %** |

Häufigste Anwendungen: Übersetzungen 52 %, Korrespondenz 47 %, Optimierung von Arbeitsschritten 34 % (2024: 23 %), Datenanalysen 32 % [20].

**BIM-Pflicht:** Bund und bundesnahe Betriebe wenden die BIM-Methode seit 2021 für Immobilien und **ab 2025 für Infrastrukturanlagen verpflichtend** an (Aktionsplan Digitale Schweiz) [21].

**Papierrealität:** Beschrieben wird die Praxis, dass Tagesrapporte gedruckt, dem Polier übergeben und handschriftlich mit Stunden, Material und Inventar ergänzt werden; Stundenzettel gehen verloren, sind unleserlich oder kommen zu spät im Büro an. Ein Softwareanbieter beziffert das Einsparpotenzial mit **rund einem Tag Büroarbeit pro Woche** [11] – *Anbieteraussage, nicht unabhängig verifiziert, im Deck als Anbieterangabe kennzeichnen.*

---

## 6. Regulatorik, die Administration erzeugt

| Norm / Vorschrift | Konkrete Pflicht | Quelle |
|---|---|---|
| **LMV 2026–2031** (in Kraft 1.1.2026, 6 Jahre, ~80'000 Mitarbeitende) | Arbeitszeitkalender bis **Mitte November** bei der PBK einzureichen (Art. 27 Abs. 1). Neue Bandbreite **–20 Minusstunden / +120 Überstunden**. Stichtag 30. April entfällt, neu Entscheid per 31.12. Separater Kalender Mai–Dez. 2026. Ab 1.1.2027 Wahl zwischen Kalendermodell und ausgeglichenem Modell. Reisezeit 30 Min. pauschal via Baustellenzulage 2026–2029, danach Reduktion auf 20 Min. in 2030/2031 | [9], [12] |
| **PBK / Allgemeinverbindlicherklärung** | Gesetzlicher Kontrollauftrag, systematische Lohnkontrollen im Betrieb, Konventionalstrafen bei Verstössen | [12] |
| **BauAV 2022** (in Kraft 1.1.2022, betrifft > 70'000 Betriebe) | Art. 4: **vor Baubeginn schriftliches Sicherheits- und Gesundheitsschutzkonzept inkl. Notfallorganisation**. Seitenschutz ab 2 m Absturzhöhe | [13] |
| **SIA-Norm 118** | Grundsatz **«Kein Abrechnungsposten ohne Beleg»**: Regierapporte von der Bauleitung gegengezeichnet, Mehraufwand über Tagesrapporte, ausgeführte Einheiten über Ausmassurkunden. «Nachtrag» ist in der Norm nicht definiert. Art. 87 Abs. 4: Bauleitung *darf* Bestellungsänderungen in Regie ausführen lassen, wenn keine Preiseinigung zustande kommt | [14] |
| **Bauhandwerkerpfandrecht (Art. 839 Abs. 2 ZGB)** | **4 Monate ab Vollendung der Arbeit**, nicht erstreckbar und nicht sistierbar; die Eintragung muss vollzogen sein – Gesuchstellung am letzten Tag genügt nicht | [22] |
| **Zahlungsfristen** | OR kennt keine gesetzliche Frist; branchenüblich 30 Tage netto, Verzugszins 5 % (OR 104). Bei SIA-Normen: Bauabrechnung binnen 30 Tagen. Durchschnittlicher Zahlungsverzug Schweiz 2025: **rund 32 Tage** | [23] |
| **Entsendegesetz / Meldeverfahren** | Im Bau **Meldung ab dem 1. Tag, 8 Tage vor Arbeitsbeginn**. Altes SEM-Verfahren am 14.3.2025 abgeschaltet, seit 17.3.2025 nur noch über **EasyGov.swiss** | [24] |
| **Öffentliche Beschaffung / simap.ch** | Öffentliche Hand beschafft **über 41 Mrd. CHF/Jahr ≈ 5 % des BIP**. Revidiertes Beschaffungsrecht verschiebt von Preis- zu Qualitätswettbewerb | [25] |
| **MWST** | Normalsatz **8,1 % seit 1.1.2024**, 2026 unverändert. Saldosteuersatz nur bis 5'005'000 CHF Umsatz und 103'000 CHF Steuerschuld | [26] |
| **Baubewilligung** | Bearbeitungsdauer stieg laut ZKB-Studie 2023 innert zehn Jahren von **84 auf 140 Tage**; eine Einsprache verlängert typischerweise um **3–6 Monate**. BWO-Studie zu Ursachen publiziert am 1.7.2025 | [27] |

**Gesamtbelastung:** Der Schweizerische Gewerbeverband beziffert die Regulierungskosten für Schweizer Unternehmen in einer Hochrechnung auf **rund 80 Mrd. CHF**; Bürokratie bleibt laut KMU-Monitor vom November 2025 die zentrale Herausforderung, insbesondere bei Bauprojekten [28] – *Verbandsquelle mit politischem Interesse, entsprechend einordnen.*

---

## 7. Wo Bauunternehmen belegbar Geld verlieren

**Nacharbeit / Rework:** Internationale Studien zeigen Rework-Kosten von **1–20 % der Projektkosten**, mit Häufung bei **4–10 %**; über Jahrzehnte hinweg gemessen verschlingt Fehlerbehebung typischerweise **5–10 % der Gesamtprojektkosten**. Eine Befragung von 811 Fachleuten in 13 Ländern zeigt: **56 % der Firmen mit konsistenten QA/QC-Prozessen halten Rework unter 5 %** des Projektbudgets [29]. *Wichtig: internationale Daten, sekundär zitiert über einen Softwareanbieter. Eine schweizspezifische Rework-Quote ist nicht belegbar.*

**Nachtrags- und Regieabrechnung:** Der Verlustmechanismus ist normativ vorgegeben, nicht anekdotisch. SIA 118 verlangt für jeden Abrechnungsposten einen Beleg [14]; die KBOB publiziert dafür einen eigenen Leitfaden zum Nachtragsmanagement (V2.0) [14]. Fehlt der gegengezeichnete Regierapport, ist die Leistung erbracht, aber nicht durchsetzbar – das ist ein direkter Margenverlust ohne Gegenwert.

**Konkurse als Symptom:** In den ersten neun Monaten 2025 wurden 8'387 Konkursverfahren eröffnet, **die meisten davon im Baugewerbe mit 1'192 Fällen** [30]. Über elf Monate 2025: 11'057 Eröffnungen, +36,4 %; Q1 2026: 3'902 Firmen, +79,6 % [30]. **ACHTUNG – Confounder:** Ein wesentlicher Teil des Anstiegs geht auf eine **Gesetzesänderung** zurück (Konkursbetreibung für öffentlich-rechtliche Forderungen), nicht auf eine reine Konjunkturverschlechterung. Im 1. Halbjahr 2026 sank die Zahl im Baugewerbe wieder um 12,5 % [30]. **Diese Zahlen im Deck nur mit dem Gesetzesvorbehalt verwenden.**

**Sicherheit als Kostenfaktor:** In der Schweiz ereignen sich jährlich **über 10'000 Absturz-Berufsunfälle** mit im Schnitt **230 Invaliditäts- und 16 Todesfällen**; jeder dritte Berufsunfall mit bleibenden Schäden oder Todesfolge ist ein Absturz [31]. Gesamtschweizerisch 2023: 286'000 Berufsunfälle, Kostenpunkt **6,9 Mrd. CHF** [31]. Suva-Versicherte weisen mit rund 83 Berufsunfällen pro 1'000 Vollzeitstellen ein doppelt so hohes Risiko auf wie bei übrigen Versicherern; 2024 markierte mit **348 schweren Unfällen pro 100'000 Vollbeschäftigten einen Negativrekord (+17 % gegenüber 2015)** [31].

**Nicht belegbar:** Quantifizierte Schweizer Zahlen zu Maschinen-Leerlaufzeiten, Baustellenlogistik-Verlusten und dem Aufwand pro Angebotserstellung im Submissionsverfahren. Qualitativ beschrieben werden Such- und Wartezeiten durch chaotische Anlieferungen und unklare Ablageorte [32], sowie dass ein Grossteil der Arbeitszeit in Vergabeverfahren in reine Administration fliesst – Dokumente formatieren, Versionen abgleichen, Formulare ausfüllen, simap.ch bedienen [25]. **Konkrete Prozentwerte dazu bitte nicht erfinden.**

---

## 8. Verkaufsrelevante Ableitung

1. **Margenhebel statt Technikargument.** Bei 2–3 % Marge [5] ist jede eingesparte Bürostunde direkt Gewinn. Nicht «Digitalisierung» verkaufen, sondern Marge.
2. **Sprache ist der unbestrittene Anker.** 31 % Portugiesen, über 80 % Ausländeranteil in den tiefen Lohnklassen [19] – gegen deutschsprachige Papierprozesse. Übersetzung ist bereits die Nr.-1-KI-Anwendung in Schweizer KMU (52 %) [20].
3. **Compliance ist ohnehin Pflicht.** LMV-Arbeitszeitkalender an die PBK [9][12], BauAV-Sicherheitskonzept schriftlich vor Baubeginn [13], SIA-118-Belegpflicht [14], 4-Monats-Frist beim Pfandrecht [22]. Digitalisierung wird hier nicht Kür, sondern Risikoabbau.
4. **Der Markt läuft, das Personal fehlt.** +5,6 % Umsatz Q1 2026 [3] bei 5'600 fehlenden Fachkräften bis 2040 [8]: Wachstum ist nur über Produktivität realisierbar – und die ist seit 1997 um 2 % *gesunken* [7].

# 30 KI- und Software-Anwendungsfälle für ein Schweizer Bauunternehmen (KMU)

**Stand: 17. August 2026** · Für den Pitch an die Stirnimann Bau AG (Bauhauptgewerbe, Zentralschweiz)

**Legende:** **[B]** belegt mit Quelle · **[A]** Annahme/eigene Schätzung · **[?]** nicht belegbar · **[V]** Aktualität eingeschränkt
**Aufwand:** S = 2–6 Wochen bis Produktivbetrieb · M = 2–4 Monate · L = 6+ Monate
**Risiko:** tief / mittel / hoch (Ausfall-, Rechts- und Akzeptanzrisiko zusammen)

> **Methodenhinweis, bitte lesen:** Diese Recherche traf auf zwei harte Grenzen. Erstens blockiert die Netzwerk-Policy dieser Session direkte Zugriffe auf praktisch alle `.ch`-Domains (HTTP 403 beim CONNECT: crb.ch, suva.ch, bfs.admin.ch, fedlex.admin.ch, baumeister.swiss, sorba.ch, scait.ch, planradar.com, tbp-law.ch, 123erfasst.de). Zweitens war das Suchbudget der Session nach zehn erfolgreichen Abfragen erschöpft. Belegt ist deshalb, was aus indexierten Suchresultaten mit Quellenangabe stammt (Quellen [1]–[10]) plus die bereits verifizierten Zahlen der Schwesterrecherche `04-bau-schweiz-markt.md` (Quellen [11]–[16]). **Anbieternennungen ohne Beleg-Markierung sind Marktkenntnis, nicht Recherche – sie müssen vor dem Meeting nachgeprüft werden.** Es wurden keine Zahlen, Studien, Fallstudien oder Zitate erfunden.

---

## 1. Die Ausgangslage in vier belegten Zahlen

| Fakt | Wert | Quelle |
|---|---|---|
| Anteil Portugiesen am Baustellenpersonal Bauhauptgewerbe (2024) | **31,0 %** (Schweizer: 34,7 %); rund **100 Nationalitäten** vertreten | [4] **[B]** |
| Beschäftigte Bauhauptgewerbe / dem LMV unterstellt | **90'000** / rund **80'000** | [4], [5] **[B]** |
| Berufsunfälle Schweiz 2023 und deren Kosten | **286'000 Fälle / 6,9 Mrd. CHF**; Suva-Nettoprämie Bauhauptgewerbe 2,5 %, Gerüstbau 5,74 % (2025) | [8] **[B]** |
| Gewinnmarge Bauhauptgewerbe (2022) | **2–3 %** | [11] **[B] [V – vier Jahre alt]** |

**Verkaufslogik [A]:** Bei 2–3 % Marge ist jede eingesparte Bürostunde direkt Gewinn. Und wenn ein Drittel der Belegschaft Portugiesisch spricht, ist der deutschsprachige Papierrapport kein Formular, sondern eine Fehlerquelle. Übersetzung ist bereits die häufigste KI-Anwendung in Schweizer KMU (**52 %**) [15] **[B]** – das Verkaufsargument existiert bereits im Kopf des Kunden.

---

## 2. Anbieterlandschaft: Was heute wirklich existiert

| Anbieter | Belegte Funktionen | Status |
|---|---|---|
| **Abacus «Tagesrapport» (AbaBau / AXbau)** | iPad-App: Mitarbeiterstunden, Materialverbrauch, Maschinenstunden, Lieferscheine, Regie- und Fremdleistungen. **Texte, Fotos, Sprachnotizen und Videos** im Rapport | [1] **[B]** |
| **SORBA myRapport** | Rapportierung Personal / Geräte / Material analog Papierform; **Fotos, Notizen und Sprachnachrichten** anhängbar | [1] **[B]** |
| **Baurapport.ch** | Schweizer Baustellen-App: Rapporte, Zeiterfassung, Material, Team-Chat, Pläne | [1] **[B]** |
| **123erfasst** | **KI-Chat-Assistent mit Sprach- oder Texteingabe**, erfasst Arbeitsschritte und Ergebnisse; Bautagesbericht wird automatisch aus Leistungen, Zeiten, Kommentaren und Fotos zusammengestellt; App-Sprache folgt Systemsprache; **Stammdaten mehrsprachig hinterlegbar** (Beispiel: Deutsch + Polnisch) | [2] **[B]** |
| **CENDAS Sprachassistent** | Freihändige Sprachbedienung statt Tippen **plus automatische Übersetzung** («Bauen ohne Sprachbarrieren») | [2] **[B]** |
| **PlanRadar** | **Integriertes KI-Diktiergerät** für Mängel- und Aufgabeneinträge; **SiteView**: 360°-Bilder werden beim Begehen automatisch auf dem 2D-Plan verortet; über **170'000 Nutzer in über 75 Ländern** | [3] **[B]** |
| **Buildots** | Helmmontierte 360°-Kamera + Computer Vision, Abgleich mit BIM-Modell und Terminplan, automatische Abweichungserkennung; MBN GmbH (Berlin Lichtenberg) als erstes deutsches Bauunternehmen im Einsatz | [7] **[B]** |
| **SCAIT (CH)** | KI-Software für Schweizer Bausubmissionen: zweistufiger Filter, Eignungskriterien und **automatische KI-Vorprüfung**, um Submissionen auf simap zu selektieren, «ohne 5'000 Seiten zu lesen»; kennt Schweizer Baustandards | [6] **[B]** |
| **CRB NPK** | Rund **200 Kapitel** (Hochbau, Tiefbau, Untertagbau, Gebäudetechnik, Gebäudeautomation); Austauschformat **CRBX**; NPK-Viewer und NPK-Editor; digitale Nutzung erfordert CRB-zertifizierte Anwendung **plus Datennutzungslizenz** | [9] **[B]** |
| Capmo, Sablono, Fieldwire, Procore, Nevaris, Bauhub, Bexio, Baubit, Messerli, OpenSpace, HoloBuilder, Doxel | OpenSpace und HoloBuilder sind als fotogrammetrische Anbieter belegt [7]; alle übrigen: **im Markt bekannt, in dieser Recherche NICHT verifiziert** | **[?]** |

**Die Marktlücke, sauber formuliert [A]:** Sprachnotizen (Abacus, SORBA), Sprach-*erfassung* (123erfasst) und Sprach-*übersetzung* (CENDAS) sind je einzeln belegt. Was ich **nicht** belegen konnte, ist ein Schweizer Produkt, das beides verbindet: Diktat in der Muttersprache → strukturierter, deutschsprachiger Tagesrapport im Schweizer Format mit Stunden, Material, Maschinen, Wetter und NPK-Bezug. **Das ist Colins Einstiegsprodukt – aber im Meeting als «konnte ich nicht finden» sagen, nicht als «gibt es nicht».**

---

## 3. Die 30 Anwendungsfälle

### Block A – Baustelle und Feld

**A1 · Mehrsprachiger Sprach-Rapport.** Polier oder Vorarbeiter diktiert 60 Sekunden auf Portugiesisch, Italienisch, Albanisch, Kroatisch, Türkisch, Polnisch, Spanisch oder Englisch; das System füllt daraus den strukturierten Schweizer Tagesrapport auf Deutsch: Stunden pro Person, Material, Maschinen, Wetter, Fotos, Bemerkungen. *Markt:* Bausteine bei 123erfasst (KI-Spracherfassung [2]), CENDAS (Übersetzung [2]), Abacus/SORBA (Sprachnotiz als Anhang [1]). *Nutzen:* Zielgruppe belegt – 31 % Portugiesen, ~100 Nationalitäten [4]. *Aufwand:* M. *Risiko:* mittel – Transkription in Baustellenlärm und Dialekt, Halluzinationsrisiko bei Zahlen. **Zwingend: Rückübersetzung zur Bestätigung in der Muttersprache vor dem Absenden.**

**A2 · Regierapport mit Belegkette.** Regieleistungen werden erfasst, sofort als PDF an die Bauleitung zur digitalen Gegenzeichnung geschickt und mit Foto- und Zeitbeleg archiviert. *Markt:* Abacus erfasst Regie- und Fremdleistungen [1]. *Nutzen:* SIA 118 verlangt «kein Abrechnungsposten ohne Beleg»; fehlt der gegengezeichnete Regierapport, ist die Leistung erbracht, aber nicht durchsetzbar [14] **[B]**. *Aufwand:* S. *Risiko:* tief. **Höchste ROI-Dichte im ganzen Katalog.**

**A3 · Fotodokumentation mit automatischer Verschlagwortung.** Jedes Baustellenfoto erhält automatisch Objekt, Bauteil, Geschoss, Gewerk, Datum und GPS als durchsuchbare Schlagworte. *Markt:* Ordnerstrukturen sind Standard, KI-Verschlagwortung im DACH-Markt in dieser Recherche **nicht verifiziert [?]**. *Nutzen:* Beweislage bei Nachträgen und Mängelstreit. *Aufwand:* S. *Risiko:* tief.

**A4 · Baufortschritt aus Bildern.** 360°-Rundgang oder Helmkamera, automatischer Abgleich gegen Terminplan oder BIM-Modell, Abweichungsreport. *Markt:* **Buildots** (BIM-Abgleich, Abweichungserkennung), **OpenSpace**, **HoloBuilder** [7]; **PlanRadar SiteView** verortet 360°-Bilder automatisch auf dem 2D-Plan [3]. *Nutzen:* Ein Sekundärbericht nennt bis zu 30 % weniger Verzögerungen [7] – **Anbieter-/Sekundärquelle, im Deck als solche kennzeichnen, nicht als Studie**. *Aufwand:* L. *Risiko:* mittel – lohnt erst ab BIM-Projekten, für ein Tiefbau-KMU meist überdimensioniert.

**A5 · Mängel- und Abnahmemanagement.** Mangel per Sprache aufnehmen, auf dem Plan verorten, Gewerk zuweisen, Frist setzen, Nachverfolgung bis zur Abnahme. *Markt:* **PlanRadar belegt** – KI-Diktiergerät, Verortung auf Plan oder BIM, Ticket bündelt Fotos, Sprachnotizen, Fristen [3]. *Nutzen:* Rework kostet international 4–10 % der Projektkosten; 56 % der Firmen mit konsistenten QA/QC-Prozessen halten Rework unter 5 % [16] **[B, international, nicht schweizspezifisch]**. *Aufwand:* S (Standardprodukt einführen). *Risiko:* tief. **Hier baut Colin nichts – hier führt er ein und schult.**

**A6 · Ausmass aus Foto oder LiDAR.** Flächen, Längen und Kubaturen aus Handy-Scan statt Messrad, direkt in NPK-Positionen übersetzt. *Markt:* **nicht verifiziert [?]**. *Nutzen:* **nicht belegbar [?]** – Genauigkeitsangaben zu LiDAR-Ausmass am Bau konnte ich nicht sourcen. *Aufwand:* L. *Risiko:* **hoch** – Ausmass ist abrechnungsrelevant, ein Messfehler ist ein Rechtsstreit. **Nicht als erstes Projekt verkaufen.**

**A7 · Lieferscheine per Foto.** Lieferschein abfotografieren, Menge, Lieferant, Material und Baustelle werden ausgelesen und der Kostenstelle zugeordnet. *Markt:* Abacus erfasst Lieferscheine in der Tagesrapport-App [1]; OCR-Extraktion ist Commodity. *Nutzen:* schliesst die Lücke zwischen Baustelle und Kreditorenbuchhaltung. *Aufwand:* S. *Risiko:* tief.

**A8 · Baustellen-Chatbot auf eigenen Dokumenten (RAG).** Frage in beliebiger Sprache: «Wie tief muss die Fundationsschicht hier?» – Antwort aus Werkvertrag, Plänen, SIA-Normen, NPK-Positionen, mit Quellenverweis. *Markt:* **nicht verifiziert [?]**. *Nutzen:* **nicht quantifizierbar [?]**. *Aufwand:* M. *Risiko:* **hoch bei Normen** – SIA- und NPK-Inhalte sind lizenzpflichtig; die digitale NPK-Nutzung erfordert ausdrücklich eine Datennutzungslizenz [9]. **Lizenzfrage vor der ersten Zeile Code klären.**

### Block B – Aufträge gewinnen

**B9 · SIMAP-Monitoring mit Relevanzfilter.** Tägliche Prüfung aller simap.ch-Publikationen gegen das eigene Profil, Ausgabe: drei relevante Ausschreibungen statt 300. *Markt:* **SCAIT** [6], suisseoffer (simap-api), IntelliProcure, Bidfix, Vergabemonitor von bauenschweiz [6]. *Nutzen:* Die öffentliche Hand beschafft über **41 Mrd. CHF pro Jahr** [14] **[B, Anbieterquelle – gegenprüfen]**. *Aufwand:* S. *Risiko:* tief.

**B10 · Automatische Vorprüfung der Ausschreibungsunterlagen.** Eignungs- und Zuschlagskriterien, Fristen, Referenzanforderungen, Bürgschaften und Risikoklauseln werden extrahiert und als Ampel dargestellt. *Markt:* **SCAIT belegt** – zweistufiger Filter plus automatische KI-Vorprüfung, «ohne 5'000 Seiten zu lesen» [6]. *Nutzen:* Nicht-Bieten ist auch eine Entscheidung – sie muss nur schnell und begründet fallen. *Aufwand:* M. *Risiko:* mittel – ein übersehenes Ausschlusskriterium kostet die Submission.

**B11 · Kalkulationsvorbereitung aus dem Devis.** CRBX-Datei einlesen, Positionen gegen die eigene Preisdatenbank und vergangene Projekte matchen, Vorkalkulation mit Abweichungsmarkern erzeugen. *Markt:* CRB liefert NPK-Editor und CRBX als standardisiertes Austauschformat [9]; KI-gestütztes Matching **nicht verifiziert [?]**. *Nutzen:* strukturell hoch, **Zeitersparnis nicht belegbar [?]**. *Aufwand:* M. *Risiko:* mittel – **Datennutzungslizenz und CRB-Zertifizierung sind Pflicht** [9].

**B12 · Offert- und Begleittexterstellung.** Technischer Bericht, Referenzblätter, Qualitätskonzept und Begleitschreiben aus Bausteinen plus Projektkontext. *Markt:* Generische LLM-Tools, kein bauspezifisches CH-Produkt verifiziert **[?]**. *Nutzen:* Das revidierte Beschaffungsrecht verschiebt von Preis- zu Qualitätswettbewerb [14] **[B]** – Textqualität wird zum Zuschlagsfaktor. *Aufwand:* S. *Risiko:* tief, sofern jede Zahl vom Menschen geprüft wird.

**B13 · Nachkalkulation je Position.** Soll-Ist-Vergleich Kalkulation gegen Rapportstunden, wöchentlich, positionsscharf. *Markt:* Funktion klassischer CH-Bausoftware **[?]**. *Nutzen:* die einzige Rückkopplung, die Kalkulationsfehler überhaupt sichtbar macht. *Aufwand:* M. *Risiko:* tief. **Setzt A1/A2 zwingend voraus.**

### Block C – Geld sichern

**C14 · Nachtragserkennung.** Rapporte, Chats, Fotos und Mails werden laufend auf Formulierungen wie «hat der Bauherr noch gewünscht», «Boden anders als im Baugrundgutachten», «zusätzlich» gescannt und als Nachtragskandidat gemeldet. *Markt:* **nicht verifiziert [?]**. *Nutzen:* SIA 118 definiert den Begriff «Nachtrag» gar nicht; die KBOB publiziert einen eigenen Leitfaden zum Nachtragsmanagement (V2.0) [14] **[B]**. Der Verlust entsteht nicht am Bau, sondern beim Nichtdokumentieren. *Aufwand:* M. *Risiko:* mittel – false positives nerven, false negatives kosten Geld.

**C15 · Automatisches Nachtragsdossier.** Aus erkanntem Nachtrag entsteht ein vollständiges Dossier: Sachverhalt, Anordnung, betroffene NPK-Positionen, Stunden, Material, Fotobelege, Preisbasis. *Markt:* **nicht verifiziert [?]**. *Nutzen:* Nach SIA 118 Art. 87 Abs. 4 darf die Bauleitung Bestellungsänderungen in Regie ausführen lassen, wenn keine Preiseinigung zustande kommt [14] **[B]** – wer schneller und belegter dokumentiert, verhandelt besser. *Aufwand:* M. *Risiko:* mittel.

**C16 · Kreditorenworkflow.** Rechnung per Foto oder Mail, Auslesen, Abgleich gegen Lieferschein und Bestellung, Freigaberouting, Übergabe an die Buchhaltung. *Markt:* Commodity; CH-Anbindung an Abacus, Bexio, Sage **nicht verifiziert [?]**. *Nutzen:* MWST-Normalsatz 8,1 % seit 1.1.2024, 2026 unverändert [14] **[B]** – Vorsteuerabzug scheitert an fehlenden Belegen. *Aufwand:* S. *Risiko:* tief.

**C17 · Fristenwächter Bauhandwerkerpfandrecht.** Das System kennt für jede Baustelle den «letzten Hammerschlag», rechnet die Frist und eskaliert automatisch. *Markt:* **nicht verifiziert [?]**. *Nutzen:* **Rechtslage geändert per 1. Januar 2026** – die Eintragungsfrist wurde von drei auf **vier Monate** verlängert (Art. 839 ZGB); zudem muss eine Ersatzsicherheit neu auch Verzugszinsen für **zehn Jahre** decken. Die Frist ist nicht erstreckbar, und die Eintragung muss **vollzogen** sein: das Gesuch am letzten Tag einzureichen genügt nicht [10], [14] **[B]**. *Aufwand:* S. *Risiko:* tief. **Stärkster Einzelfall im Katalog: geringer Aufwand, sechsstelliges Verlustpotenzial pro Fall.**

**C18 · Preis- und Teuerungsmonitoring.** Marktpreise für Stahl, Beton, Bitumen und Asphalt beobachten, gegen Teuerungsklauseln und Indexstände laufender Verträge halten, Nachforderungen auslösen. *Markt:* **nicht verifiziert [?]**. *Nutzen:* Materialpreissteigerungen konnten nur teilweise weitergegeben werden – ein belegter Treiber der 2–3-%-Marge [11] **[B] [V]**. *Aufwand:* M. *Risiko:* mittel – Datenverfügbarkeit für Schweizer Baustoffindizes **[?]**.

### Block D – Personal

**D19 · Arbeitszeitkontrolle nach LMV 2026.** Rapportstunden fliessen direkt in den betrieblichen Arbeitszeitkalender, Überstunden-, Minus- und Feriensalden laufen mit, Meldung an die PBK wird vorbereitet. *Markt:* CH-Lohn- und Bausoftware **[?]**. *Nutzen:* **Der LMV 2026–2031 gilt ab 1.1.2026 für sechs Jahre bis Ende 2031 und betrifft rund 80'000 Mitarbeitende.** Zu gewährleisten sind **2'112 Jahresstunden**; der betriebliche Arbeitszeitkalender ist der paritätischen Berufskommission **bis Mitte November** zuzustellen (Art. 27 Abs. 1 LMV); Überstunden werden ab 2026 automatisch ins neue Jahr übertragen [5] **[B]**. *Aufwand:* M. *Risiko:* mittel – die PBK führt systematische Lohnkontrollen mit Konventionalstrafen durch [14] **[B]**. **WIDERSPRUCH ZU PRÜFEN:** Die Bandbreiten differieren zwischen den Quellen – `04-bau-schweiz-markt.md` nennt −20 Minusstunden / +120 Überstunden [14], die SORBA-Zusammenfassung nennt einen Aufbau bis 200 bzw. bei finanzieller Absicherung bis 700 Stunden [5]. **Vor dem Meeting am LMV-Volltext verifizieren, im Deck keine dieser Zahlen ungeprüft nennen.**

**D20 · Disposition mit Wetter.** Personal- und Maschinenplanung für 5 bis 10 Tage, gekoppelt an Wetterprognose, mit Umplanungsvorschlag bei Regen oder Frost. *Markt:* **nicht verifiziert [?]**. *Nutzen:* **nicht quantifizierbar [?]**. *Aufwand:* M. *Risiko:* mittel – Akzeptanz beim Polier ist der Engpass, nicht die Technik.

**D21 · Mehrsprachige Sicherheitsunterweisung.** Toolbox-Talks und Instruktionen automatisch in acht Sprachen, als Audio und Kurzvideo, mit dokumentierter Kenntnisnahme. *Markt:* CENDAS zeigt automatische Übersetzung am Bau [2]. *Nutzen:* 286'000 Berufsunfälle 2023 zu 6,9 Mrd. CHF; Suva-Nettoprämie Bauhauptgewerbe 2,5 % [8] **[B]**; über 80 % Ausländeranteil in den tiefen Lohnklassen [15] **[B]**. *Aufwand:* S. *Risiko:* tief. **Prämienrelevanz ist das Argument, das den Onkel überzeugt – aber eine belegte Prämiensenkung durch Schulung konnte ich nicht sourcen [?].**

**D22 · Gefährdungsermittlung und BauAV-Konzept.** Sicherheits- und Gesundheitsschutzkonzept inklusive Notfallorganisation aus Projektdaten vorgenerieren. *Markt:* **nicht verifiziert [?]**. *Nutzen:* BauAV 2022 Art. 4 verlangt **vor Baubeginn ein schriftliches Konzept**; die Verordnung betrifft über 70'000 Betriebe [14] **[B]**. *Aufwand:* S. *Risiko:* mittel – **das Konzept bleibt Verantwortung des Betriebs, KI liefert nur den Entwurf.**

**D23 · Beinaheunfall-Meldung per Sprache.** 20 Sekunden in der Muttersprache aufs Handy, das System kategorisiert, anonymisiert optional und leitet weiter. *Markt:* **nicht verifiziert [?]**. *Nutzen:* Meldeschwelle sinkt drastisch, wenn nicht getippt und nicht Deutsch geschrieben werden muss [A]. *Aufwand:* S. *Risiko:* tief.

**D25 · Onboarding und Schulung mit KI-Übersetzung.** Betriebsregeln, Maschineneinweisung und Qualitätsstandards als übersetzte Kurzmodule mit Verständniskontrolle. *Markt:* 123erfasst hinterlegt Stammdaten mehrsprachig, etwa Deutsch und Polnisch [2]. *Nutzen:* siehe D24. *Aufwand:* S. *Risiko:* tief.

## 4. Priorisierung für den Pitch

**Sofort (Aufwand S, Risiko tief, belegter Nutzen):** C17 Pfandrecht-Fristenwächter · A2 Regierapport mit Belegkette · A5 Mängelmanagement (PlanRadar einführen, nicht bauen) · D21 mehrsprachige Sicherheitsunterweisung · C16 Kreditoren.

**Das Leuchtturmprojekt:** A1 mehrsprachiger Sprach-Rapport. Sichtbar für jeden auf der Baustelle, adressiert die belegte 31-%-Sprachrealität [4], und ein direktes Schweizer Konkurrenzprodukt liess sich nicht finden.

**Bewusst nicht zuerst:** A6 Ausmass (Rechtsrisiko), A4 Baufortschritt aus Bildern (BIM-Voraussetzung), E27 BIM (zu gross für den Einstieg).

## 5. Querschnittsrisiken, die in jedes Angebot gehören

1. **Datenschutz.** Das revDSG gilt seit 1.9.2023 und ist laut EDÖB direkt auf KI-Anwendungen anwendbar: Transparenzpflicht, Bearbeitungsverzeichnis, Datenschutz-Folgenabschätzung bei hohem Risiko [15] **[B]**. Rapportdaten sind Personendaten – Standortdaten und Leistungsbewertung besonders.
2. **Lizenzrecht.** Digitale NPK-Nutzung erfordert eine CRB-zertifizierte Anwendung **und** eine Datennutzungslizenz [9] **[B]**. Das betrifft B11, B13 und A8 direkt.
3. **Regulierung ist unterwegs.** Der Bundesrat beschloss am 12.2.2025 die Ratifikation der KI-Konvention des Europarats; eine Vernehmlassungsvorlage ist bis Ende 2026 angekündigt [15] **[B]**.
4. **Haftung.** Bei D22 (Sicherheitskonzept), A6 (Ausmass) und C15 (Nachtrag) bleibt die Verantwortung beim Betrieb. Jedes Angebot braucht die Formulierung «KI erstellt den Entwurf, der Mensch gibt frei».

## 6. Was ausdrücklich nicht belegbar ist

Zeitersparnis pro Tagesrapport in Schweizer Betrieben · Genauigkeit von LiDAR-Ausmass am Bau · Schweizer Zahlen zu Maschinen-Leerlauf und Baumaschinendiebstahl · Aufwand pro Submissionsangebot · Prämienwirkung von Sicherheitsschulungen bei der Suva · Sprachanteile auf Schweizer Baustellen (die SBV-Erhebung publiziert Nationalitäten, nicht Sprachen) [15]. **Für diese sechs Punkte im Deck keine Prozentwerte nennen.**

## 1. Kernbefund

Die Idee «Wir stellen unsere Leute und Maschinen stundenweise auf eine Plattform» ist in der naiven Form **eine regulatorische Falle, kein Produkt**. Wer Arbeitskräfte gegen Stundenentgelt an Dritte überlässt und dabei die wesentlichen Weisungsbefugnisse abtritt, betreibt **Personalverleih** – bewilligungspflichtig nach Art. 12 AVG, mit Kaution ab CHF 50'000 und zwingender GAV-Unterstellung nach Art. 20 AVG [1][3][9].

Das ist aber **kein Grund, die Idee zu beerdigen** – sondern der Grund, sie richtig zuzuschneiden. Der verkaufbare Kern ist ein **eigenes Kapazitäts- und Regie-Schaufenster**: Stirnimann verkauft weiterhin *Leistung* (Werkvertrag/Regie), nicht *Personal* – aber sichtbar, buchbar, mit Referenzen und transparenten Ansätzen. Das ist bewilligungsfrei, in Wochen umsetzbar und adressiert genau das Problem der Branche: unausgelastete Kapazität in einem 3-%-Margen-Geschäft.

## 2. Der rechtliche Rahmen – BELEGT

### 2.1 Wann liegt Personalverleih vor?

Als Verleiher gilt, **wer einen Arbeitnehmer einem Einsatzbetrieb überlässt und diesem dabei wesentliche Weisungsbefugnisse abtritt** (Art. 12 AVG; Art. 26 Abs. 1 AVV) [1][2][9]. Das Kriterium ist die **Weisungsmacht**, nicht die Bezeichnung im Vertrag.

Das Gesetz kennt drei Formen [2][6][7]:

| Form | Beschreibung | Bewilligungspflichtig? |
|---|---|---|
| **Temporärarbeit** | Rahmenvertrag mit dem Arbeitnehmer, danach befristete Einsatzverträge in wechselnden Einsatzbetrieben | **Ja** |
| **Leiharbeit** | Fester Arbeitsvertrag, dessen Zweck hauptsächlich im Überlassen an Einsatzbetriebe liegt | **Ja** |
| **Gelegentliches Überlassen** | Aus besonderem Anlass, z. B. bei Auftragsspitzen an einen befreundeten Betrieb | **Nein** |

> **Für den Pitch entscheidend:** Das gelegentliche Überlassen ist die Ausnahme für den Einzelfall. Eine **Plattform**, die systematisch und dauerhaft Personal stundenweise anbietet, ist per Definition kein «gelegentliches» Überlassen mehr. Wer das Angebot institutionalisiert, verlässt die Ausnahme.

### 2.2 Abgrenzung Personalverleih ↔ Werkvertrag / Auftrag / Subunternehmer

Die Abgrenzung erfolgt laut SECO **immer im Einzelfall** anhand der tatsächlichen Verhältnisse [3][4][5]:

| Kriterium | Spricht für **Personalverleih** (bewilligungspflichtig) | Spricht für **Werkvertrag / Auftrag** (frei) |
|---|---|---|
| **Weisungsrecht** | Liegt beim Einsatzbetrieb | Bleibt beim leistenden Unternehmen |
| **Eingliederung** | Arbeit am Ort und in den Arbeitszeiten des Einsatzbetriebs | Eigene Organisation, eigene Zeiteinteilung |
| **Werkzeug / Material / Geräte** | Vom Einsatzbetrieb gestellt | Vom leistenden Unternehmen gestellt |
| **Abrechnung** | Nach geleisteten Stunden | Nach Werkerfolg / Pauschale / Einheitspreisen |
| **Gewährleistung** | Keine – Stunden sind Stunden | Nachbesserung, Minderung bei Nichterreichen des Ziels |

Die SECO-Weisungen und -Erläuterungen werden von Schweizer Gerichten als Auslegungshilfe herangezogen [4][5].

> **Die gefährliche Stelle für Stirnimann:** Regiearbeit wird **nach Stunden** abgerechnet – ein Kriterium, das für Verleih spricht. Regie ist trotzdem sauber, solange Weisungsrecht, Eigenverantwortung, Werkzeug und Gewährleistung beim Bauunternehmen bleiben. Eine Plattform, die «Bauarbeiter, CHF 95/h, buchbar ab Montag» bewirbt, produziert genau die falsche Optik: Sie beschreibt Personal, nicht Leistung. **Marketing-Sprache kann hier zur Qualifikationsfrage werden.**

### 2.3 Bewilligung und Kaution

- **Kantonale Bewilligung** für Verleih im Inland; **eidgenössische Bewilligung** zusätzlich für Verleih ins Ausland; beide können mit demselben Gesuch bei der kantonalen Behörde beantragt werden [1][8][10].
- **Kaution** (Art. 14 AVG, GebV-AVG) [9][10]:

| Situation | Kaution |
|---|---|
| Grundbetrag pro bewilligtem Betrieb | **CHF 50'000** |
| Bei über **60'000 Einsatzstunden** im Vorjahr | **CHF 100'000** |
| Zuschlag für eidg. Bewilligung (Auslandverleih) | **+ CHF 50'000** (also bis CHF 150'000) |

Die Kaution ist **Voraussetzung** für die Bewilligung – diese wird erst nach ordnungsgemässer Hinterlegung erteilt [9].

### 2.4 Zusätzlich im Bau: LMV- und GAV-Unterstellung

Nach **Art. 20 AVG** in Verbindung mit **Art. 48a AVV** muss ein Verleiher die **Lohn- und Arbeitszeitbestimmungen des allgemeinverbindlich erklärten GAV der Einsatzbranche** einhalten [11][12]. Im Bauhauptgewerbe ist das der **LMV** [13].

Der LMV gilt für Arbeitnehmende der unterstellten Betriebe, **unabhängig von Entlöhnungsart und Anstellungsort**, sofern sie auf Baustellen arbeiten – und auch für Hilfstätigkeiten für den Baubetrieb [11][13]. Ergänzend besteht der **allgemeinverbindliche GAV Personalverleih**, der die Lohn- und Arbeitszeitbestimmungen der Einsatzbranchen übernimmt [12][14].

> **Praktische Folge:** Ein Bau-Verleih hat zwei Regelwerke gleichzeitig zu erfüllen (GAV Personalverleih + LMV) plus AVG-Bewilligung plus Kaution. Für ein KMU ohne eigene HR-Abteilung ist das ein eigenes Geschäftsfeld, kein Nebenprodukt einer Website.

### 2.5 Sonderfall Maschinenvermietung

Hier verläuft die Grenze anders und ist für Stirnimann die **attraktivere Spur**:

- **Maschine ohne Bediener** → reine **Miete** (OR). AVG spielt keine Rolle. Bewilligungsfrei.
- **Maschine mit Bediener, Bediener bleibt unter Weisung von Stirnimann** → **Werkvertrag/Auftrag**. Bewilligungsfrei.
- **Maschine mit Bediener, Kunde weist den Maschinisten an, Abrechnung nach Stunden** → kippt in Richtung **Personalverleih** [3][4].

*Einschätzung (nicht belegt):* Die Trennlinie ist operativ steuerbar – über Vertragstext, Rapportierung und die Frage, wer den Einsatz disponiert. Das ist ein konkreter Beratungsauftrag, den Colin verkaufen kann.

### 2.6 Vor dem Meeting zu verifizieren – NICHT BELEGT

Folgende Punkte sind fachlich naheliegend, konnten in dieser Recherche aber **nicht** belegt werden. **Im Meeting nicht als Fakt behaupten:**

- Genaue Bussenhöhe für Verleih ohne Bewilligung (Art. 39 AVG).
- Verbot des Personalverleihs **aus dem Ausland in die Schweiz** (vermutlich Art. 12 Abs. 2 AVG).
- Entsenderecht (EntsG) und Meldeverfahren bei grenzüberschreitendem Einsatz – Primärquelle SECO ist bekannt, aber nicht abrufbar [siehe Schwesterdokument `04-bau-schweiz-markt.md`, Quelle 24].
- GAV-Status und Mindestlöhne für **Poliere und Werkmeister** (eigener GAV, nicht in der LMV-Lohntabelle).
- Ob der LMV eigene Bestimmungen zum Verleih oder ein Verleihverbot enthält.

## 3. Preisgestaltung Regiearbeit – belegte Zahlen

### 3.1 LMV-Mindestlöhne 2026 (Untergrenzen, nicht Marktlöhne)

Der neue **LMV 2026–2031** gilt ab 01.01.2026. Neu werden die Mindestlöhne jeweils per 1. Januar automatisch an die Teuerung (LIK per 30.09. des Vorjahres) angepasst, sofern diese zwischen 0 und 2 % liegt. Für 2026 gibt es keine generelle prozentuale Erhöhung der Effektivlöhne, dafür neue Mindestlöhne und eine **Baustellenzulage von CHF 4 pro Arbeitstag** [15][16].

| Lohnklasse | Funktion | Mindestlohn/Monat (je Lohnzone) | Umgerechnet CHF/h* |
|---|---|---|---|
| **C** | Bauarbeiter ohne Fachkenntnisse | CHF 4'747 – 4'885 | CHF 26.95 – 27.75 (belegt) [17] |
| **B** | Bauarbeiter | CHF 5'184 – 5'458 | ca. 29.45 – 31.00 (eigene Umrechnung) |
| **Q** | Gelernter Bau-Facharbeiter | CHF 6'179 – 6'442 | ca. 35.10 – 36.60 (eigene Umrechnung) |
| **V** | Vorarbeiter (Lohnzone Rot) | CHF 6'702 | ca. 38.10 (eigene Umrechnung) |

\* **Eigene Umrechnung**, Divisor 2'112 Jahresstunden. Dieser Divisor wurde aus den belegten C-Werten rückgerechnet (4'747 × 12 ÷ 26.95 ≈ 2'114) und ist mit beiden belegten Stundenwerten konsistent. **Lohnklasse A ist in dieser Recherche nicht belegt.** Für Q gelten in den ersten drei Jahren nach der Lehre Abschläge von 15 % / 10 % / 5 % [16][18].

Zum Vergleich: Der **Durchschnittslohn** im Bauhauptgewerbe liegt bei rund **CHF 82'000 pro Jahr** (+0,3 %) [19] – deutlich über den Mindestlöhnen. Die LMV-Werte sind Untergrenzen, keine Kalkulationsbasis.

### 3.2 Vom Lohn zum Regieansatz

- **Verrechnungssätze für Handwerker in der Schweiz 2026: CHF 85 – 150 pro Stunde**, je nach Gewerk [20].
- **Der Verrechnungssatz liegt typisch beim 2,5- bis 3-Fachen des Brutto-Stundenlohns** [20][21]. *(Beides Anbieter-/Fachblogs – mittlere Verlässlichkeit, für ein Deck idealerweise gegenprüfen.)*
- **Verbindliche Kalkulationsgrundlage der Branche:** die «Kalkulationshilfen für Regiearbeiten» (KR) von **IPB und SBV** – jährlich aktualisiert, **unverbindlich**, Ausgabe 2026 verfügbar, mit Ansätzen für Material, Maschinen und Geräte je nach Region der Baustelle [22].
- **Normative Grundlage:** SIA-Norm 118, Art. 48 ff. regelt die Vergütung von Regiearbeiten. **Poliere und Vorarbeiter sind mit den für sie massgebenden Regieansätzen besonders zu vergüten** [23].
- Zuschläge sind möglich bei Überstunden, Schicht-/Nacht-/Samstags-/Sonntagsarbeit, Versetzung, Schlechtwetter sowie Arbeiten in Wasser oder Schlamm [22].
- Die öffentliche Hand hat ein eigenes **KBOB-Faktenblatt zum Umgang mit Ausschreibung, Vergabe und Vergütung von Regiearbeiten (V2.0, 14.02.2024)** [24].

**Plausibilitätsprüfung (eigene Rechnung):** Ein Q-Facharbeiter zu CHF 35–37/h × Faktor 2,5–3 ergibt **CHF 88–110/h** Verrechnungssatz. Das liegt sauber im belegten Marktband von CHF 85–150 [20]. Die Zahlen sind untereinander konsistent – für ein Deck belastbar genug.

## 5. Was Plattformen trägt oder scheitern lässt – EINSCHÄTZUNG, nicht belegt

Ohne Quellen, daher qualitativ und ohne Zahlen. Für das Deck nur als Argumentationslinie verwenden, nicht als Fakt:

**Erfolgsfaktoren:** Liquidität auf beiden Marktseiten (genug Angebot *und* Nachfrage in derselben Region, sonst ist die Plattform leer); Vertrauen über verifizierte Referenzen und Bewertungen; Preistransparenz; verlässliche Terminverfügbarkeit; niedrige Reibung bei Anfrage und Abschluss.

**Typische Scheitergründe:** Das Henne-Ei-Problem beim Start; zu dünne regionale Dichte; Disintermediation (Parteien finden sich einmal über die Plattform und rechnen danach direkt ab); Qualitätsstreuung, die das Vertrauen zerstört; zu hohe Take-Rate für ein margenschwaches Gewerbe.

> **Die relevante Schlussfolgerung für Stirnimann:** Ein einzelnes Bau-KMU kann die Liquiditätsbedingung eines Marktplatzes nicht erfüllen. Ein Marktplatz braucht viele Anbieter und viele Nachfrager. **Stirnimann ist ein Anbieter.** Der Marktplatz ist deshalb strategisch das falsche Ziel – das richtige ist die eigene Nachfragekanalisierung.

## 6. Die realistische Alternative: Kapazitäts- und Regie-Schaufenster – VORSCHLAG

Kein Marktplatz. Ein **eigenes, digitales Schaufenster für Regie- und Kleinaufträge** unter der Marke Stirnimann. Rechtlich sauber, weil durchgehend **Leistung statt Personal** verkauft wird.

**Bestandteile:**

1. **Leistungskatalog statt Personalkatalog** – beworben werden Arbeitsergebnisse («Fundamentsanierung», «Aushub bis 50 m³», «Umgebungsarbeiten»), nie Personen oder Berufsbilder.
2. **Transparente Regieansatz-Liste** nach Kategorie, kalkuliert auf Basis der SBV/IPB-Kalkulationshilfen [22] und der LMV-Klassen (Abschnitt 3).
3. **Kapazitätsanzeige** – freie Mann-Tage und Maschinenverfügbarkeit der nächsten 2–4 Wochen, gepflegt aus der bestehenden Einsatzplanung. Das ist der eigentliche Differenzierer: Kein Mitbewerber zeigt, wann er kann.
4. **Referenzen mit Substanz** – Bild, Ort, Leistungsumfang, Dauer, Kunden-O-Ton. Bewertungen nur, wenn echte Kunden sie abgeben; erfundene oder eingekaufte Bewertungen sind ausgeschlossen.
5. **Strukturierte Anfrage statt Telefon** – Formular, das direkt einen verwertbaren Datensatz erzeugt (Ort, Leistung, Termin, Umfang, Zugänglichkeit, Fotos).
6. **KI dort, wo sie wirklich Zeit spart:** Anfrage-Triage und Vorqualifizierung, automatischer Terminvorschlag aus der Kapazitätsplanung, Erstentwurf der Regievereinbarung, Rapport-Erfassung per Sprache auf der Baustelle.
7. **Vertragslogik als Schutzschicht** – jede Buchung erzeugt eine **Regie-/Werkvertragsbestätigung**, nie einen Verleihvertrag. Weisungsrecht, Werkzeugstellung und Gewährleistung bleiben explizit bei Stirnimann (Abschnitt 2.2).

**Der Rapport-Hebel:** SIA 118 verlangt für jeden Abrechnungsposten einen Beleg; fehlt der gegengezeichnete Regierapport, ist die Leistung erbracht, aber nicht durchsetzbar [siehe `04-bau-schweiz-markt.md`, Quelle 14]. Eine digitale Rapporterfassung mit Kundenunterschrift auf dem Tablet ist damit **kein Komfort-Feature, sondern direkte Margensicherung**.

## 7. Aufwand und Nutzen – SCHÄTZUNG, keine Quelle

**Alle Zahlen in diesem Abschnitt sind eigene Annahmen für die Angebotsgestaltung, keine recherchierten Werte.**

| Position | Schätzung |
|---|---|
| Aufbau Schaufenster inkl. Kapazitätsanzeige, Anfragestrecke, Referenzen | CHF 8'000 – 20'000 einmalig |
| Betrieb (Hosting, Wartung, kleine Anpassungen) | CHF 150 – 400 / Monat |
| Ergänzung digitale Regierapporte | separat zu offerieren |

**Modellrechnung Deckungsbeitrag (Annahmen offengelegt):** Ein Team aus 1 Vorarbeiter + 2 Bauarbeitern, 5 bisher unterausgelastete Tage pro Monat, Verrechnungssatz CHF 95/h (Mitte des belegten Bandes [20]), Vollkosten angenommen CHF 60/h, 8 Stunden pro Tag:

- Zusatzumsatz: 95 × 8 × 3 × 5 = **CHF 11'400 / Monat**
- Zusatz-Deckungsbeitrag: (95 − 60) × 8 × 3 × 5 = **CHF 4'200 / Monat**

Bei diesen Annahmen amortisiert sich die obere Aufbau-Schätzung in rund fünf Monaten. **Der Vollkostensatz von CHF 60/h ist eine Annahme und muss mit Stirnimanns echter Kalkulation ersetzt werden** – das ist der erste gemeinsame Arbeitsschritt, nicht eine Behauptung von Colin.

## 8. Die drei Sätze für das Meeting

1. **«Eure Leute stundenweise vermieten heisst rechtlich Personalverleih – Bewilligung plus CHF 50'000 Kaution plus doppelte GAV-Pflicht. Das wollt ihr nicht.»** (Art. 12 AVG, Art. 14 AVG, Art. 20 AVG [1][9][11])
2. **«Was ihr wollt, ist dasselbe Geschäft ohne die Bewilligung: Ihr verkauft Leistung statt Personal – und zeigt online, wann ihr könnt und was es kostet.»**
3. **«Und der Regierapport ist kein Papierkram, sondern eure Marge: Ohne gegengezeichneten Beleg ist die Leistung erbracht, aber nicht durchsetzbar.»** (SIA 118)

# Datenschutz und Schweizer Hosting für KI-Lösungen

**Fokus:** Gesundheitsdaten (Arztpraxen, Jana Rohrer) und Personaldaten (Bau, Stirnimann Bau AG)
**Stand:** 17.08.2026

---

## 0. Methodik- und Verlässlichkeitshinweis — bitte zuerst lesen

Diese Recherche konnte **nicht** wie vorgesehen mit Live-Webrecherche erstellt werden. Zwei harte
Einschränkungen der Ausführungsumgebung:

1. **Suchbudget erschöpft.** Die Session hatte ihr Kontingent (200 von 200 Websuchen) bereits durch
   die Parallelrecherchen 01–06 verbraucht. Es war **keine einzige eigene Websuche** möglich.
2. **Egress-Sperre.** Direktabrufe wurden vom Netzwerk-Proxy blockiert für: `fedlex.admin.ch`,
   `edoeb.admin.ch`, `admin.ch`, `bag.admin.ch`, `bfs.admin.ch`, `infomaniak.com`, `exoscale.com`,
   `swisscom.ch`, `green.ch`, `nine.ch`, `hostpoint.ch`, `learn.microsoft.com`, `aws.amazon.com`,
   `huggingface.co`, `arxiv.org`, `digital-strategy.ec.europa.eu`, `wikipedia.org`, `datenrecht.ch`,
   `steigerlegal.ch`. Erreichbar war einzig `cloud.google.com`.

Konsequenz für die Kennzeichnung. Jede Aussage trägt eines dieser Labels:

| Label | Bedeutung |
|---|---|
| **[B]** | Belegt — Quelle in dieser Session abgerufen |
| **[P]** | Belegt über die Parallelrecherche desselben Projekts (Dateien 01–06, Abruf 17.08.2026) |
| **[G]** | Gesetzestext aus Modellwissen, kanonische Fundstelle genannt, **in dieser Session nicht verifizierbar** — vor Kundenverwendung im Volltext gegenlesen |
| **[S]** | Schätzung / fachliche Einordnung des Autors, keine Quelle |
| **[NB]** | Nicht belegbar |

**Verbindliche Regel für das Deck:** Alle **[G]**-Artikelnummern und alle Preis-/Produktangaben in
Abschnitt 5 sind vor dem Meeting an der Primärquelle zu prüfen. Sie sind fachlich plausibel, aber in
dieser Session nicht nachgewiesen. Keine dieser Zahlen gehört ungeprüft auf eine Folie.

---

## 1. revDSG — die Pflichten, die jedes KI-Angebot auslöst

Das revidierte Datenschutzgesetz (**DSG, SR 235.1**) ist seit **01.09.2023** in Kraft. Der EDÖB hat
klargestellt: Das DSG ist **direkt auf KI-gestützte Datenbearbeitungen anwendbar** — es braucht dafür
kein separates KI-Gesetz. **[P, Q1]**

Für beide Pitch-Adressaten relevant, in der Reihenfolge der Verkaufswirkung:

| Pflicht | Fundstelle | Was das konkret heisst | Label |
|---|---|---|---|
| **Besonders schützenswerte Personendaten** | Art. 5 lit. c DSG | Gesundheitsdaten fallen darunter, ebenso biometrische und genetische Daten sowie Daten über administrative/strafrechtliche Verfolgungen. Für die Praxis-Kundin: praktisch der gesamte Datenbestand. | **[G]** |
| **Auftragsbearbeitung** | Art. 9 DSG | Übertragung an einen Dienstleister nur zulässig, wenn (a) der Dienstleister die Daten so bearbeitet, wie der Verantwortliche selbst es dürfte, und (b) **keine gesetzliche oder vertragliche Geheimhaltungspflicht entgegensteht**. Der Verantwortliche muss sich vergewissern, dass der Auftragsbearbeiter die Datensicherheit gewährleisten kann. **Subunternehmer nur mit vorgängiger Genehmigung.** | **[G]** |
| **Datensicherheit** | Art. 8 DSG, Konkretisierung in der DSV | Angemessene technische und organisatorische Massnahmen; die Verordnung nennt Mindestanforderungen (Vertraulichkeit, Verfügbarkeit, Integrität, Nachvollziehbarkeit). | **[G]** |
| **Bearbeitungsverzeichnis** | Art. 12 DSG | Die KMU-Ausnahme (< 250 Mitarbeitende) **greift nicht** bei umfangreicher Bearbeitung besonders schützenswerter Personendaten oder Profiling mit hohem Risiko. Eine Praxisverwaltungsfirma hat das Verzeichnis also zwingend. | **[G]/[P, Q6]** |
| **Datenschutz-Folgenabschätzung (DSFA)** | Art. 22 DSG | Nötig bei hohem Risiko; ein hohes Risiko besteht **namentlich bei umfangreicher Bearbeitung besonders schützenswerter Personendaten**. Bei Ambient-Scribe, Dossier-Chat oder zentralem Praxis-Dashboard also regelmässig zu bejahen. Verbleibt trotz Massnahmen ein hohes Restrisiko: Konsultation des EDÖB (Art. 23). | **[G]/[P, Q6]** |
| **Meldung von Verletzungen** | Art. 24 DSG | Meldung an den EDÖB **«so rasch als möglich»** — nicht die 72-Stunden-Frist der DSGVO. Der Auftragsbearbeiter meldet dem Verantwortlichen. | **[G]** |
| **Automatisierte Einzelentscheidung** | Art. 21 DSG | Informationspflicht, wenn eine Entscheidung ausschliesslich automatisiert ergeht und Rechtswirkung entfaltet. Relevant für No-Show-Scoring und automatisierte Personalbewertung. | **[P, Q1]** |
| **Bearbeitungsreglement / Protokollierung** | DSV (SR 235.11) | Für Private, die besonders schützenswerte Daten in grossem Umfang automatisiert bearbeiten: Bearbeitungsreglement und Protokollierung. **Artikelnummern vor Verwendung prüfen.** | **[G] — Nummern unsicher** |

**Sanktionslogik als Verkaufsargument [G]:** Das DSG sanktioniert mit **Busse bis CHF 250'000** und
richtet sich — anders als die DSGVO — gegen **natürliche Personen**, nicht gegen den
Unternehmensumsatz. Strafbar ist unter anderem, wer vorsätzlich die Bearbeitung einem
Auftragsbearbeiter überträgt, ohne die Voraussetzungen von Art. 9 zu erfüllen, oder wer Daten unter
Verletzung der Auslandregeln bekanntgibt (Art. 60–62 DSG). Für Widerhandlungen in Geschäftsbetrieben
kann bei Bussen bis CHF 50'000 das Unternehmen belangt werden (Art. 64 DSG i.V.m. VStrR).
*Pitch-Übersetzung:* Es haftet der Geschäftsführer persönlich, nicht die AG. Das trifft Onkel und
Cousine gleichermassen — und ist das wirksamste Argument für saubere Verträge.

---

## 2. Bekanntgabe ins Ausland (Art. 16/17 DSG)

**[G] Grundregel Art. 16 Abs. 1:** Bekanntgabe ins Ausland nur, wenn der **Bundesrat** festgestellt
hat, dass der Zielstaat einen angemessenen Datenschutz gewährleistet. Diese Länderliste steht in
**Anhang 1 der Datenschutzverordnung (DSV, SR 235.11)**.

**[G] Ohne Angemessenheitsbeschluss** (Art. 16 Abs. 2) braucht es Garantien: Standarddatenschutz-
klauseln, die der EDÖB genehmigt/anerkannt hat (in der Praxis: die EU-SCC mit Schweizer Anpassungen),
verbindliche unternehmensinterne Datenschutzvorschriften (BCR), einen Staatsvertrag oder
vorgängig dem EDÖB mitgeteilte Vertragsklauseln.

**[G] USA — der Sonderfall.** Die USA stehen auf der Liste **nur für Unternehmen, die unter dem
Swiss-U.S. Data Privacy Framework zertifiziert sind**. Der Bundesrat anerkannte das Framework 2024
(Inkraftsetzung nach meinem Kenntnisstand 15.09.2024 — **Datum zwingend verifizieren**). Praktische
Folge: Ein US-Anbieter ist nicht automatisch zulässig, sondern nur bei **aktiver DPF-Zertifizierung**,
die auf der Liste des US-Handelsministeriums nachprüfbar ist. Und: Das DPF deckt die
**Geheimhaltungspflicht nach Art. 321 StGB nicht ab** — das ist eine separate, strengere Hürde.

**[G] Ausnahmen (Art. 17):** ausdrückliche Einwilligung, Vertragserfüllung mit der betroffenen Person,
Rechtsansprüche, Schutz von Leben und Unversehrtheit. Für den Dauerbetrieb einer KI-Lösung sind sie
untauglich — sie tragen Einzelfälle, keinen Regelbetrieb.

---

## 3. Ärztliches Berufsgeheimnis (Art. 321 StGB) — der eigentliche Engpass

Das ist der Punkt, an dem Jana Rohrers Geschäft steht oder fällt, und er wird in Verkaufsgesprächen
regelmässig unterschätzt: **Datenschutzkonformität genügt nicht.**

**[P, Q2]** Ärztinnen, Ärzte und **ihre Hilfspersonen** unterstehen dem Berufsgeheimnis nach
**Art. 321 StGB**; die Strafdrohung beträgt bis zu **drei Jahre Freiheitsstrafe**, und sie gilt auch
nach Aufgabe der Berufsausübung. Die Liste der erfassten Berufe wurde per Revision auf weitere
Gesundheitsberufe (u. a. Pflegefachpersonen, Psychologen, Physiotherapeuten) ausgedehnt **[G]**.

**[P, Q3]** Cloud- und KI-Verarbeitung ist zulässig, wenn der Anbieter **vertraglich als
weisungsgebundene Hilfsperson in einem Subordinationsverhältnis** eingebunden wird und
technisch-organisatorische Massnahmen das Geheimnis wahren — **insbesondere Verschlüsselung mit
Schlüsselkontrolle beim Leistungserbringer**. Die tragende Fachpublikation dazu ist David Rosenthal,
«Mit Berufsgeheimnissen in die Cloud» **[P, Q4]**; der rechtliche Leitfaden von FMH/SAMW ist die
verbandsseitige Referenz **[P, Q3]**.

**[S] Einordnung, ehrlich gesagt:** Das ist herrschende Lehre und gelebte Praxis, aber **keine
höchstrichterlich abschliessend geklärte Frage**. Die Kernidee: Wer den Daten technisch nicht
zugänglich ist (starke Verschlüsselung, Schlüssel bleibt beim Arzt), «offenbart» nichts im Sinne von
Art. 321. Sobald ein Modell Klartext sieht — und das tut jedes LLM bei der Inferenz — greift diese
Argumentation nicht mehr, und es braucht die Hilfspersonen-Konstruktion plus Datenlokalisierung.

**Drei Konsequenzen für das Angebot [S]:**
1. Der Auftragsbearbeitungsvertrag braucht eine **explizite Berufsgeheimnis-Klausel** (Hilfspersonen-
   stellung, Weisungsbindung, Schweigepflicht der Mitarbeitenden, Strafandrohung), nicht nur die
   DSG-Standardklauseln.
2. **Sub-Auftragsbearbeiter sind das Leck.** Art. 9 Abs. 3 DSG verlangt vorgängige Genehmigung; bei
   US-Hyperscalern als Unterlieferanten ist die Hilfspersonen-Kette faktisch nicht mehr kontrollierbar.
3. **EPD-Kontext [P, Q5]:** Der Anschluss an das elektronische Patientendossier ist heute nur für seit
   2022 neu zugelassene Praxen verpflichtend; eine Anschlusspflicht für den ganzen ambulanten Sektor
   wird mit der EPDG-Revision erwartet (Zeitachse 2027–2029 ist eine **Prognose**, keine Rechtslage).
   Ob das EPDG zwingend Hosting in der Schweiz vorschreibt: **[NB]** in dieser Session — die
   Zertifizierungsanforderungen an Stammgemeinschaften sind vor einer Zusage zu prüfen.

---

## 4. Personaldaten am Bau — die unterschätzte Parallele

**[S/P, Q7]** Rapportdaten sind Personendaten. Kritisch werden sie in drei Ausprägungen:

- **Standortdaten** aus Tagesrapport-Apps und Maschinentelematik → Bewegungsprofile von Mitarbeitenden.
- **Leistungsbewertung** durch Auswertung von Rapportdaten → Profiling; bei hohem Risiko DSFA-pflichtig.
- **Gesundheitsdaten** über Unfallmeldungen und Absenzen → besonders schützenswert, gleiche Kategorie
  wie beim Arzt.

**[S]** Zusätzlich, arbeitsrechtlich und nicht datenschutzrechtlich: **Art. 26 ArGV 3** verbietet
Überwachungssysteme, die das Verhalten der Arbeitnehmenden am Arbeitsplatz überwachen. Zulässig ist
Erfassung zu Leistungs- oder Sicherheitszwecken, nicht zur Verhaltenskontrolle. **Artikel und
Wortlaut vor Verwendung prüfen** — in dieser Session nicht verifizierbar. Das ist der Satz, mit dem
man beim Onkel Vertrauen gewinnt: Nicht «wir tracken alles», sondern «wir erfassen den Rapport, nicht
den Menschen».

---

## 5. Schweizer Hosting- und KI-Optionen

**Wichtig: Der gesamte folgende Abschnitt ist [V]/[S].** Alle Anbieterangaben stammen aus Modellwissen
(Stand Mai 2026) bzw. aus der Parallelrecherche; **keine Preisangabe konnte in dieser Session

---

## 6. Open-Weight-Modelle für den Eigenbetrieb

Alle Angaben **[S]** aus Modellwissen (Stand Mai 2026), Lizenzen vor kommerzieller Nutzung prüfen.

| Modell | Herkunft | Lizenz | Reife / Eignung |
|---|---|---|---|
| **Apertus** (8B / 70B) | **Swiss AI Initiative — ETH Zürich, EPFL, CSCS**; trainiert auf «Alps» | Apache 2.0, vollständig offen (Gewichte, Daten, Rezept) | Der **politisch stärkste Aufhänger für einen Schweizer Pitch**: ein Schweizer Modell aus öffentlicher Forschung. Qualität unter den US-Spitzenmodellen. Release 2025 — **Datum und Grössen verifizieren**. |
| **Llama** (Meta) | USA | Llama Community License — **nicht OSI-offen**, Nutzungsbeschränkungen und Namensnennungspflicht | Reifster Open-Weight-Stack, breiteste Tool-Unterstützung. |
| **Mistral** | Frankreich (EU) | Kleinere Modelle Apache 2.0, grosse unter eigener Lizenz | Gute Deutsch-/Französisch-Leistung, EU-Anbieter — für Datenschutzargumentation angenehm. |
| **Qwen** | China (Alibaba) | überwiegend Apache 2.0 | Technisch stark, aber **Herkunftsfrage** bei konservativen Schweizer Kunden. |

**[S] Hardwarebedarf, Faustregeln (keine Messwerte):**
- 7–8B-Modell, 4-Bit-Quantisierung: ca. 6–8 GB VRAM → läuft auf einer einzelnen Consumer-GPU.
- 70B-Modell, 4-Bit: ca. 40–48 GB VRAM → 1× H100 80 GB oder 2× 48-GB-Karten.
- **Ehrliche Einordnung:** Eigenbetrieb lohnt sich für Colins Kunden **nicht** bei kleinen Volumina.
  Der Schweizer API-Anbieter ist fast immer die richtige Antwort; Eigenbetrieb ist ein Argument für
  Souveränität, kein Kostenargument.

---

## 7. EU AI Act und Schweizer KI-Regulierung

**EU AI Act [P, Q10]:** Die Schweiz ist nicht direkt gebunden, **Anbieter mit EU-Bezug schon** — die
Verordnung erfasst auch Drittstaaten-Anbieter, deren Systeme oder deren Output in der EU verwendet
werden. Der **Digital Omnibus** (Kommissionsvorschlag November 2025, in Kraft 27.07.2026) verschiebt
die Hochrisiko-Pflichten: **Annex-III-Systeme auf den 02.12.2027**, produktintegrierte KI nach Annex I
auf den **02.08.2028**; Einigung Rat/Parlament am 07.05.2026.

**Schweiz [P, Q11]:** Bundesratsentscheid **12.02.2025** — Ratifikation der KI-Konvention des
Europarats, **sektorieller Ansatz** statt eines eigenen KI-Gesetzes. Das EJPD erstellt **bis Ende 2026**
eine Vernehmlassungsvorlage zu Transparenz, Datenschutz, Nichtdiskriminierung und Aufsicht.

**[S] Pitch-Übersetzung:** «Eine Regulierung ist unterwegs, aber noch nicht in Kraft. Wer heute
Governance mitbaut, hat in zwei Jahren keinen Umbau.» Das ist ein Verkaufsargument, keine
Panikmache — und es ist ehrlich.

---

## 8. Praktische Faustregeln für den Alltag

**[S] Was darf in ein US-LLM — die Ampel für Colins Kunden:**

| Grün — unproblematisch | Gelb — nur pseudonymisiert / mit ABV | Rot — nie |
|---|---|---|
| Öffentliche Ausschreibungstexte, Normtexte | Interne Prozessdokumente ohne Namen | Patientendaten in jeder Form |
| Marketingtexte, Website-Inhalte | Anonymisierte Fallbeschreibungen | Diagnosen, Befunde, Medikation |
| Generischer Code, Vorlagen | Aggregierte Kennzahlen ohne Personenbezug | Namen + Gesundheitsdaten kombiniert |
| Allgemeine Fachfragen | Lieferanten-/Firmendaten | Personaldossiers, AHV-Nummern, Lohndaten |
| | | Bewerbungsunterlagen |

**[S] Pseudonymisierung — die ehrliche Warnung:** Namen ersetzen genügt bei **Freitext nicht**. Ein
Arztbericht bleibt über Kontext (Alter, Diagnose, Ort, Zeitpunkt) re-identifizierbar. Pseudonymisierte
Daten sind für denjenigen, der re-identifizieren kann, weiterhin Personendaten. Pseudonymisierung
senkt das Risiko, sie beendet die Rechtspflichten nicht.

**[S] Checkliste Auftragsbearbeitungsvertrag (ABV) — was drinstehen muss:**
1. Weisungsbindung und Zweckbindung (Art. 9 Abs. 1 DSG)
2. Liste der Sub-Auftragsbearbeiter + **vorgängige Genehmigungspflicht** (Art. 9 Abs. 3 DSG)
3. Technische und organisatorische Massnahmen, benannt und prüfbar (Art. 8 DSG)
4. **Bearbeitungsort** explizit: «ausschliesslich Schweiz»
5. **Ausschluss der Trainingsnutzung** — ausdrücklich, nicht «nach Wahl des Anbieters»
6. Meldepflicht an den Verantwortlichen bei Sicherheitsverletzungen (Art. 24 Abs. 3 DSG)
7. Löschung und Rückgabe bei Vertragsende, mit Frist
8. Auditrecht bzw. Vorlage von Zertifikaten (ISO 27001)
9. **Bei Arztpraxen zusätzlich:** Berufsgeheimnis-/Hilfspersonenklausel nach Art. 321 StGB

**[S/V] «Keine Trainingsnutzung» — Anbieterlage:** Die grossen API-Anbieter (OpenAI-API, Azure OpenAI,
Anthropic-API, Google Vertex AI) sagen für ihre **Geschäfts-APIs** zu, Kundendaten nicht zum Training
zu verwenden; teils sind Zero-Retention-Vereinbarungen erhältlich. **Für Consumer-Abos gilt das
nicht** — die kostenlosen Chat-Oberflächen sind der eigentliche Compliance-Unfall im KMU-Alltag.
Diese Zusagen konnten in dieser Session **nicht verifiziert werden [NB]** und sind vor jeder
Kundenaussage am aktuellen Vertragstext zu prüfen.

**Wichtige Gegenbewegung – nicht verschweigen:** Der **Fachkräftemangel-Index 2025 (Adecco Group Switzerland / Stellenmarkt-Monitor UZH)** lag rund **22 % unter dem Vorjahr**: offene Stellen **–8 %**, RAV-Stellensuchende **+17 %**, Deutschschweiz **–23 %**, lateinische Schweiz **–17 %** [5] **[B*]**. Der Index ist **gesamtwirtschaftlich, nicht bauspezifisch**. Ehrliche Lesart fürs Deck: *Der kurzfristige Druck hat 2025 nachgelassen, der demografische bleibt.* Wer 2026 mit «akutem Notstand» argumentiert, wird von einem informierten Bauunternehmer widerlegt.

Gleichzeitig läuft der Markt: Umsatz Q1 2026 **+5,6 % auf über 4,9 Mrd. CHF**, Arbeitsvorrat Ende Dezember 2025 **+4,5 %** [6] **[B*]**. **Das ist der Verkaufsrahmen: Nachfrage vorhanden, Personal begrenzt, Produktivität im Bau 1997–2023 um 2 % gesunken** [7] **[B*]**.

**Die entscheidende Verkaufslogik:** Bestand wächst, Arbeitszeit pro Kopf sinkt, ein Viertel steht vor der Pensionierung. **Mehr Köpfe einzustellen ist keine realistische Antwort auf Mehraufwand – und Rekrutierung ist deshalb nur die halbe Lösung.** Die andere Hälfte ist, die vorhandene MPA-Stelle attraktiv zu halten: Praxisambulant tätige Ärzt:innen wenden **rund 54 Minuten pro Tag für sonstige administrative Aufgaben** auf (gfs.bern im Auftrag der FMH, 2025, n = 1'532 / 330 praxisambulant) [15] **[B*]**; **67 % erhalten unnötige Aufgaben auf Papier, 56 % als nicht editierbares PDF** (SGAIM-Umfrage, n = 1'856) [16] **[B*]**. Diese Administration landet in der Praxis grösstenteils bei der MPA.

## 3. Was kostet eine unbesetzte Stelle oder eine Fehlbesetzung

Das ist die schwächste Belegstelle des ganzen Themas – entsprechend vorsichtig formulieren.

| Grösse | Wert | Einstufung |
|---|---|---|
| Rekrutierungskosten pro Einstellung (CH, branchenübergreifend) | **CHF 13'570** | [S] ifp Basel, Personalberatung mit Eigeninteresse an hohen Werten [17] |
| Kosten einer Vakanz im Bauhauptgewerbe | **keine Erhebung auffindbar** | [NB] |
| Kosten einer Vakanz in Arztpraxen | **keine Schweizer Zahl auffindbar** | [NB] |
| HR-Faustregel Personalverlust | rund **ein Jahreslohn** (kumuliert: Einarbeitung, Überstunden, Qualitätsverlust) | [S] Personaldienstleister – als **Faustregel**, nie als Studie zitieren [18] |
| Vollkosten pro produktiver Stunde | Baugewerbe **≈ CHF 51**, Gesundheits-/Sozialwesen **≈ CHF 51** | [A] eigene Rechnung auf BFS-LSE-2024-Medianlöhnen (6'616 bzw. 6'609), 18 % Lohnnebenkosten, 1'850 produktive Stunden [19] |
| Durchschnittslohn LMV-Personal 2026 | **CHF 6'282/Monat ≈ 82'000/Jahr**; Lohnklasse C 4'959, Maurer EFZ 6'148, **Polier 7'908** | [B*] SBV-Lohnerhebung [20] |

**Die eine Rechnung, die auf eine Folie gehört [A]:** Das Bauhauptgewerbe arbeitet mit **2–3 % Gewinnmarge** (Stand 2022, entsprechend zu kennzeichnen) [21] **[B*]**. Bei 3 % Marge muss ein Betrieb rund **CHF 452'000 Umsatz** erwirtschaften, um die **CHF 13'570** Rekrutierungskosten *einer einzigen* Einstellung zu decken. Zwei Fehlbesetzungen im Jahr sind knapp eine Million Franken Umsatz, der nur die Personalsuche bezahlt. – *Beide Eingangswerte sind belegt, die Division ist eigene Rechnung; die Margenzahl ist vier Jahre alt.*

## 4. Kanäle – was hier belegt ist und was nicht

**Ehrliche Ausgangslage:** Zu Wirksamkeit, Kosten und Conversion der einzelnen Kanäle (Social Recruiting via Meta/TikTok/Instagram, Mitarbeiter-werben-Mitarbeiter, Google for Jobs, Indeed, jobs.ch/jobup.ch, WhatsApp-Bewerbung) konnte in dieser Session **keine einzige belastbare Schweizer Zahl** beschafft werden. **[NB]** Alles, was hier steht, ist entweder belegter Kontext oder als Mechanik gekennzeichnet.

### 4.1 Der belegte Anker für den Bau: Sprache

Nationalitätenstruktur des Baustellenpersonals im Bauhauptgewerbe **2024** (SBV-Lohnerhebung) [22] **[B*]**:

- **34,7 % Schweizer, 31,0 % Portugiesen** – zwei Nationen stellen zwei Drittel des Personals
- rund **100 Nationalitäten**; ca. **90 % der Ausländer aus der EU**
- In den **Lohnklassen A, B, C liegt der Ausländeranteil über 80 %**, in den höheren Klassen 30–50 %

**Belegte operative Folge:** Ein rein deutschsprachiger Rekrutierungsprozess – Inserat, Formular, Bestätigungsmail, Onboarding-Unterlagen – adressiert strukturell nicht die Bevölkerungsgruppe, aus der über 80 % der Hilfs- und Anlernstellen tatsächlich besetzt werden. **Mehrsprachigkeit ist im Schweizer Bau kein Nice-to-have, sondern die Zielgruppendefinition.** Passend dazu: **Übersetzung ist mit 52 % bereits die häufigste KI-Anwendung in Schweizer KMU** (AXA KMU-Arbeitsmarktstudie 2025) [23] **[B]**.

### 4.2 Mechaniken ohne Schweizer Zahlenbeleg – als Mechanik verkaufen, nicht als Statistik

Diese Punkte sind fachlich unstrittig, aber in dieser Session **nicht quellenbelegt**. Im Deck ohne Prozentzahlen führen:

- **Google for Jobs** liest strukturierte `JobPosting`-Daten (schema.org) von der Karriereseite. Ohne dieses Markup erscheint ein Inserat dort nicht – unabhängig vom Budget. *Mechanik, Reichweitenzahl [NB].*
- **Kurze, mobile Bewerbungsstrecke**: Je mehr Pflichtfelder und je mehr Uploads, desto mehr Abbrüche. Die Richtung ist unstrittig, **jede konkrete Abbruchquote wäre in diesem Deck erfunden** – deshalb weglassen.
- **Mitarbeiter-werben-Mitarbeiter** ist im Bau der plausibelste Kanal, weil die Belegschaft selbst die Netzwerke in Portugal, Italien und dem Balkan hält (siehe 4.1). *Plausibilität aus der belegten Nationalitätenstruktur abgeleitet [A], Wirksamkeitszahl [NB].*
- **Arztpraxen**: In der Parallelrecherche wurden `praxisstellen.ch` und `mpa-jobs.ch` als einschlägige Kanäle genannt [24] **[S]** – Reichweite und Kosten nicht verifiziert.

### 4.3 Rekrutierung im Ausland – rechtlicher Rahmen

- **Belegt:** Im Bau gilt bei **Entsendung** aus dem Ausland die **Meldung ab dem 1. Tag, 8 Tage vor Arbeitsbeginn**. Das alte SEM-Verfahren wurde am **14.03.2025** abgeschaltet, seit **17.03.2025** läuft alles über **EasyGov.swiss** [25] **[B*]**.
- **Wichtige Abgrenzung:** Das betrifft **Entsendung durch einen ausländischen Arbeitgeber**, nicht die **Direktanstellung** einer EU/EFTA-Person durch Stirnimann. Die beiden Regime nicht vermischen.
- **Nicht recherchierbar [NB]:** aktuelle **Drittstaaten-Kontingente 2026** (Höchstzahlen für Aufenthalts- und Kurzaufenthaltsbewilligungen), Verfahrensdauer und die Anerkennung ausländischer Berufsabschlüsse (für MPA über SBFI/SRK). **Vor dem Meeting bei SEM und SBFI abholen** – für Arztpraxen ist die Diplomanerkennung der eigentliche Engpass, nicht das Inserat.

---

## 5. Wo KI im Recruiting belegbar hilft

| # | Anwendung | Bau | Arztpraxis | Belegstatus |
|---|---|---|---|---|
| 1 | **Stelleninserat mehrsprachig erzeugen** (DE/PT/IT/SQ, tonalitätsgleich) | hoch – 31 % PT-Anteil [22] | mittel | Bedarf belegt, Wirkung [NB] |
| 2 | **Onboarding- und Sicherheitsunterlagen übersetzen** | hoch – BauAV verlangt vor Baubeginn ein **schriftliches Sicherheits- und Gesundheitsschutzkonzept** [26] | – | Pflicht belegt [B*] |
| 3 | **Vorqualifizierung / Screening-Assistenz** (Struktur, nicht Entscheid) | mittel | mittel | rechtlich heikel, siehe 6 |
| 4 | **Terminvereinbarung Erstgespräch per Chatbot** | mittel | hoch | Mechanik etabliert |
| 5 | **Nachfassen bei Bewerbenden** (automatisierte, personalisierte Erinnerung) | hoch | hoch | Analogie: SMS-Terminerinnerungen erhöhen die Wahrnehmung, **RR 1,10 (95 % CI 1,03–1,17)**, Cochrane-Review 2013, 4 RCTs, n = 3'547 – **Achtung: medizinischer Kontext, 2013, nicht auf Recruiting übertragbar** [27] **[B]** |
| 6 | **Mehrsprachige Bewerbungsstrecke** (Formular, Bestätigung, Rückfragen) | hoch | mittel | Bedarf belegt [22] |
| 7 | **Onboarding-Checklisten und Einarbeitungspläne automatisiert** | hoch | hoch | in Parallelrecherche als Use Case «MPA-Recruiting und Onboarding», Aufwand **6–15k CHF** veranschlagt [24] **[S]** |

**Marktkontext für den Pitch:** KI-Integration in Schweizer KMU stieg von **22 % (2024) auf 34 % (2025)**, der Anteil der Verweigerer fiel von **45 % auf 29 %** [23] **[B]**. Die Bau- und Immobilienwirtschaft ist beim Digitalisierungsindex **DRE-i mit 4,0 von 10 Punkten das Schlusslicht** (pom+ Studie 2026, ~200 Befragte) [28] **[B*]**. Das ist die Lücke, in die das Angebot passt.

---

## 6. Rechtliche Grenzen

## 1. Preise: keine Marktzahl erfinden, sondern rechnen

### 1.1 Was nicht belegbar ist

Übliche Sätze für Freelancer, Agentur und Grossberatung in der Schweiz: **[NB]**. Jede Zahl, die
Colin hier aus dem Bauch nennt, ist im Gespräch mit einem Bauunternehmer angreifbar — ein Patron, der
seit Jahrzehnten Regieansätze kalkuliert, erkennt eine gegriffene Zahl sofort.

### 1.2 Die Kalkulationslogik, die im Bau-Gespräch trägt **[A]**

Der Onkel kennt das Prinzip aus dem eigenen Betrieb: Der Verkaufsansatz entsteht aus Lohn plus
Nebenkosten plus Gemeinkosten plus Marge, geteilt durch die **produktiven** Stunden. Genau diese
Rechnung soll Colin offenlegen, statt eine Marktzahl zu behaupten.

```
Verkaufssatz = (Zielsalär + Sozialversicherungen + Fixkosten + Gewinnanteil) ÷ fakturierbare Stunden
```

Der entscheidende und am meisten unterschätzte Term ist der Nenner. Ein Vollzeitjahr hat rund 1'850
bis 2'112 Arbeitsstunden **[A]** — der Divisor 2'112 ist der im LMV verwendete Jahresstundenwert und
im Bau-Kontext anschlussfähig **[B, 4]**. Davon sind bei einem Ein-Personen-Betrieb realistisch nur
**50–60 % fakturierbar**; der Rest geht in Akquise, Offerten, Buchhaltung, Weiterbildung und
Gewährleistung **[A, Erfahrungswert, keine Erhebung]**.

**Der Quervergleich, der beim Onkel sitzt [B, 6]:** Im Handwerk gilt die Anbieter-Faustregel, dass der
verrechnete Stundensatz beim **2,5- bis 3-Fachen des Bruttolohns** liegt. Das ist keine Erhebung,
sondern eine Software-Anbieter-Faustregel — genau so ist sie zu zitieren. Sie erklärt aber in einem
Satz, warum ein Ansatz, der weit über dem Lohn liegt, kein Wucher ist, sondern Vollkostenrechnung.
Die belegte Bandbreite für Handwerker-Stundensätze in der Schweiz liegt bei **CHF 85–150 (2026)**
**[B, 7 — kommerzielle Vergleichsplattform, mittlere Verlässlichkeit, nur als Band, nie als Punktwert]**.
Als Branchenstandard für die saubere Regie-Kalkulation existieren die **Kalkulationshilfen für
Regiearbeiten (KR), Ausgabe 2026** des SBV/IPB — ausdrücklich unverbindlich **[B, 8]**.

**Formulierung für den Onkel [A]:** «Ich rechne meinen Ansatz genau wie Sie Ihren Regieansatz — Lohn,
Nebenkosten, Gemeinkosten, Marge, geteilt durch die produktiven Stunden. Ich zeige Ihnen die Rechnung,
Sie sagen mir, ob sie stimmt.» Das dreht die Preisdiskussion von einer Behauptung in eine
Fachdiskussion unter Kalkulierenden.

### 1.3 Drei Preisniveaus als Positionierung, nicht als Zahl **[A]**

Freelancer, Agentur und Grossberatung unterscheiden sich weniger im Satz als in dem, was im Satz
enthalten ist: Vertretungsrisiko, Haftungsdeckung, Methodik, Dokumentation, Wartungszusage. Colins
ehrliche Position ist die des **Einzelanbieters mit Klumpenrisiko** — genau das muss er
adressieren (Abschnitt 5, Exit/Übergabe), sonst tut es der Onkel.

## 3. Der bezahlte Discovery-Workshop **[A]**

Übliche Dauer und Preise: **[NB]**. Was sich fachlich begründen lässt:

**Warum bezahlt?** Ein bezahlter Workshop filtert. Wer nicht bereit ist, für einen Tag Analyse zu
zahlen, wird auch das Projekt nicht bezahlen. Zusätzlich verschiebt er die Diskussion von «Was kostet
das?» zu «Was bringt das?».

**Struktur, ein halber bis ein Tag [A]:**
1. **Prozess-Walk** (90 Min): Ein realer Vorgang wird end-to-end nachgezeichnet — beim Bau ein
   Rapport von der Baustelle bis zur Rechnung, bei der Praxis ein Anruf bis zum Termineintrag.
2. **Zeit- und Medienbruch-Zählung** (60 Min): Wo wird abgetippt, wo wird gesucht, wo wird
   übersetzt? Jeder Bruch wird mit einer Minutenschätzung der Beteiligten versehen.
3. **Kandidatenliste und Bewertung** (90 Min): Nutzen × Aufwand × Datenrisiko.

| Woche | Inhalt | Ergebnis |

| **6** | Abnahme, Entscheid, Offerte für Ausbau | Abnahmeprotokoll |

Fälle parallel bedeuten, dass am Ende keiner sauber gemessen ist.

**KPI-Baseline — was messbar ist [A]:**

selbst gemessener Erfolg ist im KMU wertlos.

**Ehrliche Grenze [A]:** Bei einem Piloten mit wenigen Nutzenden über wenige Wochen ist der Effekt
