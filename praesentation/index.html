<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bau &amp; Praxis</title>
<meta name="description" content="Pitch-Cockpit für das Meeting mit Stirnimann Bau AG und einer Praxisverwaltung: vier Decks, Leistungskatalog, Nutzenrechner und die vollständige Recherche.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* ============================================================
   BAU & PRAXIS — Pitch-Cockpit
   Ein Dokument, keine Abhängigkeiten. Tokens zuerst.
   ============================================================ */

:root{
  /* Grund: kühles Papier, Blaustich statt Neutralgrau */
  --paper:#EDF0F2;
  --surface:#FFFFFF;
  --surface-2:#F5F7F8;
  --sunk:#E3E8EB;
  --ink:#0F151A;
  --ink-2:#55636E;
  --ink-3:#5C6B77;
  --line:#CBD5DA;
  --line-soft:#DFE6EA;

  /* Ein lauter Akzent: Signalorange von der Baustelle */
  --signal:#EA5B0C;
  --signal-text:#B8430A;   /* dunkler, nur fuer kleine Schrift auf hellem Grund */
  --btn-bg:#B8430A; --btn-fg:#FFFFFF;
  --signal-ink:#FFFFFF;
  --signal-weak:#FDEBE0;

  /* Zweite Spur: klinisches Petrol */
  --care:#0B7F79;
  --care-ink:#FFFFFF;
  --care-weak:#E1F1F0;

  /* Semantik, getrennt vom Akzent */
  --good:#2C7A4B;
  --warn:#A9750A;
  --crit:#B23A2E;
  --good-weak:#E4F1E8;
  --warn-weak:#F8EFD9;
  --crit-weak:#F8E5E2;

  --shadow:0 1px 2px rgba(15,21,26,.06), 0 8px 24px -12px rgba(15,21,26,.18);
  --shadow-lg:0 2px 4px rgba(15,21,26,.06), 0 24px 60px -24px rgba(15,21,26,.30);

  --r-s:3px; --r-m:6px; --r-l:10px;
  --rail:266px;

  --f-display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1013;
    --surface:#141A1F;
    --surface-2:#1A2229;
    --sunk:#0A0E11;
    --ink:#E8EDF0;
    --ink-2:#98A6B0;
    --ink-3:#8A99A4;
    --line:#28323A;
    --line-soft:#1F272E;
    --signal:#FF7A2F;
    --signal-text:#FF9153;
    --btn-bg:#FF7A2F; --btn-fg:#1A0E06;
    --signal-ink:#1A0E06;
    --signal-weak:#2A1508;
    --care:#2CB6AC;
    --care-ink:#04201E;
    --care-weak:#0B2A28;
    --good:#5BB97C;
    --warn:#D6A73A;
    --crit:#E0705F;
    --good-weak:#12261A;
    --warn-weak:#2A2210;
    --crit-weak:#2C1614;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 60px -24px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --paper:#0C1013;
  --surface:#141A1F;
  --surface-2:#1A2229;
  --sunk:#0A0E11;
  --ink:#E8EDF0;
  --ink-2:#98A6B0;
  --ink-3:#8A99A4;
  --line:#28323A;
  --line-soft:#1F272E;
  --signal:#FF7A2F;
  --signal-text:#FF9153;
  --btn-bg:#FF7A2F; --btn-fg:#1A0E06;
  --signal-ink:#1A0E06;
  --signal-weak:#2A1508;
  --care:#2CB6AC;
  --care-ink:#04201E;
  --care-weak:#0B2A28;
  --good:#5BB97C;
  --warn:#D6A73A;
  --crit:#E0705F;
  --good-weak:#12261A;
  --warn-weak:#2A2210;
  --crit-weak:#2C1614;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 60px -24px rgba(0,0,0,.85);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-display);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---------- Masslinie: das Strukturmotiv aus dem Bauplan ---------- */
.masslinie{
  display:flex;align-items:center;gap:.6em;
  font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.masslinie::before,.masslinie::after{
  content:"";height:1px;background:var(--line);flex:0 0 auto;
}
.masslinie::before{width:10px;box-shadow:0 -3px 0 -0px var(--line)}
.masslinie--full::after{flex:1 1 auto}
.tick{position:relative}
.tick::before{
  content:"";position:absolute;left:0;top:-4px;width:1px;height:9px;background:var(--line);
}

/* ============================ Rahmen ============================ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100dvh;overflow:hidden}
body.is-presenting .app{grid-template-columns:0 1fr}
body.is-presenting .rail{opacity:0;pointer-events:none;transform:translateX(-12px)}

.rail{
  background:var(--surface);
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;min-height:0;
  transition:opacity .18s ease, transform .18s ease;
}
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line-soft)}
.brand__mark{
  display:flex;align-items:baseline;gap:8px;
  font-weight:800;font-size:1.06rem;letter-spacing:-.02em;
}
.brand__mark b{color:var(--signal)}
.brand__mark i{font-style:normal;color:var(--care)}
.brand__sub{
  margin-top:6px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}

.nav{flex:1 1 auto;overflow-y:auto;padding:12px 10px 8px;display:flex;flex-direction:column;gap:2px}
.nav__label{
  padding:14px 10px 6px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
}
.navitem{
  display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;
  width:100%;padding:9px 10px;background:none;border:0;border-radius:var(--r-m);
  text-align:left;cursor:pointer;color:var(--ink-2);line-height:1.25;
}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem[aria-current="page"]{background:var(--sunk);color:var(--ink);font-weight:600}
.navitem__no{
  font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3);
  border:1px solid var(--line);border-radius:2px;text-align:center;padding:1px 0;
}
.navitem[aria-current="page"] .navitem__no{border-color:currentColor;color:var(--ink)}
.navitem__meta{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-3)}
.navitem--bau[aria-current="page"] .navitem__no{border-color:var(--signal);color:var(--signal-text)}
.navitem--care[aria-current="page"] .navitem__no{border-color:var(--care);color:var(--care)}

.railfoot{border-top:1px solid var(--line-soft);padding:10px;display:flex;flex-direction:column;gap:8px}
.timer{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:8px 10px;
}
.timer__t{font-family:var(--f-mono);font-size:1.02rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer__b{display:flex;gap:4px}
.minibtn{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);
  padding:3px 8px;font-family:var(--f-mono);font-size:.68rem;cursor:pointer;color:var(--ink-2);
}
.minibtn:hover{border-color:var(--ink-3);color:var(--ink)}

/* ============================ Bühne ============================ */
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--paper)}
.topbar{
  display:flex;align-items:center;gap:12px;padding:10px 18px;
  border-bottom:1px solid var(--line-soft);background:var(--surface);
  flex:0 0 auto;min-height:52px;
}
body.is-presenting .topbar{background:transparent;border-bottom-color:transparent}
.topbar__title{font-weight:700;letter-spacing:-.01em;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar__spacer{flex:1 1 auto}
.chip{
  font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:100px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;
}
.chip--bau{border-color:var(--signal);color:var(--signal-text);background:var(--signal-weak)}
.chip--care{border-color:var(--care);color:var(--care);background:var(--care-weak)}
.chip--both{border-color:var(--ink-3);color:var(--ink-2)}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-m);padding:7px 12px;font-size:.86rem;font-weight:500;cursor:pointer;color:var(--ink-2);
  white-space:nowrap;
}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
/* Weiss auf dem hellen Signalorange erreicht nur 3,5:1 — für Knopfbeschriftung
   zu wenig. Der Knopf nimmt deshalb den dunkleren Ton (5,0:1). */
.btn--primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg);font-weight:600}
.btn--primary:hover{filter:brightness(1.06);color:var(--signal-ink)}
.btn--ghost{border-color:transparent;background:transparent}
.btn--ghost:hover{background:var(--surface-2);border-color:var(--line-soft)}
.kbd{
  font-family:var(--f-mono);font-size:.68rem;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:3px;padding:0 4px;color:var(--ink-3);background:var(--surface-2);
}

.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden}
.view[hidden]{display:none}

/* ============================ Slide-Engine ============================ */
.deckwrap{
  height:100%;display:flex;flex-direction:column;align-items:center;
  padding:20px 22px 12px;gap:12px;
}
.slideframe{
  flex:1 1 auto;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;
}
/* Die Folie ist der Container. Wichtig: cqw-Einheiten beziehen sich immer
   auf den nächsten VORFAHREN-Container, nie auf das Element selbst — die
   Schriftgrösse muss deshalb auf den Kindern stehen, sonst skaliert sie mit
   dem Fenster statt mit der Folie und läuft auf kleinen Bildschirmen über. */
.slide{
  container-type:inline-size;
  width:min(100%, calc((100dvh - 190px) * 16 / 9));
  aspect-ratio:16/9;
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--r-l);
  box-shadow:var(--shadow-lg);
  overflow:hidden;position:relative;
  display:flex;flex-direction:column;
}
body.is-presenting .slide{
  width:min(100%, calc((100dvh - 96px) * 16 / 9));
  border-radius:0;border-color:transparent;box-shadow:none;
}
body.is-presenting .deckwrap{padding:8px 10px 6px}

.slide__pad{
  font-size:clamp(12px, 1.63cqw, 40px);
  padding:3.1em 4em 4.2em;flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;gap:.98em;
}
.slide__foot{
  position:absolute;left:6.52cqw;right:6.52cqw;bottom:1.55cqw;
  display:flex;align-items:center;gap:1em;
  font-family:var(--f-mono);font-size:clamp(8px, 1.01cqw, 25px);
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
}
.slide__foot .rule{flex:1 1 auto;height:1px;background:var(--line-soft)}
.slide__no{font-variant-numeric:tabular-nums}

.eyebrow{
  font-family:var(--f-mono);font-size:.64em;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:.8em;
}
.eyebrow--bau{color:var(--signal-text)}
.eyebrow--care{color:var(--care)}
.eyebrow::after{content:"";height:1px;flex:1 1 auto;background:var(--line-soft)}

.slide h1{
  font-size:3.15em;line-height:1.02;letter-spacing:-.032em;font-weight:800;margin:0;
  text-wrap:balance;
}
.slide h2{
  font-size:2.05em;line-height:1.08;letter-spacing:-.024em;font-weight:700;margin:0;
  text-wrap:balance;
}
.slide h3{font-size:1.02em;line-height:1.2;letter-spacing:-.01em;font-weight:700;margin:0}
.slide p{margin:0;font-size:.98em;line-height:1.5;color:var(--ink-2);max-width:64ch}
.slide .lead{font-size:1.16em;line-height:1.45;color:var(--ink-2)}
.slide strong{color:var(--ink);font-weight:600}

.serif{font-family:var(--f-text)}
.mono{font-family:var(--f-mono)}
.dim{color:var(--ink-3)}

/* Layout: Aussage */
.l-statement{justify-content:center;align-items:flex-start;gap:1.2em}
.l-statement .big{
  font-family:var(--f-text);font-size:2.6em;line-height:1.16;letter-spacing:-.02em;
  font-weight:600;max-width:20ch;text-wrap:balance;margin:0;color:var(--ink);
}
.l-statement .sub{font-size:1.05em;max-width:52ch}

/* Layout: Titel */
.l-title{justify-content:center;gap:1.1em}
.l-title .kicker{font-family:var(--f-mono);font-size:.72em;letter-spacing:.22em;text-transform:uppercase;color:var(--signal)}
.l-title .meta{
  display:flex;gap:2.4em;flex-wrap:wrap;margin-top:.6em;
  font-family:var(--f-mono);font-size:.72em;color:var(--ink-3);
}
.l-title .meta b{display:block;color:var(--ink);font-weight:600;font-size:1.05em;margin-top:.25em}

/* Layout: zwei Spalten */
.l-split{display:grid;grid-template-columns:1fr 1fr;gap:2.4em;align-items:start;flex:1 1 auto;min-height:0}
.l-split--wide{grid-template-columns:1.25fr 1fr}
.l-split--narrow{grid-template-columns:1fr 1.35fr}
.col{display:flex;flex-direction:column;gap:.9em;min-width:0}

/* Aufzählung mit Masslinien-Tick */
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.7em}
.ticks li{
  position:relative;padding-left:1.5em;font-size:.96em;line-height:1.42;color:var(--ink-2);
}
.ticks li::before{
  content:"";position:absolute;left:0;top:.58em;width:.85em;height:1px;background:var(--line);
}
.ticks li::after{
  content:"";position:absolute;left:0;top:.32em;width:1px;height:.55em;background:var(--signal);
}
.ticks--care li::after{background:var(--care)}
.ticks li b{color:var(--ink);font-weight:600}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:1.6em;align-items:end}
.kpi{display:flex;flex-direction:column;gap:.25em;border-top:2px solid var(--ink);padding-top:.6em}
.kpi--bau{border-top-color:var(--signal)}
.kpi--care{border-top-color:var(--care)}
.kpi__n{
  font-family:var(--f-mono);font-size:2.5em;line-height:1;font-weight:600;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.kpi__l{font-size:.86em;line-height:1.32;color:var(--ink-2)}
.kpi__s{font-family:var(--f-mono);font-size:.6em;color:var(--ink-3);line-height:1.3}

/* Karten */
.cards{display:grid;gap:.9em}
.cards--2{grid-template-columns:1fr 1fr}
.cards--3{grid-template-columns:repeat(3,1fr)}
.card{
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-m);
  padding:1em 1.1em;display:flex;flex-direction:column;gap:.4em;min-width:0;
}
.card__t{font-size:1em;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:.5em}
.card__t .n{font-family:var(--f-mono);font-size:.72em;color:var(--ink-3);font-weight:500}
.card p{font-size:.87em;line-height:1.4}
.card--accent{background:var(--signal-weak);border-color:var(--signal)}
.card--care{background:var(--care-weak);border-color:var(--care)}

/* Zeitstrahl der Geschichte */
.steps{display:grid;gap:0;flex:1 1 auto;grid-auto-flow:column;grid-auto-columns:1fr;align-items:stretch}
.step{
  border-left:1px solid var(--line);padding:0 1.2em 0 1.1em;display:flex;flex-direction:column;gap:.55em;position:relative;
}
.step:first-child{border-left:0;padding-left:0}
.step__y{font-family:var(--f-mono);font-size:.7em;letter-spacing:.1em;color:var(--ink-3)}
.step__t{font-size:1.02em;font-weight:700;line-height:1.2;letter-spacing:-.012em}
.step p{font-size:.84em;line-height:1.4}
.step--now .step__t{color:var(--signal)}
.step--dark{color:var(--ink-3)}

/* Zitat / Fussnote */
.note{
  border-left:2px solid var(--signal);padding:.55em 0 .55em .9em;
  font-size:.88em;color:var(--ink-2);background:linear-gradient(90deg,var(--signal-weak),transparent 70%);
}
.note--care{border-left-color:var(--care);background:linear-gradient(90deg,var(--care-weak),transparent 70%)}
.src{font-family:var(--f-mono);font-size:.62em;color:var(--ink-3);line-height:1.45;overflow-wrap:anywhere}
.src a{color:var(--ink-3)}

/* Tabelle auf Slides */
.stable{width:100%;border-collapse:collapse;font-size:.86em}
.stable th{
  text-align:left;font-family:var(--f-mono);font-size:.76em;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;padding:0 .8em .5em 0;border-bottom:1px solid var(--line);
}
.stable td{padding:.55em .8em .55em 0;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink-2)}
.stable td:first-child{color:var(--ink);font-weight:600}
.stable .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Slide-Steuerung */
.deckbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;width:min(100%,1180px);
  padding:0 2px;
}
.progress{flex:1 1 auto;height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;display:flex;gap:2px}
.progress i{flex:1 1 auto;background:var(--line);border-radius:2px;transition:background .18s ease}
.progress i.on{background:var(--ink-2)}
.progress i.cur{background:var(--signal)}
.deckbar__no{font-family:var(--f-mono);font-size:.76rem;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Sprechernotizen */
.notes{
  width:min(100%,1180px);background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r-m);padding:12px 14px;font-size:.86rem;line-height:1.5;color:var(--ink-2);
  max-height:26vh;overflow-y:auto;flex:0 0 auto;
}
.notes h4{
  margin:0 0 6px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;
}
.notes ul{margin:6px 0 0;padding-left:18px}
.notes li{margin:3px 0}
.notes[hidden]{display:none}

/* Übersicht aller Slides */
.overview{
  position:fixed;inset:0;background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(6px);z-index:60;overflow-y:auto;padding:24px;
}
.overview[hidden]{display:none}
.overview__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;max-width:1280px;margin:0 auto}
.ovcard{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:12px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:104px;
}
.ovcard:hover{border-color:var(--signal)}
.ovcard__n{font-family:var(--f-mono);font-size:.66rem;color:var(--ink-3)}
.ovcard__t{font-size:.88rem;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.ovcard--cur{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal)}

/* ============================ Cockpit ============================ */
.page{max-width:1120px;margin:0 auto;padding:30px 26px 80px;display:flex;flex-direction:column;gap:26px}
.page--wide{max-width:1320px}
.hero{
  display:grid;grid-template-columns:1.35fr 1fr;gap:32px;align-items:start;
  padding:26px 0 4px;
}

# Vollstaendigkeits- und Belegpruefung der Recherchesammlung

**Prueferrolle:** Vollstaendigkeits-Kritiker · **Stand: 17.08.2026** · Geprueft: `01` bis `11` in diesem Verzeichnis

---

## 0. Methodenwarnung zu DIESER Pruefung — bitte zuerst lesen

**Die verlangte stichprobenartige Verifikation per WebSearch konnte nicht durchgefuehrt werden.**
Das Suchkontingent der Session war beim Start dieser Pruefung bereits erschoepft (200 von 200
WebSearch-Aufrufen, verbraucht durch die Recherchen 01–11). Anschliessend wurde **jeder**
Direktabruf vom Egress-Proxy mit `EGRESS_BLOCKED` abgewiesen — getestet und abgelehnt:
`pubmed.ncbi.nlm.nih.gov`, `arxiv.org`, `www.nber.org`, `www.fedlex.admin.ch`, `www.zefix.ch`.

**Konsequenz, streng eingehalten:** Es wurde keine externe Quelle neu geprueft. Was folgt, stuetzt
sich auf drei Methoden, die ohne Netz funktionieren:

| Methode | Was sie leistet |
|---|---|
| **Querlesen** | Widersprueche zwischen den elf Dateien, die den Autorinnen einzeln nicht auffallen konnten |
| **Rechnen** | Arithmetische Plausibilitaet innerhalb einer Tabelle oder Zeile |
| **Quelle-gegen-Behauptung** | Passt die zitierte Quelle ueberhaupt zur Aussage, die sie tragen soll? |
| **Normwissen** | Bekannte Rechtslage gegen die im Dokument behauptete Rechtslage (Stand Modellwissen Mai 2026) |

**Was das heisst:** Abschnitt 1 findet Fehler, die *ohne* Netz belegbar sind. Er kann **nicht**
ausschliessen, dass zusaetzlich Zahlen falsch aus dem Suchindex uebernommen wurden. Die in
`01`–`11` jeweils selbst formulierten Verifikationsauftraege bleiben alle bestehen.

**Lobende Vorbemerkung, weil sie fuer die Risikobewertung zaehlt:** Die Sammlung ist ungewoehnlich
diszipliniert. Fast jede Datei markiert eigene Schwaechen ([B]/[S]/[NB]) und listet aktiv, was
*nicht* verwendet werden darf. Die gefaehrlichsten Stellen sind deshalb **nicht** die offen
deklarierten Schaetzungen — sondern die wenigen Stellen, an denen eine Schaetzung im Verlauf der
Weiterverwendung zwischen den Dateien zu einer belegten Zahl mutiert ist. Genau die stehen unten.

---

## 1. Nicht sauber belegte oder erfunden wirkende Zahlen und Behauptungen

Sortiert nach Schadenspotenzial im Meeting, nicht nach Datei.

### 1.1 KRITISCH — Rechtslage, die mit hoher Wahrscheinlichkeit falsch datiert ist

**Datei `05-bau-ki-usecases.md`, C17:**
> «*Rechtslage geaendert per 1. Januar 2026* – die Eintragungsfrist wurde von drei auf **vier Monate**
> verlaengert (Art. 839 ZGB); zudem muss eine Ersatzsicherheit neu auch Verzugszinsen fuer **zehn
> Jahre** decken.»

**Befund:** Beide Neuerungen sind nach meinem Normwissen **nicht von 2026**. Die Verlaengerung der
Eintragungsfrist beim Bauhandwerkerpfandrecht von drei auf vier Monate stammt aus der
ZGB-Revision, die **am 1. Januar 2012** in Kraft trat. Die Anforderung, dass eine hinreichende
Ersatzsicherheit auch Verzugszinsen fuer rund zehn Jahre abdecken muss, ist **Rechtsprechung**
(bundesgerichtliche Praxis, ca. 2016), nicht eine Gesetzesaenderung 2026.

**Gegenbeleg aus der eigenen Sammlung:** `04-bau-schweiz-markt.md` nennt in Abschnitt 6 dieselben
vier Monate als **geltendes Recht ohne jeden Hinweis auf eine Neuerung** und stuetzt sich dabei auf
Behoerdenquellen (Gerichte ZH, Notariate ZH) — waehrend `05` sich fuer die «Aenderung 2026» auf
**eine einzelne Anwaltskanzlei-Seite** stuetzt ([10], tbp-law.ch), deren Inhalt nicht im Volltext
geprueft wurde. Die wahrscheinlichste Erklaerung ist eine Fehlinterpretation eines Kanzlei-Beitrags.

**Warum das kritisch ist:** C17 ist in `05` als «**staerkster Einzelfall im Katalog**» ausgewiesen
und traegt dort den Pitch. Wird im Meeting «neu seit 1.1.2026» gesagt und der Onkel oder sein
Bauanwalt weiss, dass die Frist seit 2012 vier Monate betraegt, ist die Glaubwuerdigkeit des
gesamten Rechtsteils weg. **Vor dem Meeting am ZGB-Volltext klaeren. Bis dahin: Frist von vier
Monaten nennen, den Zusatz «neu seit 2026» ersatzlos streichen.** Der Verkaufswert bleibt
identisch — die Frist ist auch ohne Neuigkeitswert unerbittlich und nicht erstreckbar.

dabeisteht. Die Angabe traegt das Label `[B]`, obwohl die Quelle ein verbandsnaher Blog ist
(`mpaportal.ch`). **Aus dem Deck streichen.** Ersatz vorhanden und belastbarer:
`02-arztpraxen-schweiz-markt.md` nennt die INFRAS-Analyse im Auftrag des Kantons Zuerich mit
**rund 12 fehlenden MPA pro 100 Aerztinnen und Aerzten** — Forschungsbuero, Kantonsauftrag, klare

### 1.3 KRITISCH — Zahl, die zwischen zwei Dateien die Bedeutung wechselt

**`02-arztpraxen-schweiz-markt.md`, 3.4:**
> «Krankenversicherer weisen rund **10 % der eingereichten Rechnungen zurueck**»

**`03-arztpraxen-ki-usecases.md`, Use Case 17:**
> «santesuisse gibt an, rund **10% der Leistungen seien nicht korrekt**»

**`03`, Abschnitt 5 («Was ausdruecklich nicht belegbar ist»):**
> «**Rueckweisungsquoten von Schweizer Krankenversicherern in Prozent**» — nicht belegbar

**Befund:** Dreifaches Problem. (a) «10 % der Rechnungen werden zurueckgewiesen» und «10 % der
Leistungen sind nicht korrekt» sind **inhaltlich verschiedene Aussagen** — die erste ist eine
Prozessquote, die zweite eine Fehlerquote. (b) Dieselbe Sammlung erklaert die Zahl an einer Stelle
fuer belegt und an anderer Stelle ausdruecklich fuer nicht belegbar. (c) `02` fuehrt die
Rueckweisungsquote im **Fazit unter den «drei staerksten, sauber belegten Angriffspunkten»** —
und `11-firmen-kontext.md` uebernimmt sie erneut als «10 % Rechnungsrueckweisungen [9]».

**Zusaetzlich:** Auf dieser Zahl baut `02` in 3.4 eine Modellrechnung auf (500 Rechnungen/Monat,
15 Minuten pro Retoure, 12,5 Stunden/Monat). Der 15-Minuten-Wert ist ausdruecklich `[S]` — die
Rechnung ist also eine Schaetzung auf einer strittigen Basis. **Empfehlung: Die 10 % nur mit dem
santesuisse-Wortlaut und dem Label «Verbandsangabe der Versicherer» verwenden, nie als
Prozesskennzahl der Praxis, und die Modellrechnung nur mit Zahlen von Jana Rohrer selbst rechnen.**

### 1.6 HOCH — Quelle traegt die Behauptung nicht

**`02`, Abschnitt 7:**
> «Anzahl Konsultationen pro Arzt: jaehrlich knapp 1'000 – dritttiefster Wert unter den untersuchten
> OECD-Staaten. [62] `[S]`»

**Quelle [62]:** Obsan-Indikator «**Konsultationen in Hausarzt- oder Allgemeinarztpraxen**»,
Datenbasis **Schweizerische Gesundheitsbefragung**.

**Befund:** Die Schweizerische Gesundheitsbefragung befragt **Personen**, nicht Praxen. Sie liefert
Konsultationen **pro Einwohnerin** (Groessenordnung: wenige pro Jahr), nicht Konsultationen **pro
Arzt**. Die Behauptung ist mit dieser Quelle nicht belegbar — die Zahl mag aus einer OECD-Statistik
stammen, aber dann ist die Quellenangabe falsch. Die Datei hat den Wert immerhin selbst als `[S]`
markiert und «Bezugsjahr unklar» notiert. **Ohne korrekte Primaerquelle nicht verwenden.**

**Befund:** Fuenf taggenaue Daten zu einem EU-Rechtsakt, der zum Zeitpunkt meines Normwissens

2026 eine Vernehmlassungsvorlage vorlegt.»** Der zweite Halbsatz ist amtlich belegt (Bundesrat,

### 1.13 Was ich ausdruecklich NICHT als erfunden einstufe

Damit die Kritik nicht ueberzogen wirkt, drei Faelle, die auf den ersten Blick verdaechtig aussehen
und bei Pruefung sauber sind:

- **Vollkosten CHF 51–54/Stunde** (`01`, Abschnitt 2): Nachgerechnet. 7'024 × 12 × 1,18 = 99'460;
  99'460 ÷ 1'850 = **53,8**. Baugewerbe: 6'616 × 12 × 1,18 = 93'682; ÷ 1'850 = **50,6**. Die
  Rechnung stimmt, die Annahmen sind offengelegt, die Eingangswerte sind amtlich. **Bester Beleg
  der Sammlung.**
- **Margenhebel** (`04`, Abschnitt 2): 1 % von 20 Mio. = 200'000; 3 % Marge = 600'000; 600'000 +
  200'000 = 800'000 = **+33 %**. Korrekt gerechnet und als Schaetzung deklariert.
- **CHF 452'000 Umsatz pro Rekrutierung** (`08`, Abschnitt 3): 13'570 ÷ 0,03 = **452'333**. Korrekt.
  Einschraenkung: Es ist eine rhetorische Umrechnung, keine Betriebswirtschaft — sagen als «*das
  entspricht dem Umsatz, den ihr fuer diesen einen Betrag erwirtschaften muesst*», nicht als
  «*kostet euch 452'000*».

Staedten, ca. 500 Fachpersonen; Santemed (Medbase-Mehrheit): 23 Praxen». Vermutlich eine
Verwechslung der 23 zwischen Sanacare und Santemed. Geringes Risiko, aber im Deck nur
Groessenordnung nennen.

---

## 3. Fehlende Themen — nach Deck sortiert

### 3.1 Deck A «Colins Geschichte und Referenzen» — die groesste Luecke der ganzen Sammlung

**Befund:** Es existiert **kein einziger recherchierter Fakt ueber Colin selbst.** `10` ist reines
Kommunikationshandwerk (und als solches gut), `11` stellt fest, dass beide dort untersuchten Firmen
**vollstaendig unverifiziert** sind. Ein Deck ueber Geschichte und Referenzen hat damit
derzeit **keine Substanz** — nur eine Anleitung, wie man ueber fehlende Substanz spricht.

Konkret fehlt:

| Fehlendes Thema | Warum es fuer Deck A zwingend ist |
|---|---|
| **Was die Demo tatsaechlich kann** | `10` erklaert korrekt, dass die Demo das staerkste Beweismittel ist und die Kuendigungsgeschichte irrelevant macht. Nirgends steht, **was sie macht**: Funktionsumfang, Stack, Datenmodell, Screenshots, wo sie laeuft. Ohne das kann Deck A den eigenen Kernrat nicht umsetzen. |
| **Rechtsform und Gruendung** | Einzelfirma vs. GmbH, Haftung, Kosten, Aussenwirkung beim Patron. Nirgends behandelt. |
| **Anerkennung der Selbstaendigkeit durch die Ausgleichskasse** | **Der praktisch gefaehrlichste blinde Fleck.** Wer als Einzelner mit wenigen Kunden startet — und die ersten beiden sind Onkel und Cousine — riskiert, von der Ausgleichskasse als **unselbstaendig** eingestuft zu werden. Folge: Nachforderung von Sozialversicherungsbeitraegen **beim Kunden**. Das trifft genau die zwei Personen im Raum. Muss vor dem ersten Auftrag geklaert sein. |
| **MWST-Pflicht** | Registrierungspflicht ab Jahresumsatz CHF 100'000. Beeinflusst jede Offerte (Preise mit/ohne MWST) und ist beim ersten Angebot relevant. |
| **Berufshaftpflicht** | In `09` in einem Halbsatz als `[A]` erwaehnt («vor dem ersten Auftrag abschliessen»), sonst nirgends. Deckungssummen, Kosten, ob KI-Fehler ueberhaupt gedeckt sind — nicht recherchiert. |
| **Pruefung der eigenen Arbeitsvertraege** | `10` setzt es auf die Checkliste (Konkurrenzverbot, Geheimhaltung), aber niemand hat es getan. Das ist kein Rechercheauftrag, sondern eine Aufgabe fuer Colin — sie gehoert vor das Meeting, nicht auf eine Folie. |
| **Referenz-Ersatz ohne Referenzen** | `10` stuft Referenzen korrekt als schwaechstes Beweismittel ein, aber es fehlt das Handwerk: Arbeitsproben, oeffentliches Repository, ein durchgerechneter Fall mit fiktiven Daten, ein Testat. |
| **Zentralschweizer Oekosystem** | HSLU (Innosuisse-Forschungspartner, in `01` bereits als Hebel identifiziert), Switzerland Innovation Park Central, IHZ. Fuer einen Regionalpitch ein billiger Glaubwuerdigkeitsgewinn — nirgends recherchiert. |

### 3.2 Deck B «Leistungskatalog 25+» — es gibt einen Katalog, aber kein Preisgeruest

**Was da ist:** 26 Use Cases fuer Arztpraxen (`03`), 30 fuer den Bau (`05`) — quantitativ mehr als
genug. **Was fehlt:**

| Fehlendes Thema | Konsequenz |
|---|---|
| **Marktpreise fuer CH-Software/KI-Arbeit** | `09` erklaert sie ausdruecklich fuer `[NB]` und benennt die Zielquellen (freelancermap.ch, GULP, swissICT-Salaerstudie, BFS-LSE Branche «Information und Kommunikation»). **Ohne diese Nachrecherche hat der Leistungskatalog kein Fundament.** Hoechste Prioritaet aller offenen Punkte. |
| **Wettbewerbslandschaft** | Wer bietet in der Zentralschweiz dasselbe an, zu welchen Konditionen, mit welcher Positionierung? Nirgends recherchiert. Ironie: Die einzige Wettbewerberseite in der Sammlung (`ai-automation-hub.ch`) wird als **Quelle** zitiert (siehe 1.10), nicht als Wettbewerber analysiert. |
| **Laufende Betriebskosten von KI** | Token-/API-Kosten, GPU-Stunden, Hosting pro Monat. `07` erklaert **alle** Anbieterpreise fuer `[NB]`. Ohne diese Zahlen ist kein Retainer und kein SaaS-Preis kalkulierbar — und Modell 5 und 6 aus `09`s Tabelle sind nicht anbietbar. |
| **Lieferkapazitaet eines Einzelanbieters** | Wie viele Projekte parallel? Was passiert bei Krankheit? `09` benennt das «Klumpenrisiko» korrekt und liefert das Gegenmittel (Exit/Uebergabe), aber die Kapazitaetsfrage — die der Onkel stellen wird — ist unbeantwortet. |
| **Schulung und Adoption** | Ueber alle Dateien hinweg wird Technik verkauft; **wer die Poliere und MPA dazu bringt, das Werkzeug zu benutzen**, ist nirgends ausgearbeitet. `05` nennt bei D20 die Akzeptanz beim Polier als eigentlichen Engpass — und zieht keine Konsequenz. Adoption ist ein eigenstaendiges, verkaufbares Angebot. |
| **KI-Kompetenz als Pflicht** | Der EU AI Act verlangt seit Februar 2025 von Anbietern und Betreibern ausreichende KI-Kompetenz der Mitarbeitenden. Fuer Schweizer Firmen mit EU-Bezug relevant, fuer alle anderen ein starkes Verkaufsargument fuer Schulungen. **In keiner der elf Dateien erwaehnt.** |
| **Nicht-KI-Angebote** | Website, SEO, Auffindbarkeit in KI-Suche, Barrierefreiheit (BehiG/WCAG), Datenmigration, BI-/Reporting-Dashboards, klassische Prozessautomatisierung ohne LLM. Teilweise verstreut (`03` UC25, `11` 4.2), nie als Katalogblock. Ein 25+-Katalog braucht diese Breite. |
| **E-Rechnung / QR-Rechnung / eBill** | Beruehrt direkt die Angebote Kreditoren- und Debitorenworkflow (`05` C16, `03` UC19), kommt aber in keiner Datei vor. |
| **Gewaehrleistung und Wartung als Produkt** | `09` behandelt SLA rechtlich (Reaktions- statt Behebungszeit), aber nicht als Preisposition. |

### 3.3 Deck C «Bau» — Recht und Kunde fehlen

| Fehlendes Thema | Warum wichtig |
|---|---|
| **Stirnimann Bau AG** | Null verifizierte Fakten (`11`). Der Rat aus `11` — im Deck **nichts** ueber die Firma behaupten, alles im Gespraech erfragen — ist richtig und sollte fuer das Deck verbindlich gelten. |
| **Arbeitszeiterfassungsrecht** | ArG und ArGV 1 regeln, welche Daten wie erfasst werden **muessen** (und wo vereinfachte Erfassung oder Verzicht moeglich ist). Das ist die rechtliche Grundlage der Angebote A1, A2 und D19 — und kommt in keiner Datei vor. `07` behandelt nur die Ueberwachungsgrenze (ArGV 3). **Erfassungspflicht und Ueberwachungsverbot sind zwei verschiedene Themen; das Angebot braucht beide.** |
| **Suva-Praemienmechanik** | `05` (D21) raeumt korrekt ein, dass eine belegte Praemiensenkung durch Schulung nicht sourcebar war — recherchiert aber nicht das **Praemienmodell** (Risikoklassen, Bonus-Malus, Sicherheits-Charta). Das ist der ehrliche Ersatz fuer das nicht belegbare Versprechen. |
| **Preise der Wettbewerbsprodukte** | Was kosten Sorba, Abacus AbaBau, Baurapport.ch, PlanRadar in der Schweiz? Ohne das kann Colin sein Angebot nicht positionieren — und `05` empfiehlt bei A5 ausdruecklich, PlanRadar **einzufuehren statt zu bauen**. Dazu muss man den Preis kennen. |
| **Anteil Regie- und Nachtragsumsatz** | Der gesamte C-Block («Geld sichern») haengt daran, wie viel Umsatz ueberhaupt ueber Regie und Nachtraege laeuft. Keine Zahl, kein Benchmark — muss beim Onkel erhoben werden. |

### 3.4 Deck D «Arztpraxen» — die Kundin selbst fehlt

| Fehlendes Thema | Warum wichtig |
|---|---|
| **Jana Rohrers Firma** | Name, Groesse, Anzahl betreuter Praxen, Erloesmodell — nicht recherchiert (`11`, Punkt 5.4). `11` liefert immerhin die entscheidende Analyse: Bei umsatzabhaengigem Modell zaehlt Durchsatz und Rueckweisungsquote, bei Pauschalen die Kosten pro Praxis. **Ohne diese eine Information ist das halbe Deck geraten.** |
| **TARDOC-Realdaten aus 2026** | Der ganze Pitch haengt am ersten TARDOC-Jahr — aber niemand hat Fehler-, Rueckweisungs- oder Kodierdaten aus dem laufenden Jahr. Das ist auch der beste Gespraechseinstieg: «Was seht ihr seit Januar?» |
| **Der MPA-Arbeitstag** | Die Administration landet laut `08` «groesstenteils bei der MPA» — es gibt aber keine Aufschluesselung, womit eine MPA ihren Tag verbringt. Fuer ein Angebot an eine Verwaltungsfirma ist das die relevantere Zeitverwendung als die aerztliche. |
| **Kosten und Dauer einer Medizinprodukt-Qualifikation** | `03` markiert bei sechs Use Cases «MP?» — aber was eine Konformitaetsbewertung kostet und dauert, steht nirgends. Fuer die Entscheidung «machen wir das ueberhaupt» ist das die einzige relevante Zahl. |
| **Patienteninformation und Einwilligung** | Der einzige Datenpunkt zur Akzeptanz ist ein ungeprueftes Sekundaerzitat (siehe 1.10). Ein Musterkonzept zur Patienteninformation bei KI-Einsatz waere ein verkaufbares Produkt — und fehlt. |

### 3.5 Querschnittsthemen, die in allen drei Decks fehlen

- **Was ein Ausfall kostet.** Backup, Wiederanlauf, Notfallbetrieb ohne das Tool. Ein Patron fragt
  «und wenn das Ding nicht laeuft?» — die Sammlung hat keine Antwort.
- **Cyber-Vorfall und Meldepflicht.** `07` nennt die DSG-Meldepflicht korrekt, aber nicht den
  operativen Ablauf (wer meldet, in welcher Frist, an wen) — Teil jedes seriösen Angebots.
- **Wie es nach dem Piloten weitergeht.** `09` beschreibt den Piloten hervorragend. Was danach
  kommt — Skalierung, Betriebskosten, zweite Praxis, zweite Baustelle — fehlt.
- **Vergleichbare Schweizer KMU-Faelle.** Kein einziger dokumentierter Fall eines Schweizer
  Klein-Betriebs, der so etwas eingefuehrt hat. Die staerkste Evidenz der Sammlung stammt aus
  US-Grossbetrieben (NBER, Kaiser Permanente, UCLA). Das ist ehrlich markiert — aber es bleibt eine
  Luecke, die der Kunde spueren wird.

---

## 4. Die zehn staerksten Fakten fuer das Verkaufsgespraech

Auswahlkriterium: belegt mit einer Primaer- oder amtsnahen Quelle, im Meeting nicht widerlegbar,
und mit direkter Konsequenz fuer eine Kaufentscheidung. Reihenfolge = Ueberzeugungskraft.

**1. Eine Arbeitsstunde kostet den Betrieb rund CHF 51–54 Vollkosten.**
Basis: BFS-Lohnstrukturerhebung 2024 (Medianlohn 7'024 / Bau 6'616 / Gesundheitswesen 6'609) plus
Arbeitgeberbeitraege 2026 (AHV/IV/EO 10,6 %, ALV 2,2 %) und 15–22 % Lohnnebenkosten gesamt.
→ `01-kmu-ki-schweiz.md`, Abschnitt 2, Quellen [7][8][9][10]. Nachgerechnet und korrekt.
**Warum stark:** Amtliche Eingangswerte, offengelegte Rechnung, jede Ersparnisdiskussion haengt
daran. Eine gesparte Stunde pro Tag ≈ CHF 11'700–12'400 pro Person und Jahr.

**2. 67 % der Gesundheitsfachpersonen erhalten unnoetige Aufgaben auf Papier, 56 % als nicht
editierbares PDF.**
SGAIM-Umfrage «Papiertiger», n = 1'856, Deutschschweiz/Romandie/Tessin.
→ `02`, 3.2, Quellen [23][24][25].
**Warum stark:** Fachgesellschaft als Primaerquelle, grosse Stichprobe, und es beschreibt einen
Prozess, der **ohne medizinisches Risiko** automatisierbar ist. Der beste Einstiegs-Use-Case ueberhaupt.

**3. Rund 54 Minuten pro Tag gehen praxisambulant fuer sonstige Administration weg — 87 % nennen
die Versicherer als Hauptverursacher.**
gfs.bern im Auftrag der FMH, Erhebung 2025, n = 1'532, davon 330 praxisambulant.
→ `02`, 3.1, Quellen [20][21][22].
**Warum stark:** Repraesentative Befragung durch ein etabliertes Institut im Auftrag des
Aerzteverbands — die Zielgruppe kann die eigene Zahl nicht bestreiten.
**Zwingend:** «rund eine Stunde, Tendenz steigend» sagen, **nicht** die Reihe 36,6 → 54 als
Zeitreihe verkaufen (`02` warnt zu Recht), und die 114 Minuten **nicht** addieren (siehe 2.1).

**4. TARDOC und ambulante Pauschalen loesen TARMED per 1.1.2026 ab — Genehmigung befristet bis
31.12.2028.**
Bundesratsbeschluss 30.04.2025, Anpassungen 05.11.2025.
→ `02`, Abschnitt 5, Quellen [48][49][50].
**Warum stark:** Amtlich, taggenau, und ein **Zwangsereignis** — niemand kann sich dagegen
entscheiden. 2026 ist das erste volle Jahr: neue Kodierlogik, jaehrliche Tarifpflege als neuer
Dauerprozess, erhoehtes Fehlerrisiko in der Uebergangsphase. Das ist das Zeitfenster.

**5. Der einzige RCT zu KI-Dokumentation zeigt rund 10 % Zeitersparnis — nicht 2–3 Stunden.**
NEJM AI, 238 ambulante Aerztinnen und Aerzte, 14 Fachrichtungen, drei Arme (DAX / Nabla / Usual
Care), Nov. 2024 – Jan. 2025. Nabla −9,5 % time-in-note (p = 0,02, ≈ 41 Sek./Notiz), DAX ohne
signifikanten Effekt (p = 0,66); Burnout- und Stressmasse verbesserten sich in beiden Armen;
vereinzelt klinisch relevante Ungenauigkeiten.
→ `02`, Abschnitt 6, Quellen [53][54][55].
**Warum stark:** Peer-reviewt, randomisiert, hoechste Evidenzstufe der ganzen Sammlung — **und es
ist der einzige Fakt, der zugleich ein Charakterbeweis ist.** Wer einer COO die kleine ehrliche
Zahl statt der grossen Anbieterzahl nennt, gewinnt den Rest des Gespraechs.

**6. SMS-Terminerinnerungen erhoehen die Terminwahrnehmung belegbar: RR 1,10 (95 % CI 1,03–1,17).**
Cochrane-Review Gurol-Urganci et al. 2013 (CD007458.pub3), 4 RCTs, n = 3'547; SMS gleich wirksam wie
Telefonanruf bei 55–65 % der Kosten.
→ `03`, Use Case 5, Quelle Q26.
**Warum stark:** Systematischer Review — die einzige Stelle im Terminbereich mit echter Evidenz,
und der Use Case ist in Wochen umsetzbar, ohne Regulatorik. **Einschraenkung mitliefern:** 2013,
und der Effekt ist real, aber moderat.

**7. KI-Nutzung in Schweizer KMU: bewusst in Prozesse integriert 22 % → 34 %, Verweigerer 45 % →
29 %; haeufigste Anwendung ist Uebersetzung mit 52 %.**
AXA/Sotomo KMU-Arbeitsmarktstudie 2025, n = 300, Medienmitteilung 08.10.2025. Dazu: 57 % berichten
Zeitersparnis, aber nur 2 % reduzieren deshalb Personal und 10 % schaffen Stellen.
→ `01`, Abschnitte 1 und 4, Quelle [2]; `04`, Abschnitt 5, Quelle [20].
**Warum stark:** Jaehrliche Reihe mit Vorjahresvergleich, also **Bewegung statt Momentaufnahme** —
das Argument «der Zug faehrt gerade ab» ist damit belegbar. Und der Zusatz «2 % reduzieren Personal»
nimmt dem Onkel und der Belegschaft die Angst, die sonst jedes Projekt bremst.

**8. Auf Schweizer Baustellen stellen zwei Nationen zwei Drittel des Personals: 34,7 % Schweizer,
31,0 % Portugiesen, rund 100 Nationalitaeten — in den tiefen Lohnklassen ueber 80 % Auslaenderanteil.**
SBV-Lohnerhebung 2024 (via Statista).
→ `04`, Abschnitt 4, Quelle [19]; `05`, Abschnitt 1, Quelle [4].
**Warum stark:** Der Onkel sieht das jeden Morgen auf seiner Baustelle — es ist der einzige Fakt der
Sammlung, den er sofort mit eigenen Augen bestaetigt. **Sauber formulieren:** ueber Paesse reden,
nicht ueber Sprachen (siehe 1.9).

**9. Die Bauproduktivitaet ist gesunken, waehrend die Gesamtwirtschaft zulegte — und bis 2040 fehlen
5'600 Fachkraefte.**
Avenir Suisse auf BFS-Basis: Gesamtwirtschaft 1997–2023 **+21 %**, Baubranche **–2 %**.
SBV-Studie (Demografik): 5'600 fehlende Fachkraefte bis 2040, bei Maurern **+31 %** und
Bauvorarbeitern **+33 %** Mehrbedarf gegenueber verfuegbarem Personal, Haupttreiber Altersueberhang.
→ `04`, Abschnitte 2 und 3, Quellen [7][8].
**Warum stark:** Die Kombination ist das Argument. Auftraege sind da (Q1 2026 +5,6 % Umsatz), Leute
nicht, Produktivitaet gesunken. **Wachstum ist nur ueber Produktivitaet moeglich** — daraus folgt der
Auftrag, nicht aus «KI ist toll». Bei 2–3 % Marge ist jede eingesparte Buerostunde direkt Gewinn.

**10. Der Regierapport ist keine Buerokratie, sondern die Marge — und das Datenschutzrecht haftet
persoenlich.**
SIA-Norm 118: «kein Abrechnungsposten ohne Beleg»; die KBOB fuehrt dazu einen eigenen Leitfaden zum
Nachtragsmanagement (V2.0). Fehlt der gegengezeichnete Regierapport, ist die Leistung erbracht, aber
nicht durchsetzbar. → `04`, Abschnitte 6 und 7, Quelle [14].
Parallel dazu: revDSG seit 01.09.2023, laut EDÖB **direkt auf KI-Anwendungen anwendbar**; Bussen bis
**CHF 250'000**, gerichtet gegen **natuerliche Personen**, nicht gegen den Unternehmensumsatz. Fuer
Arztpraxen zusaetzlich Art. 321 StGB, Freiheitsstrafe bis drei Jahre, ausdruecklich auch fuer
**Hilfspersonen**. → `01`, Abschnitt 6, Quellen [21][22]; `02`, Abschnitt 6, Quellen [56][57]; `07`.
**Warum stark:** Beide Haelften machen aus einem Kann ein Muss — die eine fuer den Bau-Patron
(fehlender Beleg = verlorenes Geld), die andere fuer beide Entscheider (es haftet der
Geschaeftsfuehrer persoenlich, nicht die AG). Und die zweite Haelfte begruendet zugleich, warum
Schweizer Hosting und ein Auftragsbearbeitungsvertrag mit Hilfspersonenklausel keine Zusatzoption
sind, sondern Eintrittsbedingung.

**Knapp nicht in den Top 10, aber gut:** Digital Health Report 2025/2026 (Interpharma/ZHAW) —
Arztpraxen mit 3,4 von 10 Punkten digitale Reife, hinter Spitaelern (4,6), Versicherern (6,0) und
Pharma (6,8) · Innosuisse-Innovationsscheck bis CHF 15'000 zu 100 % finanziert (aber: Geld geht an
den Forschungspartner) · Personalverleih ist bewilligungspflichtig mit CHF 50'000 Kaution — das
Argument, das die Plattform-Idee des Onkels in einem Satz umlenkt.

---

## 5. Die sieben Punkte, die vor dem Meeting erledigt sein muessen

Priorisiert nach Schaden-mal-Wahrscheinlichkeit:

1. **Bauhandwerkerpfandrecht:** Ist die Vier-Monats-Frist neu seit 2026 oder seit 2012? (Abschnitt 1.1)
2. **Marktpreise fuer CH-Software-/KI-Arbeit nachrecherchieren** — ohne sie hat der Leistungskatalog
   kein Fundament. Zielquellen stehen in `09`, Abschnitt 8.
3. **Die 114 Minuten aus dem Arztpraxen-Deck entfernen** bzw. korrekt als Spitalwert kennzeichnen.
   (Abschnitt 2.1)
4. **MPA-Stellenzahlen aus `03` streichen**, INFRAS-Zahl verwenden. (Abschnitt 1.2)
5. **Rueckweisungsquote entscheiden:** belegt oder nicht? Eine Bewertung fuer alle Dateien.
   (Abschnitt 1.3)
6. **Zefix-Abfrage «Stirnimann Bau»** — zehn Minuten, und ohne sie keine Firmenangabe im Deck.
7. **Ausgleichskasse: Selbstaendigkeit klaeren**, bevor der erste Auftrag von einem Verwandten
   kommt. (Abschnitt 3.1)

**Und die eine Regel, die alles andere ersetzt, wenn die Zeit knapp wird:** Jede Zahl auf jeder
Folie braucht sichtbar ihre Quelle und ihr Jahr. Wo das nicht geht, gehoert die Zahl nicht auf die
Folie — sondern wird im Gespraech beim Kunden erhoben. Das ist in beiden Terminen ohnehin die
staerkere Bewegung.

</script>

# KI und Automatisierung in Schweizer KMU – Marktlage, Nutzen, ROI

**Stand: 17. August 2026** · Recherche für den Pitch von Colin Renggli (Zentralschweiz)
**Legende:** **[B]** = belegt mit Quelle · **[A]** = Annahme/eigene Schätzung oder Berechnung · **[V]** = veraltet oder Aktualität eingeschränkt · **[?]** = nicht belegbar

---

## 0. Kurzfazit für das Meeting

Die Schweiz ist beim *individuellen* KI-Gebrauch europäische Spitze, beim *betrieblichen, prozessintegrierten* Einsatz aber schwach – besonders in kleinen Firmen. Genau diese Lücke zwischen «Mitarbeitende nutzen ChatGPT privat» und «der Betrieb hat automatisierte Prozesse» ist das verkaufbare Feld. Der Hebel ist nicht «KI», sondern die Schweizer Stundenkosten: Jede eingesparte Stunde ist rund **CHF 50–55 Vollkosten** wert **[A, auf belegten Lohn- und Sozialversicherungsdaten gerechnet]**.

---

## 1. Marktlage: Wie verbreitet ist KI in Schweizer KMU?

| Kennzahl | Wert | Quelle / Erhebung |
|---|---|---|
| Beschäftigte in CH, die **täglich** KI-Tools nutzen | **49 %** (Europa-Ø ~28 %, DE ~23 %, FR ~27 %, UK 22 %) | Accenture «Pulse of Change», Erhebung April–Juni 2026 [1] **[B]** |
| Arbeitgeber stellen KI-Werkzeuge bereit (CH) | **88 %** (international 80 %) | ebd. [1] **[B]** |
| KMU, die KI **bewusst in Arbeitsprozesse integriert** haben | **34 %** (Vorjahr 22 %) | AXA/Sotomo KMU-Arbeitsmarktstudie, MM 08.10.2025, n = 300 KMU (D-/F-CH) [2] **[B]** |
| KMU, die KI testen | 37 % (Vorjahr 33 %) | ebd. [2] **[B]** |
| KMU **ohne jede** KI-Nutzung | **29 %** (Vorjahr 45 %) | ebd. [2] **[B]** |
| KI-nutzende KMU, die **Zeitersparnis** berichten | **57 %** | ebd. [2] **[B]** |
| **Kleine** Unternehmen mit KI-Einsatz | **8 %** (grosse Unternehmen: 34 %) | KOF/Innovationserhebung 2023 im Auftrag SBFI, KOF-Studie Nr. 182, 01/2025 [3] **[B] [V – Erhebungsjahr 2023]** |
| Unternehmen, die GenAI eingeführt haben oder aktiv prüfen | 38 % (Data Analytics 35 %) | HWZ/Swisscom-Marktstudie, Erhebung Herbst 2024, n = 123 KMU + 5 Grossunternehmen [4] **[B] [V]** |
| KMU-Führungskräfte, die KI als Top-Thema der nächsten 3 Jahre nennen | **49 %** (Vorjahr 25 %) | NZZ-KMU-Barometer 2026, Kalaidos FH + NZZ, n = 495, Befragung März/April 2026 [5] **[B]** |

**Einordnung [A]:** Die Spanne 8 % (KOF 2023) bis 34 % (AXA 2025) ist kein Widerspruch, sondern misst Verschiedenes – KOF fragt nach KI als Technologie im Betrieb, AXA nach bewusster Integration in Arbeitsprozesse, Accenture nach individueller Tool-Nutzung. Für ein Deck ist die ehrliche Aussage: **KI-Nutzung durch einzelne Mitarbeitende ist Mainstream, KI in Prozessen ist es nicht.**

**Kontext KMU-Landschaft:** Über **612'000 KMU**, rund **99,7 %** aller Unternehmen, ca. **2,3 Mio. Beschäftigte**, rund zwei Drittel aller Arbeitsplätze [6] **[B, Sekundärquelle auf Basis BFS/OBT-HSG]**.

---

## 2. Der ROI-Anker: Was kostet eine Arbeitsstunde in der Schweiz?

**Belegte Ausgangswerte [B]:**
- Medianlohn Vollzeitstelle Gesamtwirtschaft 2024: **CHF 7'024** brutto/Monat (+3,5 % bzw. +236 CHF gegenüber 2022); Baugewerbe **CHF 6'616**; Gesundheits- und Sozialwesen **CHF 6'609** [7][8]
- Arbeitgeberbeiträge 2026: AHV/IV/EO **10,6 %** (je 5,3 % AG/AN), ALV **2,2 %** (je 1,1 %) bis CHF 148'200 Jahreslohn; unveränderte Sätze 2026 [9] **[B]**

## 3. Wie gross ist der administrative Block wirklich?

**Belegt [B]:**
- **60 %** von 1'525 befragten Schweizer Unternehmen empfinden die administrative Belastung als eher hoch oder hoch (2018: 67,5 %); Rückgang v. a. dank Digitalisierung von Behördenleistungen. Bürokratiemonitor 2022, LINK im Auftrag SECO, publiziert 01.03.2023 [11] **[V – Erhebung 2022]**
- SECO-Monitoring Regulierungsbelastung, publiziert **31.03.2026**: Zahl der regulatorischen Pflichten für Unternehmen ist zwischen 2005 und 2025 regelmässig gestiegen (neuer, KI-gestützter Experimentalindikator auf Basis von Regulierungstextanalyse); zugleich gute IMD-Werte 2025 (Bürokratie Rang 3, regulatorische Rahmenbedingungen Rang 4), aber Verlust von fünf Plätzen bei OECD-Teilindikatoren zu Unternehmensgründung/administrativer Vereinfachung [12] **[B]**
- sgv-KMU-Monitor, November 2025: Bürokratie bleibt Hauptsorge der KMU; Baubewilligungsverfahren für ein Wohnhaus dauern im Schnitt rund **200 Tage** [13] **[B, Verbandsquelle – interessengeleitet]**

**Nicht belegbar [?]:** Eine belastbare *Schweizer* Zahl vom Typ «KMU verwenden X % ihrer Arbeitszeit für Administration» konnte ich nicht finden. Die kursierende Zahl «7 % der Arbeitszeit bzw. 32 Stunden pro Monat» stammt aus einer **KfW-Studie zum deutschen Mittelstand (April 2025)** [14] und darf **nicht** als Schweizer Wert präsentiert werden. Wer sie nutzt, muss sie als deutsche Referenzgrösse ausweisen.

## 4. Anwendungsfälle mit belegbarem Effekt

| Anwendungsfall | Belegter Effekt | Quelle | Belastbarkeit |
|---|---|---|---|
| KI-Assistenz im Kundendienst | **+14 %** gelöste Fälle pro Stunde im Schnitt, **+34 %** bei unerfahrenen Mitarbeitenden; zusätzlich bessere Kundenstimmung und tiefere Fluktuation | Brynjolfsson/Li/Raymond, NBER WP 31161, n = 5'179 Support-Agents [15] | Hoch (Feldexperiment) – aber **US-Kontext, ein Unternehmen, Grossbetrieb** |
| KI-Tools im Büroalltag (CH) | 71 % der Beschäftigten fühlen sich produktiver; **aber** 54 % wenden 1–2 h/Woche für Nachbesserung auf; global gehen ~40 % der Zeitersparnis durch Korrektur wieder verloren | Workday/Hanover Research, Erhebung Nov. 2025, n = 3'200 Vollzeitbeschäftigte in **Grossunternehmen** [16] | Mittel – nicht KMU-repräsentativ |
| Zeitersparnis allgemein | 57 % der KI-nutzenden KMU berichten Zeitersparnis; nur **2 %** können deshalb Personal reduzieren, **10 %** haben wegen KI Stellen geschaffen | AXA/Sotomo 2025 [2] | Mittel (n = 300, Selbsteinschätzung) |
| Online-Auffindbarkeit / KI-Suche | 77 % der Bevölkerung wollen KMU-Dienstleistungen online suchen **und direkt buchen**, nur **3 %** der Unternehmen erfüllen das vollständig; **13 %** starten die KMU-Suche direkt mit KI-Tools (18–29-Jährige: 21 %); ~20 % haben in 12 Monaten KI zur Information über KMU-Dienstleistungen genutzt; 39 % können sich Terminbuchung per Sprach-KI vorstellen | KMU Digital Pulse 2025, localsearch + HSLU; Datenbasis 948'816 KMU, Stichprobe 47'079 [17] | Mittel-hoch, aber **Auftraggeber ist Anbieter digitaler Präsenz** |

**Wichtiger Hinweis für die Angebotsgestaltung [A]:** Der Workday-Befund (Nachbesserungsaufwand) und der AXA-Befund (Zeitersparnis ≠ Personalabbau) sind die ehrlichsten Verkaufsargumente, die es gibt: Nutzen entsteht dort, wo ein Prozess *ganz* automatisiert und qualitätsgesichert wird – nicht dort, wo man Mitarbeitenden einen Chatbot hinstellt. Genau das ist Beratungs- und Umsetzungsleistung.

**Nicht verwenden [?]:** Im Netz kursieren zu KI-Telefonassistenz in Arztpraxen Zahlen wie «80–160 Anrufe pro Tag laut FMH-Strukturbericht 2024», «bis 90 Minuten Ersparnis pro Tag laut Digital Health Monitor 2024 (gfs.bern)» oder «80 % aller Routineanrufe automatisierbar». Diese Angaben stammen ausschliesslich von **Anbieter-Marketingseiten**; die zitierten Primärstudien liessen sich nicht verifizieren. Ebenso sind bexio-Angaben («3,5 Stunden Ersparnis pro Woche», «44 % schnellere Buchhaltung», «33 % tiefere Treuhandkosten») **Herstellerangaben ohne unabhängige Prüfung**. Nicht als Beleg im Deck verwenden.

## 5. Hindernisse – was KMU tatsächlich bremst

**Belegt [B]:**
- **Kompetenz- und Fachkräftemangel**, **Risikomanagement** und **komplexe gesetzliche Anforderungen** sind für Schweizer Unternehmen die drei grössten Hürden; zusätzlich stärkere kulturelle Widerstände bei Mitarbeitenden als international. Deloitte Schweiz, MM 31.01.2025, Erhebung Juli–Sept. 2024, 2'773 Führungskräfte in 14 Ländern, **davon nur 50 aus der Schweiz** [18] **[V; sehr kleine CH-Teilstichprobe – nur mit Vorbehalt zitieren]**
- Nur **8 %** der Schweizer Unternehmen sehen ihr Marktumfeld durch GenAI bereits transformiert (USA: 22 %); die Hälfte erwartet grundlegende Branchenveränderungen erst in 1–3 Jahren, 30 % in über 3 Jahren. ebd. [18] **[V]**
- Fehlende Kompetenzen und **ROI-Unsicherheit** bremsen die Entwicklung eigener KI-Lösungen; KMU wünschen klare Regeln und mehr Unterstützung. HWZ/Swisscom [4] **[V]**
- Nur **47 %** der Schweizer KMU haben eine umfassende Digitalisierungsstrategie (mittlere Unternehmen 100–1'000 MA: 62 %, kleine 10–100 MA: 41 %); **89 %** stehen dem Thema grundsätzlich offen gegenüber. digitalswitzerland, via Sekundärquelle [19] **[B, Sekundärquelle – Primärstudie nicht direkt verifiziert]**

**Mit Vorbehalt [?]:** Werte «Cybersicherheit 65 %, Datenschutz 64 %, fehlende Quellentransparenz 61 %» werden einer Deloitte-Erhebung zugeschrieben; die Zuordnung zur Schweizer Stichprobe und das Erhebungsjahr liessen sich nicht abschliessend verifizieren (Seite nicht direkt abrufbar). Nur mit Quellenvorbehalt verwenden.

**Marktdruck-Argument [B]:** Fachkräftemangel in **32 von 55 Berufsgruppen** (Adecco/UZH Stellenmarkt-Monitor); Gesundheitsberufe mit +17 % ausgeschriebenen Stellen der stärkste Wachstumstreiber; der Stellenmarkt insgesamt ist verhalten (Q2 2026: –2,4 % gegenüber Vorquartal) [20]. Automatisierung ist damit weniger ein Sparthema als eine Antwort auf unbesetzbare Stellen.

## 6. Rechtsrahmen – kurz und verkaufsrelevant

- **revDSG** in Kraft seit **01.09.2023**, technologieneutral. Der EDÖB hat klargestellt: Das DSG ist **direkt auf KI-gestützte Datenbearbeitungen anwendbar**, ein separates KI-Gesetz braucht es dafür nicht. Relevant: Transparenzpflicht, **Verzeichnis der Bearbeitungstätigkeiten**, Informationspflicht bei automatisierten Einzelentscheidungen (Art. 21 DSG) und **Datenschutz-Folgenabschätzung bei hohem Risiko** (Art. 22 DSG) [21] **[B]**
- **Bundesrat, 12.02.2025:** Die Schweiz soll die **KI-Konvention des Europarats** ratifizieren; EJPD/UVEK/EDA erarbeiten bis **Ende 2026** eine Vernehmlassungsvorlage (Transparenz, Datenschutz, Nichtdiskriminierung, Aufsicht) [22] **[B]** – also: **eine Regulierung ist unterwegs, aber noch nicht in Kraft.** Frühzeitige Governance ist ein Verkaufsargument, keine Panikmache.

## 7. Fördergelder und Steuerliches

| Instrument | Konditionen | Eignung für Digitalisierungs-/KI-Projekte |
|---|---|---|
| **Innosuisse Innovationsscheck** | bis **CHF 15'000**, 100 % finanziert, Geld geht an den **Forschungspartner** (nicht an das KMU); Antragsteller < 250 VZÄ; kein Scheck für dieselbe Organisation in den letzten 24 Monaten [23] **[B]** | Gut für **Vorstudien/Machbarkeit** mit einer Hochschule (z. B. HSLU). Nicht für reine Umsetzung. |
| **Innosuisse Innovationsprojekt mit Umsetzungspartner** | Umsetzungspartner trägt **40–60 %** der direkten Projektkosten als Eigenleistung (seit Beitragsverordnung 01.01.2023 flexibel statt fix 50 %), plus **mind. 5 %** Cash-Anteil an den Forschungspartner [24] **[B]** | Für grössere, forschungsnahe Vorhaben. KMU < 50 MA stellen laut Sekundärquelle 4 von 5 Umsetzungspartnern [25] **[B, Sekundärquelle]** |
| **F&E-Zusatzabzug** (Art. 25a StHG, seit 01.01.2020) | Kantone können bis **50 %** Zusatzabzug gewähren; Bemessung: direkt zurechenbarer Personalaufwand **+35 % Zuschlag**, bei Auftragsforschung **80 %** der Rechnung; **beim Bund nicht** eingeführt [26] **[B]** | **Achtung:** Nur für wissenschaftliche Forschung / wissenschaftsbasierte Innovation nach Art. 2 FIFG. Normale Digitalisierungs- und Tool-Einführungsprojekte qualifizieren in der Regel **nicht**. |
| **Kanton Luzern** | Gesetzliche Grundlage für den F&E-Zusatzabzug besteht (Prozentsatz per Verordnung durch den Regierungsrat), die Einführung wurde jedoch **vorläufig zurückgestellt** [27] **[B, Sekundärquelle – Status vor einem Pitch verifizieren]** | Vor Zusagen zwingend beim Kanton nachprüfen. |
| **Stiftung «Luzern Innovation»** (geplant) | Regierungsrat beantragt Sonderkredit **CHF 24 Mio.** (1 Mio. Stiftungskapital + 23 Mio. Leistungen 2026–2029); Ziel: Innovationskraft von KMU in frühen Entwicklungsphasen, u. a. Mitfinanzierung von **Machbarkeitsstudien**; Beratung im Kantonsrat noch ausstehend [28] **[B – Status: Antrag, noch nicht beschlossen]** | Zentralschweizer Aufhänger. **Nur als «geplant» kommunizieren.** |

| Anteil Praxissektor | rund 53–54 % (Spital rund 45 %, übrige rund 1,6 %) | 2023/24 | [4][5] **[B]** |

**Verkaufsrelevante Lesart:** Der Bestand wächst, die verfügbare Arbeitszeit pro Kopf sinkt, und ein Viertel der Ärzteschaft steht vor der Pensionierung. Zusätzliches Personal ist also keine realistische Antwort auf Mehraufwand – Prozessautomatisierung ist es.

### 1.2 Praxisformen: Trend Einzel- → Gruppenpraxis

- **45 % der Ärzteschaft im Praxissektor arbeitet in einer Einzelpraxis, 55 % in Doppel- oder Gruppenpraxen** (FMH-Definition: gemeinsame Nutzung von Geräten/Einrichtungen/Räumen durch zwei oder mehr Ärzt:innen). [5] **[B]**
- Strukturell abnehmend ist die Einzelpraxis, weil die Nachfolge fehlt: **rund 1'000 Hausarztpraxen wurden zwischen 2018 und 2024 aufgegeben – ca. 3 % pro Jahr.** [6] **[B*]**
- Bis 2030 muss rund ein Viertel der heute tätigen Hausärzt:innen ersetzt werden, bis 2035 bis zu 40 %. [7] **[S]** – Sekundärquelle (Fachportal), Berechnungsgrundlage nicht offengelegt; im Deck als Grössenordnung führen, nicht als amtliche Zahl.
- Amtliche Strukturdaten (BFS-Erhebung MAS): 2015 gab es **13'971 Arztpraxen und ambulante Zentren an 14'217 Standorten**, mit 17'599 Ärzt:innen (14'044 VZÄ); 48 % der Standorte spezialärztlich, 37 % Grundversorgung, 16 % beides; **99 % betrieben nur einen Standort**. [8][9] **[B] – aber veraltet (Referenzjahr 2015).** Die Erhebung ist für rund 18'000 Betriebe obligatorisch; die Erhebung zum Geschäftsjahr 2023 startete im November 2024. [8][10] Aktuellere gesamtschweizerische Standortzahlen liessen sich in dieser Recherche nicht abrufen. **[NB]**

### 1.3 Zentralschweiz / Kanton Luzern (lokaler Aufhänger)

- **Rund 900 Ärztinnen und Ärzte im ambulanten Sektor ausserhalb des Spitals im Kanton Luzern (2024)**; seit 2009 ein Zuwachs um knapp 340 Personen. [11] **[B*]**
- **Rund 450 Arztpraxen und ambulante Zentren im Kanton Luzern** (Stand 31.12.2022). [11] **[B*]**
- 48 % der im Praxissektor tätigen Luzerner Ärzteschaft arbeitet in der Grundversorgung; der Frauenanteil stieg von 27 % (2009) auf 47 % (2024). [11] **[B*]**
- Ärztinnen und Ärzte arbeiten zunehmend über das Pensionsalter hinaus. [11] **[B*]**

## 2. Was eine Praxisverwaltungs-/Managementfirma typischerweise übernimmt

Abgeleitet aus den publizierten Leistungskatalogen von Ärztekasse, Argomed und medkey [16][17][18][19] **[B]**:

| Domäne | Typische Aufgaben | Automatisierungspotenzial |
|---|---|---|
| Abrechnung / Debitoren | Leistungserfassung prüfen, Rechnungsstellung, Tarifprüfung, Mahnwesen, Inkasso, Honorarvorschuss/Factoring | hoch (Regelprüfung vor Versand) |
| Buchhaltung / Treuhand | Vorkontierung, Finanz- und Lohnbuchhaltung, MWST, Jahresabschluss, Finanzplanung | hoch (Belegerfassung) |
| HR / Recruiting | Anstellungsverträge, Lohnadministration, MPA-Rekrutierung, Weiterbildung | mittel (Screening, Onboarding-Doku) |
| IT / Praxisinformatik | PIS-Betrieb, Updates, Schnittstellen, Backup, Support | mittel |
| Qualitätsmanagement | QM-System, Prozessdokumentation, Audits (z.B. Argomed «MehrFachArzt») | hoch (Dokumentgenerierung) |
| Einkauf | Sammelbestellungen Verbrauchsmaterial, Labor, Konditionen | mittel |
| Marketing / Kommunikation | Website, Auffindbarkeit, Terminplattformen, Patientenkommunikation | hoch |
| Recht / Compliance | Datenschutz (nDSG), Berufsgeheimnis, Verträge, Tarifrecht | mittel |

**Verkaufslogik für Jana Rohrer:** Der Dienstleister sitzt an der Schnittstelle vieler Praxen. Jede Automatisierung skaliert über das gesamte Portfolio – ein Argument, das gegenüber einer Einzelpraxis nicht funktioniert.

## 3. Wo die Zeit verloren geht

### 3.1 Administrativer Aufwand – die belastbarste Schweizer Zahlenreihe

Repräsentative Befragung von **gfs.bern im Auftrag der FMH**, Erhebung 2025 mit **1'532 Ärztinnen und Ärzten**, davon **330 aus dem praxisambulanten Bereich** [20][21] **[B]**:

- Praxisambulant tätige Ärzteschaft: **54 Minuten pro Tag für «sonstige administrative Aufgaben»** (2025). **[B*]**
- In der Vorjahreserhebung 2024 (1'324 Spital-, 383 praxisambulante Ärzt:innen) lag derselbe Wert bei **36,6 Minuten pro Tag**. [22] **[B*]**
- Zum Vergleich Spital: Akutsomatik 114 Min./Tag Dokumentation, Assistenzärzt:innen 183 Min./Tag, Psychiatrie 121 Min./Tag. [20] **[B*]**
- **87 % der praxisambulant Tätigen nennen die Versicherer als grössten Verursacher des administrativen Aufwands** (Erhebung 2024). [22] **[B*]**

> Achtung bei der Interpretation: Der Sprung von 36,6 auf 54 Minuten ist nicht sauber als Zeitreihe interpretierbar (unterschiedliche Stichprobengrössen und ggf. Fragestellungen). Im Deck als «rund eine Stunde pro Arzt und Tag, Tendenz steigend» führen. **[S]**

### 3.2 SGAIM-Umfrage «Papiertiger» – welche Administration konkret nervt

Schweizweite Umfrage der Schweizerischen Gesellschaft für Allgemeine Innere Medizin (SGAIM) unter **1'856 Gesundheitsfachpersonen** aus der Deutschschweiz, Romandie und dem Tessin [23][24][25] **[B]**:

1. **Medikationslisten aktualisieren und Rezepte prüfen** – besonders an den Schnittstellen Spital / Praxis / Spitex und bei Lieferengpässen.
2. **Doppeldokumentation wegen inkompatibler IT-Systeme.**
3. **Anfragen der Versicherer**, inkl. Kostengutsprachen und Wiedererwägungsgesuche.
- **67 % erhalten unnötige Aufgaben auf Papier, 56 % als nicht editierbare PDF.** **[B*]**

Das ist der beste einzelne Beleg für das Angebot «strukturierte Datenextraktion aus PDF/Papier + Rückschreiben ins PIS».

### 3.3 Laufende Bundesstudie (Timing-Aufhänger)

Das BAG hat eine Studie zum administrativen Aufwand in Auftrag gegeben, durchgeführt mit dem **Institut für Hausarztmedizin der Universität Zürich**: Online-Befragung plus **direkte Beobachtung durch 115 Medizinstudierende**, die je einen Tag lang eine Hausärztin/einen Hausarzt begleiten, sowie explorative Interviews mit Praxisassistent:innen. **Start Mai 2026, erste Zwischenergebnisse Ende August 2026, Schlussbericht Januar 2027.** [26][27] **[B*]**

**Aufhänger:** Das Thema ist in den nächsten Wochen medial präsent. Wer jetzt Angebote hat, ist beim Erscheinen der Zwischenergebnisse anschlussfähig.

### 3.4 Abrechnung und Rückweisungen

- **Krankenversicherer weisen rund 10 % der eingereichten Rechnungen zurück**; Hauptgrund sind fehlerhafte Tarifanwendungen, nicht Betrug. [28] **[B]** – Quelle santésuisse (Interessenvertretung der Versicherer), entsprechend einordnen.
- santésuisse beziffert die durch Rechnungsprüfungen entdeckten Falschverrechnungen auf **über 3 Mrd. CHF pro Jahr.** [28] **[B]** (dito: Partei-Angabe)
- Überdurchschnittliche Beanstandungsquoten bei Spitalambulatorien, Notfallbehandlungen im Ausland, Physiotherapie, Komplementärmedizin, Spitex, Rettungsdiensten. [28] **[B]**

**Rechnung fürs Deck (klar als [S] markieren):** Bei 10 % Rückweisungsquote und einem angenommenen Bearbeitungsaufwand von 15 Minuten pro Retoure ergibt sich bei 500 Rechnungen/Monat rund 12,5 Arbeitsstunden monatlich allein für Nacharbeit. Der Bearbeitungsaufwand ist eine Annahme, **keine belegte Zahl.**

### 3.5 No-Shows, Telefon, Triage – hier ist die Datenlage schwach

- **No-Shows: Branchenschätzungen für die Schweiz nennen bis 20 % nicht wahrgenommene Termine. Amtliche Schweizer Statistiken dazu fehlen** – das Fachportal Medinside beschreibt No-Shows ausdrücklich als wachsendes, aber schlecht dokumentiertes Problem. [29][30] **[S]**
- **Telefonaufkommen: keine belastbare Schweizer Studie auffindbar.** Kursierende Zahlen wie «25–50 Anrufe pro Arzt und Tag» oder «30 % der Anrufe werden nicht angenommen» stammen aus deutschen Quellen bzw. Anbieter-Blogs und sind für die Schweiz **nicht belegbar**. **[NB]** – Im Deck nicht als Fakt verwenden; stattdessen im Erstgespräch bei Jana Rohrer die realen Anrufzahlen aus ihrer Telefonanlage erheben.
- **Triage:** keine verwertbaren Schweizer Kennzahlen gefunden. **[NB]**

### 3.6 MPA-Mangel

- **Über 30'000 medizinische Praxisassistent:innen** sind in der Schweiz tätig; der Beruf ist stark weiblich geprägt. [31] **[S]** – Fachportal-Angabe, keine BFS-Quelle auffindbar.
- **Kanton Zürich: rund 12 fehlende MPA pro 100 Ärztinnen und Ärzte** (INFRAS-Analyse zum Fachkräftemangel MPA, Auftrag Kanton Zürich). [32] **[B*]**
- Kolportierte **Austrittsquote von 46,4 %** (höchste unter den Gesundheitsberufen): Quelle und Bezugsjahr liessen sich nicht verifizieren. **[NB]**
- Löhne 2026: Einstieg rund **CHF 4'400–4'800**, erfahrene MPA rund **CHF 5'200–5'800** pro Monat. [33] **[S]** – Jobportal-Angabe, keine GAV-/Verbandsstatistik.
- **Kosten einer Vakanz: keine Schweizer Zahl für Arztpraxen belegbar. [NB]** Verbreitete HR-Faustregel: Verlust einer Fachperson entspricht etwa einem Jahreslohn (kumulierte Effekte inkl. Einarbeitung, Überstunden, Qualitätsverlust). [34] **[S]** – als Faustregel deklarieren, nicht als Studie.

## 4. Praxisinformationssysteme und Schnittstellen

- Der Schweizer Markt umfasst **über 20 aktive Anbieter**; als Referenz gilt der **FMH Services Softwarekatalog (Stand Juni 2026)**. [35][36] **[B]**
- **vitomed (Vitodata AG)** ist laut Anbieter bei **rund 5'000 Ärztinnen und Ärzten in der Schweiz und Liechtenstein** im Einsatz und gilt als eine der verbreitetsten Deutschschweizer Lösungen. [36] **[B]** (Anbieterangabe)
- Kursierende Installationszahlen (Ärztekasse 5'770, vitomed 2'670, Aeskulap 1'530) liessen sich **nicht auf eine datierte Primärquelle zurückführen. [NB]** Nicht ins Deck.
- Weitere relevante Systeme: Aeskulap (Kern), Axenita, CuraMed, siMed, WinMed, tomedo, E-PAT (Vitabyte), MediWin. [35][37] **[B]**
- **Kritisch fürs Angebot:** Der Markt ist fragmentiert. Eine KI-Lösung muss über Schnittstellen, nicht über einen einzigen PIS-Hersteller gedacht werden.

### Standards

| Standard | Was | Status | Quelle |

| **Forum Datenaustausch** XML-Standards | Rechnungs- und Formularaustausch zwischen Leistungserbringern und Versicherern | Gültige Releases: Rechnung 5.0 (`generalInvoiceRequest`), Minimal Clinical Dataset 5.0, Kostengutsprache 4.5, Container 5.0, Formular 4.5 | [38][39] **[B]** |
| **HL7 CH Core (FHIR)**, eCH-0241 | Nationaler Basis-Implementierungsleitfaden für FHIR in der Schweiz, inkl. BFS-Variablen | CH Core R4 v7.0.0: **STU-Ballot von HL7 Schweiz 4.8.–30.9.2026** | [40][41] **[B]** |

| **E-Rezept Schweiz** (FMH + pharmaSuisse) | QR-Code-Rezept aus der Praxissoftware, dezentral, ohne zentrale Datenhaltung | **März 2026 erstmals 100'000 E-Rezepte pro Monat**; Ziel: neuer Standard bis 2029 | [42][43] **[B*]** |
| **EPD / E-GD** | Elektronisches Patientendossier | Heute nur für **seit 2022 neu zugelassene Praxen** verpflichtend; Anschlusspflicht für den ganzen ambulanten Sektor erwartet mit der EPDG-Revision, geschätzt 2027–2029; Ablösung durch E-GD frühestens 2030 | [44][45] **[B]**/**[S]** (Zeitachse ist Prognose) |

## 5. TARDOC und ambulante Pauschalen per 1.1.2026

- Der **Bundesrat genehmigte das neue ambulante Gesamt-Tarifsystem am 30. April 2025.** Der rund 20 Jahre unveränderte TARMED wird per **1. Januar 2026** durch die Einzelleistungstarifstruktur **TARDOC** und eine Struktur mit **ambulanten Pauschalen** abgelöst. [48][49] **[B]**
- Anwendbar sind **TARDOC 1.4c und Ambulante Pauschalen 1.1c**; weitere Anpassungen wurden am **5. November 2025** genehmigt. [49][50] **[B]**
- Die **Genehmigung ist bis 31.12.2028 befristet**, um Nachjustierungen zu erlauben. [48] **[B]**
- TARDOC bildet die Konsultationsdauer präziser ab und berücksichtigt die Grundversorgung besser; die Pauschalen sollen die Abrechnung vereinfachen und Mengenanreize begrenzen. [48] **[B]**

**Administrative Konsequenz für Praxen und Verwalter** [51][52] **[B]**:
neue Positionsnummern und Stammdaten, Software-Updates, angepasste Abrechnungslogik, Teamschulung (MPA und Ärzteschaft), **jährliche Tarifpflege** als neuer Dauerprozess, erhöhtes Risiko von Fehlkodierung und damit Rückweisungen in der Übergangsphase.

**Aufhänger:** 2026 ist das erste volle TARDOC-Jahr. Rückweisungsquoten und Kodierfehler sind jetzt messbar – genau das Fenster, in dem eine Prüf-/Automatisierungslösung verkaufbar ist.

## 6. KI in der Praxis: was belegt ist und was nicht

- **Belastbarste Evidenz:** pragmatische randomisierte klinische Studie mit **238 ambulanten Ärztinnen und Ärzten aus 14 Fachrichtungen** (UCLA Health, 4.11.2024–3.1.2025), drei Arme: Microsoft DAX Copilot, Nabla, Usual Care. Ergebnis: **Nabla reduzierte die Dokumentationszeit («time-in-note») um 9,5 % gegenüber Kontrolle (p = 0,02), rund 41 Sekunden pro Notiz; DAX zeigte keinen signifikanten Effekt (p = 0,66).** Beide verbesserten Burnout- und Stressmasse leicht. Es traten **vereinzelt klinisch relevante Ungenauigkeiten** auf – ärztliche Kontrolle bleibt nötig. Publiziert in NEJM AI. [53][54][55] **[B]**
- **Anbieterversprechen von «2–3 Stunden Zeitersparnis pro Arzt und Tag» oder «80 % weniger Telefonzeit» sind Marketingaussagen ohne unabhängigen Beleg und widersprechen der Studienlage. [NB]** Diese Zahlen dürfen nicht ins Deck – ihre Verwendung würde in einem Gespräch mit einer COO sofort auffliegen.
- **Rechtlicher Rahmen:** Ärztinnen und Ärzte sowie ihre Hilfspersonen unterstehen dem Berufsgeheimnis nach **Art. 321 StGB** (Strafdrohung bis drei Jahre Freiheitsstrafe, gilt auch nach Berufsaufgabe). [56] **[B]** Cloud- und KI-Verarbeitung ist zulässig, wenn der Anbieter als **weisungsgebundene Hilfsperson** eingebunden wird und technisch-organisatorische Massnahmen (insbesondere Verschlüsselung mit Schlüsselkontrolle beim Leistungserbringer) das Berufsgeheimnis wahren. [57] **[B]** Dazu kommt das **revidierte Datenschutzgesetz (nDSG, in Kraft seit 1.9.2023).** [58] **[B]**
- **Praktische Konsequenz fürs Angebot:** Schweizer Rechenzentrum, Auftragsverarbeitungsvertrag mit Hilfspersonen-Klausel, Verschlüsselung, Löschkonzept und PIS-Integration sind keine Zusatzfeatures, sondern Eintrittsbedingung.

## 7. Marktgrösse zur Einordnung

- Gesundheitskosten Schweiz **2024: 97 Mrd. CHF (+4,1 %)**; 2025 geschätzt **100,7 Mrd. CHF.** [59][60] **[B]**/**[S]** (2025 = Schätzung)
- Die OKP bezahlte 2024 medizinische Leistungen von **42,2 Mrd. CHF**; davon entfielen auf **Konsultationen in Arztpraxen rund 9,3 Mrd. CHF.** [60][61] **[B]**
- Wachstum der ambulanten Kurativpflege 2024: **+1,6 %.** [60] **[B]**
- Anzahl Konsultationen pro Arzt: jährlich knapp 1'000 – dritttiefster Wert unter den untersuchten OECD-Staaten. [62] **[S]** (Sekundärquelle, Bezugsjahr unklar)

## 8. Fazit für den Pitch

Die drei stärksten, sauber belegten Angriffspunkte:

1. **Papier und PDF als Systemgrenze.** 67 % der Fachpersonen erhalten unnötige Aufgaben auf Papier, 56 % als nicht editierbare PDF (SGAIM, n = 1'856). Das ist ein direkt automatisierbarer Prozess ohne medizinisches Risiko.
2. **TARDOC-Umstellung 2026 plus 10 % Rückweisungsquote.** Erstes volles Jahr mit neuem Tarif, neue Kodierlogik, messbare Fehlerquote – Prüfung vor Rechnungsversand hat einen unmittelbar rechenbaren Ertrag.
3. **Personal ist nicht skalierbar.** Ein Viertel der Ärzteschaft ist 60+, die Arbeitszeit pro Kopf sinkt von 46 auf 43 Stunden, im Kanton Zürich fehlen rund 12 MPA pro 100 Ärzt:innen. Mehr Köpfe einzustellen ist keine Option – Prozesse zu verschlanken schon.

Ehrlichkeitsgebot im Gespräch: Bei Zeitersparnis durch KI-Dokumentation die RCT-Zahl (rund 10 %) nennen, nicht die Anbieterzahl. Das schafft Glaubwürdigkeit gegenüber einer COO, die Anbieterversprechen kennt.

# KI- und Software-Anwendungsfaelle fuer Arztpraxen und Praxisverwalter (Schweiz)

Recherchestand: 17. August 2026. Zielgruppe: Jana Rohrer, COO einer Praxisverwaltungsfirma.
Schweizer Rechtschreibung, durchgaengig "ss".

**Lesehinweis zur Kennzeichnung**
`[B]` = belegt mit Quelle. `[V]` = Herstellerangabe/Vendor-Claim, nicht unabhaengig geprueft.
`[S]` = eigene Schaetzung/Annahme von Colin Renggli, keine Quelle. `[A]` = Angabe veraltet.

---

## 1. Warum jetzt: vier belegte Ausloeser

**1. Tarifumstellung als Zwangsereignis.** Seit dem 1. Januar 2026 rechnen ambulante Arztleistungen
in der Schweiz ueber TARDOC und Ambulante Pauschalen ab; TARMED ist abgeloest. Eine gemischte
Abrechnung ist unzulaessig, 315 neue Pauschalen kommen hinzu. Leistungen bis 31.12.2025 laufen
weiter ueber TARMED, auch wenn erst 2026 fakturiert wird. `[B, Q1, Q2]`
Entscheidend fuer den Vertrieb: TARDOC rechnet **Zeitleistungen in 1-Minuten-Schritten** ab
(Ausnahme: Kapitel AA, CA und JR mit 5-Minuten-Basis, ab der 6. Minute minutengenau), und
**die verrechnete Leistung muss aus der Patientendokumentation nachvollziehbar sein**. `[B, Q3, Q4]`
Das macht Dokumentationsqualitaet zum Abrechnungsrisiko - nicht zur Kuer.

**2. Arztpraxen sind digitales Schlusslicht.** Im Digital Health Report 2025/2026 (Interpharma/ZHAW,
Oktober 2025) erreichen Arztpraxen **3,4 von 10 Punkten** digitale Reife - hinter Spitaelern (4,6),
Krankenversicherern (6,0) und Pharmaunternehmen (6,8). Untersucht wurden sechs Akteursgruppen. `[B, Q5, Q6]`

**3. Der Engpass ist Zeit und Personal, nicht Nachfrage.** In der gfs.bern-Befragung im Auftrag der FMH
(publiziert 12.11.2025, n = 1'532, davon 330 praxisambulant) geben Aerztinnen und Aerzte
**114 Minuten pro Tag fuer Arbeiten am Patientendossier** an; praxisambulant kommen
**54 Minuten pro Tag** allein fuer Anforderungen von Behoerden und Versicherungen dazu. `[B, Q7]`
Parallel fehlen MPA: 150-200 offene Stellen schweizweit, ueber 250 allein im Kanton Zuerich. `[B (verbandsnah), Q8]`

**4. Regulatorischer Rueckenwind.** E-Rezept Schweiz (FMH/pharmaSuisse) hat im Maerz 2026 erstmals
100'000 E-Rezepte pro Monat erreicht; der Nationalrat hat sich im Maerz 2026 fuer ein Obligatorium
ausgesprochen, eine Pflicht ist ab 2029 im Gespraech. `[B, Q9, Q10]`
Beim elektronischen Patientendossier hat der Bundesrat am 5.11.2025 die Botschaft zum
elektronischen Gesundheitsdossier (E-GD) ans Parlament ueberwiesen: Opt-out fuer die Bevoelkerung,
**Anschlusspflicht auch fuer den ambulanten Bereich**, Abloesung des EPD fruehestens 2030. `[B, Q11, Q12]`

---

## 3. Anwendungsfaelle

Legende Regulatorik: **MP?** = Medizinprodukt-Frage MepV/MDR pruefen. **BG** = Berufsgeheimnis
Art. 321 StGB / Auftragsbearbeitung Art. 9 DSG relevant. **DSFA** = Datenschutz-Folgenabschaetzung
wahrscheinlich noetig. Aufwandsangaben sind durchgaengig `[S]`, sofern nicht anders vermerkt.

## 4. Regulatorik kompakt

**Berufsgeheimnis (Art. 321 StGB).** Offenbaren eines anvertrauten Geheimnisses ist mit Freiheitsstrafe
bis zu drei Jahren oder Geldstrafe bedroht. Cloud- und KI-Nutzung ist zulaessig, wenn der Anbieter
vertraglich als **Hilfsperson** in einem Subordinationsverhaeltnis steht und technisch-organisatorische
Massnahmen greifen - insbesondere Verschluesselung mit Schluesselkontrolle beim Auftraggeber.
Art. 9 DSG regelt die Auftragsbearbeitung. `[B, Q54, Q55]`

**revDSG.** Gesundheitsdaten sind besonders schuetzenswerte Personendaten. Ein Bearbeitungsverzeichnis
ist bei umfangreicher Bearbeitung solcher Daten Pflicht - die 250-Mitarbeitenden-Ausnahme greift dann
nicht. Eine DSFA ist bei hohem Risiko noetig, wovon bei umfangreicher Bearbeitung von Gesundheitsdaten
regelmaessig auszugehen ist. `[B, Q56, Q57]`

**Medizinprodukt (MepV SR 812.213, in Kraft seit 26.5.2021).** Software kann Medizinprodukt sein.
Faustregel fuer den Pitch: Sobald ein Tool eine **diagnostische oder therapeutische Aussage** macht
oder priorisiert (Triage, Befundvorschlag, Dossier-Chat mit klinischer Empfehlung), ist die
Qualifikationsfrage zu klaeren. Reine Administration - Telefon, Termine, Posteingang, Abrechnung,
Dienstplan - faellt in aller Regel nicht darunter. Swissmedic-Merkblatt BW630_30_007d und
FMH-FAQ "Software as a Medical Device" sind die Einstiegsdokumente. `[B, Q58, Q59]`

**EU AI Act.** Die Schweiz ist nicht direkt gebunden, Anbieter mit EU-Bezug schon. Der Digital Omnibus
(Kommissionsvorschlag November 2025, in Kraft 27.7.2026) verschiebt die Hochrisiko-Pflichten:
Annex-III-Systeme auf den 2.12.2027, produktintegrierte KI nach Annex I auf den 2.8.2028;
Einigung Rat/Parlament am 7.5.2026. `[B, Q60, Q61]`

**Schweizer KI-Regulierung.** Bundesratsentscheid vom 12.2.2025: Ratifikation der Europarats-KI-Konvention,
sektorieller Ansatz. Das EJPD erstellt bis Ende 2026 eine Vernehmlassungsvorlage zu Transparenz,
Datenschutz, Nichtdiskriminierung und Aufsicht. `[B, Q62]`

**Technisches Risiko, das man offen ansprechen sollte.** Koenecke et al., "Careless Whisper:
Speech-to-Text Hallucination Harms", ACM FAccT 2024: rund **1% der Transkriptionen** enthielten
komplett halluzinierte Phrasen, die im Audio nicht vorkamen; **38%** dieser Halluzinationen umfassten
explizite Schaeden. `[B, Q63, Q64]` Konsequenz fuer jedes Ambient-Angebot: aerztliche Freigabe vor
Uebernahme ins Dossier ist nicht verhandelbar.

**Akzeptanzrisiko.** Sekundaerberichte ueber Studien 2025/2026 nennen: Zustimmung zu Ambient Scribes
faellt von 74,8% auf 55,3%, sobald Patienten ueber KI-Funktionen und Datenspeicherung informiert werden;
weniger als jeder dritte Patient weiss vom Einsatz. `[V - Sekundaerbericht, Primaerquelle nicht geprueft, Q65]`

## 5. Was ausdruecklich nicht belegbar ist

Diese im Markt kursierenden Zahlen liessen sich **nicht** auf eine unabhaengige Quelle zurueckfuehren
und gehoeren nicht in ein Verkaufs-Deck:

- "2-3 Stunden Dokumentationszeit pro Arzt und Tag gespart" (Anbieterseiten) - der einzige RCT zeigt ca. 10%.
- "80% weniger Telefonzeit" (Anbieterseite) - Herstellerclaim ohne Studie.
- Rueckweisungsquoten von Schweizer Krankenversicherern in Prozent.
- Schweizer No-Show-Raten fuer Arztpraxen (verfuegbare Zahlen sind deutsch).
- Kostensatz von Abrechnungsdienstleistern in Prozent vom Umsatz.

---

## 6. Empfehlung fuer den Pitch

**Reihenfolge nach Verhaeltnis Nutzen zu Risiko (`[S]`, Colins Einschaetzung):**
1. Terminerinnerung und Online-Buchung (Use Cases 4-5) - einziger Bereich mit RCT-Evidenz, kaum Regulatorik, Wochen statt Monate.
2. Abrechnungs-Plausibilisierung und Rueckweisungsanalyse (17-18, 20) - TARDOC macht es dringlich, keine Medizinprodukt-Frage.
3. Posteingang und Dokumentenzuordnung (11) - hoher manueller Anteil, kein klinisches Risiko.
4. Kennzahlen-Dashboard ueber alle Praxen (26) - das eigentliche Produkt fuer eine Verwaltungsfirma, weil es nur dort Sinn ergibt, wo mehrere Praxen zusammenlaufen.
5. Ambient Documentation (8) - hoechste Nachfrage, aber ehrlich kommuniziert: ca. 10% Zeit, deutlich mehr Zufriedenheit, aerztliche Freigabe zwingend.

**Wovon abzuraten ist als Einstiegsprojekt:** Triage (3), Dossier-Chat mit klinischer Aussage (12),
No-Show-Scoring (7) - Medizinprodukt- bzw. Fairness-Fragen ueberwiegen den frueh erzielbaren Nutzen.
