## 5. Vertragliches: Werkvertrag oder Auftrag — und was daraus folgt

### 5.1 Die Unterscheidung **[N]**

| | **Werkvertrag** (Art. 363 ff. OR) | **Auftrag** (Art. 394 ff. OR) |
|---|---|---|
| Geschuldet | **Erfolg** (das Werk) | **Sorgfältiges Tätigwerden**, kein Erfolg |
| Mängel | Prüfung, Rüge, Nachbesserung/Minderung/Wandelung (Art. 367 f. OR) | Keine Gewährleistung; Haftung nur bei Sorgfaltsverletzung (Art. 398 OR) |
| Preis | Feste Übernahme bindet auch bei Mehraufwand (Art. 373 OR); bei ungefährem Ansatz Rücktrittsrecht des Bestellers (Art. 375 OR) | Vergütung, wenn vereinbart oder üblich (Art. 394 Abs. 3 OR) |
| Beendigung | Besteller kann **jederzeit** zurücktreten, aber **gegen volle Entschädigung** (Art. 377 OR) | **Jederzeitiger Widerruf** (Art. 404 OR); Schadenersatz nur bei Kündigung zur Unzeit |

**Die Konsequenz, die Colin kennen muss [N/A]:** Die Erstellung von Individualsoftware wird nach
herrschender Schweizer Lehre als **Werkvertrag** qualifiziert, laufende Beratung, Betrieb und Support
als **Auftrag**; in der Praxis entstehen gemischte Verträge. *Diese Qualifikationsregel ist in dieser
Session nicht mit Fundstelle belegbar* **[NB]** und vor dem Deck anwaltlich zu bestätigen.

Praktisch heisst das:
- **Fixpreis-Pilot → Werkvertrag.** Colin schuldet ein Ergebnis. Deshalb muss der Leistungsumfang
  eng und schriftlich sein — Art. 373 OR lässt Mehraufwand bei fester Übernahme grundsätzlich bei
  ihm liegen **[N]**.
- **Retainer → Auftrag, jederzeit kündbar (Art. 404 OR) [N].** Das ist der wunde Punkt jedes
  Retainer-Modells in der Schweiz. Gegenmittel: Mindestlaufzeit mit **Entschädigungsregel** statt
  Kündigungsausschluss, plus Vorauszahlung pro Quartal.
- **Art. 377 OR ist zugleich Colins Verkaufsargument [N]:** Das Gesetz gibt dem Besteller ohnehin
  ein jederzeitiges Rücktrittsrecht. Eine «Ausstiegsklausel» im Pilotvertrag verschenkt also weniger,
  als sie im Gespräch wert ist.

### 5.2 Was in den Vertrag mit einem KMU gehört

**Rechte am Code — der am häufigsten übersehene Punkt [N]:** Art. 17 URG lässt die
Verwendungsbefugnisse an Software **nur im Arbeitsverhältnis** automatisch an den Arbeitgeber
übergehen. Für einen externen Beauftragten gilt das **nicht** — ohne ausdrückliche vertragliche
Übertragung bleiben die Rechte bei Colin. Urheberpersönlichkeitsrechte sind nicht übertragbar.
Also ausdrücklich regeln: Übertragung der Nutzungsrechte am Kundenprojekt, Rückbehalt einer
**nicht-exklusiven Lizenz an wiederverwendbaren Bausteinen** (Colins Kapital), Umgang mit
Open-Source-Komponenten, Herausgabe des Quellcodes.

**Auftragsbearbeitungsvertrag (ABV) [B, 3]:** Art. 9 DSG verlangt, dass der Auftragsbearbeiter Daten
nur so bearbeitet, wie es der Verantwortliche selbst dürfte, dass keine Geheimhaltungspflicht
entgegensteht und dass **Subunternehmer nur mit vorgängiger Genehmigung** beigezogen werden. Die
vollständige ABV-Checkliste — inklusive Bearbeitungsort «ausschliesslich Schweiz», ausdrücklichem
Ausschluss der Trainingsnutzung, Löschung/Rückgabe bei Vertragsende und, bei Arztpraxen, einer
Berufsgeheimnis-/Hilfspersonenklausel nach Art. 321 StGB — steht in `07-datenschutz-hosting-schweiz.md`
**[B, 3]**. **Für Jana Rohrer ist das kein Anhang, sondern der Hauptvertrag.**

**Das schärfste Vertragsargument [B, 3]:** Das DSG sanktioniert mit Busse bis **CHF 250'000** und
richtet sich gegen **natürliche Personen**, nicht gegen den Unternehmensumsatz — strafbar ist unter
anderem, wer die Bearbeitung ohne Erfüllung der Voraussetzungen von Art. 9 überträgt. Es haftet der
Geschäftsführer persönlich, nicht die AG. Das trifft Onkel und Cousine gleichermassen.

**Haftung [N]:** Haftungsbeschränkung ist üblich und zulässig — aber Art. 100 OR macht eine
Wegbedingung für **Absicht und grobe Fahrlässigkeit nichtig**. Realistische Regelung: Beschränkung
auf das Auftragsvolumen der letzten 12 Monate, Ausschluss von Folgeschäden, kein Ausschluss für
Personenschäden und grobe Fahrlässigkeit. Berufshaftpflicht **[A]** vor dem ersten Auftrag abschliessen.

**Wartung/SLA [A]:** Reaktionszeit statt Behebungszeit zusagen; Servicezeiten benennen
(Bau: früh ab 06:00; Praxis: Sprechstundenzeiten); Eskalationsweg mit einer Telefonnummer;
Verfügbarkeit nur zusagen, soweit der eigene Hoster sie zusagt.

**Exit/Übergabe — das Klumpenrisiko-Gegenmittel [A]:** Quellcode in einem Repository des Kunden,
Zugangsdaten beim Kunden, Dokumentation als Vertragsbestandteil, Deployment ohne Colin
reproduzierbar, benannter Zweitkontakt. Das offen anzubieten ist stärker, als darauf zu warten,
dass der Onkel fragt: «Und wenn du unter den Bus kommst?»

## 6. Den skeptischen Patron überzeugen **[A]**

Belegte Verkaufsstudien: **[NB]**. Was sich fachlich verantworten lässt:

1. **Kleiner Pilot mit definiertem Ausstieg.** Der Ausstieg ist ohnehin gesetzlich gegeben
   (Art. 377 OR **[N]**) — ihn aktiv anzubieten kostet nichts und nimmt die Angst.
2. **Risiko-Umkehr, aber begrenzt.** «Wenn die Baseline nicht besser wird, zahlen Sie den Piloten
   nicht.» *Fallstrick:* ohne vorher unterschriebene Baseline unbezahlbar — die Messung wird dann zur
   Verhandlungsmasse.
3. **Referenz-Deal.** Rabatt gegen Nennung und Fallstudie. *Fallstrick:* Beim Bau ist die
   Referenzierbarkeit heikel (Preistransparenz gegenüber Konkurrenz), bei der Praxis wegen
   Patientendaten teilweise unmöglich. Vorher fragen, nicht nachher.
4. **«Kostenlos bis es funktioniert».** *Fallstrick — der grösste:* Gratisarbeit senkt den
   wahrgenommenen Wert, verschiebt die Priorität beim Kunden nach unten und macht «funktioniert»
   verhandelbar. **Nicht empfohlen** — der bezahlte Workshop mit Anrechnung erreicht dasselbe
   Ziel, ohne den Preisanker zu zerstören.
5. **Familienkontext benennen.** Onkel und Cousine sind Verwandte. Der Reflex, es «unter uns» ohne
   Vertrag zu machen, ist der grösste Risikofaktor des ganzen Geschäfts. Ein sauberer, kurzer Vertrag
   schützt hier die Beziehung, nicht das Geschäft — und dieser Satz gehört ins Meeting.

## Ergaenzungen, die fehlen

**Die Familie.** Onkel und Cousine, Geld, ein Neffe, der zweimal nicht angekommen ist — und kein
Satz dazu in 90 Minuten. Das ist der lauteste ungesagte Gedanke im Raum. Neue Zeile auf Folie 09:
«Wenn es nicht funktioniert, will ich, dass ihr das sagen könnt, ohne an Weihnachten zu denken.
Deshalb: schriftlicher Vertrag, Fixpreis, Ausstieg nach jeder Stufe — genau wie mit einem
Fremden.»

**Dass es noch keinen zahlenden Kunden gibt.** Beide Betriebsprojekte kamen nie zum Einsatz, die
drei Anwendungen sind Eigenbau, und der vierstufige Ablauf auf Folie 10 ist noch nie durchlaufen
worden. Der Onkel rechnet das in drei Minuten aus. Ausgesprochen ist es ein Vertrauensgewinn,
ertappt ist es das Ende des Termins: «Ich habe diesen Ablauf noch mit niemandem zu Ende gemacht.
Ihr wärt die Ersten — deshalb der bezahlte halbe Tag, der Fixpreis und der Ausstieg nach jeder
Stufe. Und deshalb rechne ich den ersten Piloten zum halben Satz, wenn ich dafür mit Namen und
Zahl darüber sprechen darf.»

**Wer haftet, wenn das System irrt.** Im Praxis-Deck geregelt (aerztliche Freigabe), im Bau nicht —
und dort steht der Fristenwaechter, der den sechsstelligen Schaden verhindern soll. Satz auf Deck
3/06: «Der Wächter erinnert, er entscheidet nicht. Die Frist bleibt in der Verantwortung des
Betriebs — das steht auch so im Vertrag.» Dazu auf 10b eine Zeile zu Haftungsbegrenzung und
Berufshaftpflicht.

**Janas datenschutzrechtliche Rolle.** Deck 4 behandelt sie durchgehend als Verantwortliche. Eine
Praxisverwaltung ist gegenueber den Praxen aber meist selbst Auftragsbearbeiterin — dann sind wir
Sub-Auftragsbearbeiter und brauchen die vorgaengige Genehmigung der Praxen. Jana kann uns dann gar
nicht allein beauftragen. Das ist die Frage, an der ein Pilot scheitert, *nachdem* er verkauft ist.

**Der Abschluss.** Die Agenda hat «75–90 Naechster Schritt», aber keine Folie dazu; der Termin
endet mit Deck 4, also mit einer Folie, die den Onkel nicht meint. Eine Schlussfolie mit vier
Zeilen zum Ausfuellen im Raum, zweimal: «Vorhaben ___ · verantwortlich bei euch ___ · Messstart
___ · naechster Termin ___». Dazu die Katalogauswahl beiden noch am Tisch per Mail schicken — der
Export existiert. Und einen Knopf «Rechnung kopieren» im Rechner: nach 15 Minuten gemeinsamem
Reglerschieben ist die einzige Zahl, auf die man sich geeinigt hat, sonst beim Schliessen des Tabs
weg.

**Verfuegbarkeit.** Nirgends steht, ob er Vollzeit verfuegbar ist, ab wann, und wie viele Piloten
er parallel tragen kann. Zwei Betriebe fragen sich das gleichzeitig. Gehoert auf Folie 10, Stufe 1.

**Colins eigene Vertraege.** Konkurrenzverbot und Geheimhaltung aus den zwei Arbeitsverhaeltnissen
kommen in der Vorbereitungsliste nicht vor. Er baut eine Agentur in derselben Region auf. Zehn
Minuten ins eigene Dossier, vor dem Termin.

## Verworfene Befunde

- **«Deck 3/06 behauptet, die Pfandrechtsfrist sei seit 1.1.2026 von drei auf vier Monate
  verlaengert.»** (zweimal gemeldet) — Nachgelesen: die Folie sagt schlicht «4 Monate … gerechnet
  ab Vollendung der Arbeit», die Sprechernotiz warnt ausdruecklich davor, sie als neu zu
  verkaufen, und im Cockpit steht der Pruefpunkt mit der Gegenpruefung. Bereits korrigiert. Der
  Rest des Befunds (Quellzeile «Art. 839 ZGB» liest sich wie ein Volltext-Beleg) bleibt gueltig,
  ist aber kosmetisch: Zusatz «Orientierung, keine Rechtsauskunft» genuegt.
- **«Deck 3/04 traegt den Titel: Ein Drittel *eurer* Baustelle spricht Portugiesisch. *Eure*
  Rapporte sprechen Deutsch.»** — Falsch zitiert. Der Titel lautet «Der Rapport ist auf Deutsch.
  Die Baustelle nicht.», die Kennzahlen sind Branchenzahlen mit Quelle, und die Quellzeile weist
  selbst darauf hin, dass Nationalitaeten erhoben wurden und nicht Sprachen. Die Folie behauptet
  nichts ueber Stirnimann. Nichts zu tun.
- **«Katalog 27 muss angepasst werden (Frist als Neuerung).»** — Der Eintrag nennt keine Neuerung.
  Nichts zu tun.
- **«Deck 2/03 ersatzlos streichen.»** — Folie 04 baut auf ihr auf, und die 2-%/10-%-Zahl war
  ausgerechnet der Punkt, den dieselbe Leserin als staerkstes Argument bezeichnet. Auf Kuerzen
  reduziert.
- **«Beide Spezialdecks auf 10 Minuten kuerzen und die Preisverhandlung in getrennte Termine
  verlegen.»** — Der Befund stimmt (jeder sitzt 15 Minuten daneben, und niemand sagt vor dem
  anderen als Erster zu), die Massnahme ist aber ein Umbau der Dramaturgie zwei Tage vor dem
  Termin. Uebernommen wird nur der billige Teil: der Uebergangssatz mit Auftrag statt «hoert zu» —
  «Jana, du hörst jetzt zwölf Minuten Bau. Deine Aufgabe: sag mir am Schluss, welcher der Abläufe
  bei euch genauso aussieht.» — und am Ende der Vorschlag zweier Einzeltermine als *naechster
  Schritt*, nicht als Umbau von heute.

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v === null || v === undefined || v === false) continue;
    if(k === "class") n.className = v;
    else if(k === "html") n.innerHTML = v;
    else if(k === "text") n.textContent = v;
    else if(k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for(const k of kids.flat()){
    if(k === null || k === undefined || k === false) continue;
    n.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
  }
  return n;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const nf = new Intl.NumberFormat("de-CH");
const chf = n => "CHF " + nf.format(Math.round(n));
const chfK = n => n >= 100000 ? "CHF " + nf.format(Math.round(n/1000)) + " Tsd." : chf(Math.round(n/100)*100);

/* Ein sehr kleiner Markdown-Renderer — reicht für die Rechercheberichte. */
function md(src){
  const lines = String(src).replace(/\r\n/g,"\n").split("\n");
  let out = "", list = null, inTable = false, tRows = [];

  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>");

  const closeList = () => { if(list){ out += `</${list}>`; list = null; } };
  const closeTable = () => {
    if(!inTable) return;
    inTable = false;
    if(!tRows.length) return;
    const head = tRows[0];
    const body = tRows.slice(1);
    out += '<div class="doc__scroll"><table><thead><tr>' +
      head.map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
      body.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
      "</tbody></table></div>";
    tRows = [];
  };

  for(let raw of lines){
    const line = raw.replace(/\s+$/,"");

    if(/^\s*\|/.test(line)){
      const cells = line.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c => c.trim());
      if(cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
      closeList();
      inTable = true; tRows.push(cells);
      continue;
    }
    closeTable();

    if(!line.trim()){ closeList(); continue; }

    let m;
    if((m = line.match(/^(#{1,4})\s+(.*)$/))){
      closeList();
      const lvl = Math.min(m[1].length, 4);
      out += `<h${lvl}>${inline(m[2])}</h${lvl}>`;
      continue;
    }
    if(/^\s*(---|===|\*\*\*)\s*$/.test(line)){ closeList(); out += "<hr>"; continue; }
    if((m = line.match(/^\s*>\s?(.*)$/))){ closeList(); out += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if((m = line.match(/^\s*[-*+]\s+(.*)$/))){
      if(list !== "ul"){ closeList(); out += "<ul>"; list = "ul"; }
      out += `<li>${inline(m[1])}</li>`; continue;
    }
    if((m = line.match(/^\s*(\d+)[.)]\s+(.*)$/))){
      if(list !== "ol"){ closeList(); out += "<ol>"; list = "ol"; }
      out += `<li>${inline(m[2])}</li>`; continue;
    }
    if(list){ out += `<li>${inline(line.trim())}</li>`; continue; }
    out += `<p>${inline(line)}</p>`;
  }
  closeList(); closeTable();
  return out;
}

/* Die Decks werden in mehreren Blöcken definiert. Massgebend für die
   Reihenfolge ist ihre eigene Nummer, nicht die Reihenfolge im Quelltext. */
function deckIds(){
  return Object.keys(DECKS).sort((a,b) => Number(DECKS[a].no) - Number(DECKS[b].no));
}

const SPUR = {
  bau:   { chip:"chip--bau",  eyebrow:"eyebrow--bau",  label:"Bau" },
  care:  { chip:"chip--care", eyebrow:"eyebrow--care", label:"Praxis" },
  both:  { chip:"chip--both", eyebrow:"",              label:"Beide" }
};

function renderSlide(s, idx, total, deck){
  const spur = SPUR[s.spur || deck.spur || "both"];
  const pad = el("div", {class:"slide__pad " + (s.layout ? "l-" + s.layout : "")});

  if(s.eyebrow) pad.appendChild(el("div", {class:"eyebrow " + (spur.eyebrow||""), text:s.eyebrow}));
  if(s.kicker)  pad.appendChild(el("div", {class:"kicker", text:s.kicker}));
  if(s.h1)      pad.appendChild(el("h1", {html:s.h1}));
  if(s.big)     pad.appendChild(el("p", {class:"big", html:s.big}));
  if(s.h2)      pad.appendChild(el("h2", {html:s.h2}));
  if(s.lead)    pad.appendChild(el("p", {class:"lead " + (s.leadSerif ? "serif" : ""), html:s.lead}));
  if(s.sub)     pad.appendChild(el("p", {class:"sub", html:s.sub}));

  if(s.body) pad.appendChild(buildBody(s.body, spur));

  if(s.note)  pad.appendChild(el("div", {class:"note " + (spur === SPUR.care ? "note--care" : ""), html:s.note}));
  if(s.src)   pad.appendChild(el("div", {class:"src", html:s.src}));

  const foot = el("div", {class:"slide__foot"},
    el("span", {text:deck.short}),
    el("span", {class:"rule"}),
    el("span", {class:"slide__no", text:String(idx+1).padStart(2,"0") + " / " + String(total).padStart(2,"0")})
  );

  const slide = el("article", {class:"slide", "data-spur":s.spur || deck.spur || "both"}, pad, foot);
  return slide;
}

function buildBody(body, spur){
  const wrap = el("div", {class:"col", style:"flex:1 1 auto;min-height:0;gap:1.1em"});
  for(const b of [].concat(body)){
    wrap.appendChild(buildBlock(b, spur));
  }
  return wrap;
}

function buildBlock(b, spur){
  const care = spur === SPUR.care;
  switch(b.t){
    case "p":
      return el("p", {html:b.v, class:b.serif ? "serif" : ""});
    case "lead":
      return el("p", {class:"lead" + (b.serif ? " serif" : ""), html:b.v});
    case "h3":
      return el("h3", {html:b.v});
    case "ticks":
      return el("ul", {class:"ticks" + (care ? " ticks--care" : "")},
        b.v.map(x => el("li", {html:x})));
    case "kpis":
      return el("div", {class:"kpis"},
        b.v.map(k => el("div", {class:"kpi " + (k.spur === "care" || (care && !k.spur) ? "kpi--care" : k.spur === "none" ? "" : "kpi--bau")},
          el("div", {class:"kpi__n", html:k.n}),
          el("div", {class:"kpi__l", html:k.l}),
          k.s ? el("div", {class:"kpi__s", html:k.s}) : null
        )));
    case "cards":
      return el("div", {class:"cards cards--" + (b.cols || Math.min(b.v.length,3))},
        b.v.map((c,i) => el("div", {class:"card" + (c.accent ? (care ? " card--care" : " card--accent") : "")},
          el("div", {class:"card__t"}, c.n ? el("span", {class:"n", text:c.n}) : null, el("span", {html:c.t})),
          c.p ? el("p", {html:c.p}) : null,
          c.foot ? el("div", {class:"src", html:c.foot}) : null
        )));
    case "steps":
      return el("div", {class:"steps"},
        b.v.map(s => el("div", {class:"step" + (s.now ? " step--now" : "") + (s.dark ? " step--dark" : "")},
          s.y ? el("div", {class:"step__y", text:s.y}) : null,
          el("div", {class:"step__t", html:s.t}),
          s.p ? el("p", {html:s.p}) : null
        )));
    case "table":
      return el("div", {style:"overflow-x:auto"},
        el("table", {class:"stable"},
          el("thead", null, el("tr", null, b.head.map(h => el("th", {html:h})))),
          el("tbody", null, b.rows.map(r => el("tr", null,
            r.map((c,i) => el("td", {html:c, class:(b.num && b.num.includes(i)) ? "num" : ""})))))
        ));
    case "split":
      return el("div", {class:"l-split" + (b.mod ? " l-split--" + b.mod : ""), style:"flex:1 1 auto;min-height:0"},
        el("div", {class:"col"}, [].concat(b.a).map(x => buildBlock(x, spur))),
        el("div", {class:"col"}, [].concat(b.b).map(x => buildBlock(x, spur))));
    case "note":
      return el("div", {class:"note" + (care ? " note--care" : ""), html:b.v});
    case "src":
      return el("div", {class:"src", html:b.v});
    case "spacer":
      return el("div", {style:"flex:1 1 auto"});
    case "btn":
      /* Aus der Folie direkt ins Werkzeug springen — im Meeting der
         Unterschied zwischen "ich könnte zeigen" und "schauen wir an". */
      return el("div", {style:"display:flex;gap:.7em;flex-wrap:wrap;align-items:center"},
        [].concat(b.v).map(x => el("button", {
          class:"btn btn--primary", type:"button",
          style:"font-size:.86em;padding:.55em 1em",
          onclick:() => go(x.go)
        }, x.t)),
        b.hint ? el("span", {class:"src", style:"font-size:.68em", html:b.hint}) : null);
    default:
      return el("p", {html:String(b.v || "")});
  }
}

let route = {view:"cockpit", slide:0};

function go(view, slide){
  route.view = view;
  route.slide = slide || 0;
  if(!DECKS[view]) exitPresent();
  render();
  $("#view").scrollTop = 0;
  if(window.innerWidth <= 860) document.body.classList.add("rail-collapsed");
}

function render(){
  buildNav();
  const v = $("#view");
  v.innerHTML = "";
  const isDeck = !!DECKS[route.view];

  $("#ovBtn").hidden = !isDeck;
  $("#notesBtn").hidden = !isDeck;
  $("#presentBtn").hidden = !isDeck;
  $("#topChip").hidden = true;

  if(isDeck) renderDeck(v, DECKS[route.view]);
  else if(route.view === "katalog") renderKatalog(v);
  else if(route.view === "rechner") renderRechner(v);
  else if(route.view === "recherche") renderRecherche(v);
  else if(route.view === "einstellungen") renderEinstellungen(v);
  else renderCockpit(v);
}

function renderDeck(v, deck){
  const slides = deck.slides();
  route.slide = Math.max(0, Math.min(route.slide, slides.length - 1));
  $("#topTitle").textContent = deck.title;
  const spur = SPUR[deck.spur || "both"];
  const chip = $("#topChip");
  chip.hidden = false;
  chip.className = "chip " + spur.chip;
  chip.textContent = deck.audience || spur.label;

  const frame = el("div", {class:"slideframe"}, renderSlide(slides[route.slide], route.slide, slides.length, deck));

  const prog = el("div", {class:"progress"},
    slides.map((_,i) => el("i", {class: i < route.slide ? "on" : i === route.slide ? "cur" : ""})));

  const bar = el("div", {class:"deckbar"},
    el("button", {class:"btn btn--ghost", type:"button", onclick:() => step(-1), "aria-label":"Zurück"}, "←"),
    prog,
    el("span", {class:"deckbar__no", text:(route.slide+1) + " / " + slides.length}),
    el("button", {class:"btn btn--ghost", type:"button", onclick:() => step(1), "aria-label":"Weiter"}, "→")
  );

  const notes = el("div", {class:"notes", id:"notesBox", hidden:!notesOn},
    el("h4", {text:"Sprechernotiz"}),
    el("div", {html: slides[route.slide].notes || "<span class='dim'>Keine Notiz.</span>"})
  );

  v.appendChild(el("div", {class:"deckwrap"}, frame, bar, notes));
  window.__slides = slides;
  window.__deck = deck;
  requestAnimationFrame(() => ueberlaufPruefen(bar));
}

/* Eine Folie mit fester Seitenlänge schneidet zu langen Inhalt stillschweigend
   ab. Das darf im Meeting nicht passieren — also sichtbar melden. */
function ueberlaufPruefen(bar){
  const pad = $(".slide__pad");
  if(!pad) return;
  const zuviel = pad.scrollHeight - pad.clientHeight;
  window.__ueberlauf = zuviel > 2 ? zuviel : 0;
  if(zuviel > 2 && !presenting){
    const w = el("span", {class:"chip", style:"border-color:var(--crit);color:var(--crit);background:var(--crit-weak)",
      title:"Der Inhalt dieser Folie ist " + Math.round(zuviel) + " px höher als die Folie und wird abgeschnitten.",
      text:"Inhalt zu lang"});
    bar.insertBefore(w, bar.lastChild);
  }
}

function step(d){
  const slides = window.__slides || [];
  const n = Math.max(0, Math.min(route.slide + d, slides.length - 1));
  if(n === route.slide) return;
  route.slide = n;
  render();
}

/* Handout drucken: alle Folien aller Decks, wahlweise mit Sprechernotizen.
   Wird nach dem Druck wieder aus dem Baum entfernt. */
function handoutDrucken(mitNotizen){
  const alt = $("#handout");
  if(alt) alt.remove();

  const box = el("div", {id:"handout", class:"handout"});
  for(const id of deckIds()){
    const deck = DECKS[id];
    const slides = deck.slides();
    box.appendChild(el("div", {class:"handout__deck"},
      el("div", {class:"masslinie", text:"Deck " + deck.no}),
      el("h2", {html:deck.title}),
      el("p", {style:"margin:0;color:#444;max-width:60ch", html:deck.blurb}),
      el("p", {class:"mono", style:"margin-top:10px;font-size:11px;color:#666",
               text:slides.length + " Folien · " + (deck.dauer||"") + " · " + (deck.audience||"")})
    ));
    slides.forEach((s,i) => {
      box.appendChild(renderSlide(s, i, slides.length, deck));
      if(mitNotizen && s.notes){
        box.appendChild(el("div", {class:"handout__notes"},
          el("h4", {text:"Sprechernotiz · " + deck.short + " · Folie " + (i+1)}),
          el("div", {html:s.notes})));
      }
    });
  }

  document.body.appendChild(box);
  document.body.classList.add("is-printing");

  /* Aufräumen erst, wenn der Druckdialog wirklich zu ist. Ein Zeitgeber
     würde den Inhalt mitten im Druck entfernen — genau das ist beim Testen
     passiert und hat aus 53 Seiten acht gemacht. */
  const aufraeumen = () => {
    document.body.classList.remove("is-printing");
    box.remove();
    window.removeEventListener("afterprint", aufraeumen);
    document.removeEventListener("keydown", beiTaste, true);
  };
  const beiTaste = e => { if(e.key === "Escape") aufraeumen(); };
  window.addEventListener("afterprint", aufraeumen);
  document.addEventListener("keydown", beiTaste, true);

  setTimeout(() => window.print(), 80);
}

let notesOn = false;
function toggleNotes(){
  notesOn = !notesOn;
  const b = $("#notesBox");
  if(b) b.hidden = !notesOn;
}

let presenting = false;
function togglePresent(){
  presenting ? exitPresent() : enterPresent();
}
function enterPresent(){
  if(!DECKS[route.view]) return;
  presenting = true;
  document.body.classList.add("is-presenting");
  const r = document.documentElement;
  if(r.requestFullscreen) r.requestFullscreen().catch(()=>{});
}
function exitPresent(){
  presenting = false;
  document.body.classList.remove("is-presenting");
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}

document.addEventListener("keydown", e => {
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const inDeck = !!DECKS[route.view];

  if(e.key === "Escape"){
    if(!$("#overview").hidden){ toggleOverview(false); return; }
    if(presenting){ exitPresent(); return; }
  }
  if(!inDeck) return;

  switch(e.key){
    case "ArrowRight": case " ": case "PageDown": case "Enter":
      e.preventDefault(); step(1); break;
    case "ArrowLeft": case "PageUp": case "Backspace":
      e.preventDefault(); step(-1); break;
    case "Home": e.preventDefault(); route.slide = 0; render(); break;
    case "End": e.preventDefault(); route.slide = 999; render(); break;
    case "n": case "N": toggleNotes(); break;
    case "g": case "G": toggleOverview(); break;
    case "f": case "F": togglePresent(); break;
  }
});

/* Wischen auf dem Tablet */
(function(){
  let x0 = null, y0 = null;
  document.addEventListener("touchstart", e => {
    if(e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", e => {
    if(x0 === null || !DECKS[route.view]) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8) step(dx < 0 ? 1 : -1);
    x0 = y0 = null;
  }, {passive:true});
})();

/* Meeting-Timer */
(function(){
  let t0 = null, acc = 0, iv = null;
  const out = () => {
    const ms = acc + (t0 ? Date.now() - t0 : 0);
    const s = Math.floor(ms/1000);
    $("#timerT").textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
  };
  $("#timerGo").addEventListener("click", () => {
    if(t0){ acc += Date.now() - t0; t0 = null; clearInterval(iv); iv = null; $("#timerGo").textContent = "Start"; }
    else { t0 = Date.now(); iv = setInterval(out, 1000); $("#timerGo").textContent = "Stopp"; }
    out();
  });
  $("#timerRst").addEventListener("click", () => {
    acc = 0; if(t0) t0 = Date.now(); out();
  });
  out();
})();

/* Theme */
function applyTheme(){
  const r = document.documentElement;
  if(S.theme === "auto") r.removeAttribute("data-theme");
  else r.setAttribute("data-theme", S.theme);
}
$("#themeBtn").addEventListener("click", () => {
  S.theme = S.theme === "auto" ? "dark" : S.theme === "dark" ? "light" : "auto";
  applyTheme(); save();
  $("#themeBtn").textContent = S.theme === "auto" ? "Dunkel / Hell" : S.theme === "dark" ? "Dunkel" : "Hell";
});

$("#ovBtn").addEventListener("click", () => toggleOverview());
$("#ovClose").addEventListener("click", () => toggleOverview(false));
$("#notesBtn").addEventListener("click", toggleNotes);
$("#presentBtn").addEventListener("click", togglePresent);
$("#railBtn").addEventListener("click", () => document.body.classList.toggle("rail-collapsed"));

document.addEventListener("fullscreenchange", () => {
  if(!document.fullscreenElement && presenting) exitPresent();
});

function sizeCheck(){
  const small = window.innerWidth <= 860;
  $("#railBtn").style.display = small ? "" : "none";
  if(!small) document.body.classList.remove("rail-collapsed");
}
window.addEventListener("resize", sizeCheck);

/* =======================================================================
   8 — Start
   ======================================================================= */

function boot(){
  applyTheme();
  $("#themeBtn").textContent = S.theme === "auto" ? "Dunkel / Hell" : S.theme === "dark" ? "Dunkel" : "Hell";
  sizeCheck();
  render();
}
</script>

let katFilter = {spur:"alle", aufwand:"alle", q:""};

const AUFWAND_TAG = {klein:"tag--eff", mittel:"tag--mid", gross:"tag--big"};
const AUFWAND_TXT = {klein:"kleiner Aufwand", mittel:"mittlerer Aufwand", gross:"grosses Vorhaben"};

function katMatches(it){
  if(katFilter.spur !== "alle"){
    if(katFilter.spur === "bau"   && !(it.spur === "bau"  || it.spur === "both")) return false;
    if(katFilter.spur === "care"  && !(it.spur === "care" || it.spur === "both")) return false;
  }
  if(katFilter.aufwand !== "alle" && it.aufwand !== katFilter.aufwand) return false;
  const q = katFilter.q.trim().toLowerCase();
  if(q){
    const hay = (it.t + " " + it.p + " " + (it.win||"") + " " + (it.tags||[]).join(" ")).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function renderKatalog(v){
  $("#topTitle").textContent = "Leistungskatalog";
  const p = el("div", {class:"page page--wide"});

  p.appendChild(el("div", null,
    el("div", {class:"masslinie masslinie--full", text:"Katalog · " + KATALOG.length + " Angebote"}),
    el("h1", {style:"font-size:clamp(1.7rem,3.4vw,2.5rem);letter-spacing:-.03em;font-weight:800;margin:.4em 0 .3em;line-height:1.05",
              text:"Was wir für einen Betrieb machen können"}),
    el("p", {style:"color:var(--ink-2);max-width:66ch;font-size:1rem;line-height:1.55",
             html:"Jede Zeile ist ein Vorhaben, das für sich allein Sinn ergibt und einzeln bestellbar ist. Filtern, was zum Betrieb passt, mit dem <b>+</b> markieren — daraus wird unten die Auswahlliste für das Gespräch."})
  ));

  const mkPill = (label, key, val, cls) => el("button", {
    class:"pill " + (cls||""), type:"button",
    "aria-pressed": katFilter[key] === val ? "true" : "false",
    onclick:() => { katFilter[key] = val; render(); }
  }, label);

  const search = el("input", {class:"search", type:"search", placeholder:"Suchen: Telefon, Rapport, Offerte, Recruiting …", value:katFilter.q});
  search.addEventListener("input", e => {
    katFilter.q = e.target.value;
    const g = $("#catgrid");
    if(g) fillCatgrid(g);
    const c = $("#katCount");
    if(c) c.textContent = KATALOG.filter(katMatches).length + " von " + KATALOG.length + " sichtbar";
  });

  p.appendChild(el("div", {class:"panel"},
    el("div", {class:"filters"},
      search,
      mkPill("Alle", "spur", "alle"),
      mkPill("Bau", "spur", "bau", "pill--bau"),
      mkPill("Arztpraxen", "spur", "care", "pill--care"),
      el("span", {style:"width:10px"}),
      mkPill("Jeder Aufwand", "aufwand", "alle"),
      mkPill("Klein", "aufwand", "klein"),
      mkPill("Mittel", "aufwand", "mittel"),
      mkPill("Gross", "aufwand", "gross")
    ),
    el("div", {class:"dim mono", id:"katCount", style:"font-size:.72rem;letter-spacing:.06em",
               text:KATALOG.filter(katMatches).length + " von " + KATALOG.length + " sichtbar"})
  ));

  const grid = el("div", {class:"catgrid", id:"catgrid"});
  fillCatgrid(grid);
  p.appendChild(grid);

  p.appendChild(shortlistBar());
  v.appendChild(p);
}

function fillCatgrid(grid){
  grid.innerHTML = "";
  const list = KATALOG.filter(katMatches);
  if(!list.length){
    grid.appendChild(el("p", {class:"dim", text:"Nichts gefunden. Filter zurücksetzen oder anders suchen."}));
    return;
  }
  list.forEach(it => {
    const on = S.picked.includes(it.id);
    grid.appendChild(el("article", {class:"item item--" + it.spur},
      el("button", {
        class:"item__pick", type:"button", "aria-pressed":on ? "true":"false",
        "aria-label": on ? "Aus der Auswahl nehmen" : "Zur Auswahl hinzufügen",
        onclick:(e) => {
          const i = S.picked.indexOf(it.id);
          if(i >= 0) S.picked.splice(i,1); else S.picked.push(it.id);
          save();
          fillCatgrid(grid);
          const sb = $("#shortlist");
          if(sb) sb.replaceWith(shortlistBar());
        }
      }, on ? "✓" : "+"),
      el("div", {class:"item__top"},
        el("span", {class:"item__no", text:String(it.id).padStart(2,"0")}),
        el("h3", {html:it.t})
      ),
      el("p", {html:it.p}),
      it.win ? el("div", {class:"item__win", html:"<b>Wirkung:</b> " + it.win}) : null,
      el("div", {class:"item__tags"},
        el("span", {class:"tag " + AUFWAND_TAG[it.aufwand], text:AUFWAND_TXT[it.aufwand]}),
        it.zeit ? el("span", {class:"tag", text:it.zeit}) : null,
        (it.tags||[]).map(t => el("span", {class:"tag", text:t}))
      )
    ));
  });
}

function shortlistBar(){
  const picked = KATALOG.filter(i => S.picked.includes(i.id));
  const bar = el("div", {class:"shortlist", id:"shortlist"},
    el("span", {class:"shortlist__n", html:"<b>" + picked.length + "</b> ausgewählt"}),
    el("span", {class:"dim", style:"font-size:.84rem;flex:1 1 200px",
      html: picked.length ? picked.map(i => esc(i.t)).join(" · ") : "Noch nichts markiert. Im Gespräch die Punkte antippen, die wirklich weh tun."}),
    picked.length ? el("button", {class:"btn", type:"button", onclick:copyShortlist}, "Als Liste kopieren") : null,
    picked.length ? el("button", {class:"btn btn--ghost", type:"button", onclick:() => { S.picked = []; save(); render(); }}, "Leeren") : null
  );
  return bar;
}

function copyShortlist(){
  const picked = KATALOG.filter(i => S.picked.includes(i.id));
  const txt = "Ausgewählte Vorhaben\n\n" + picked.map((i,n) =>
    (n+1) + ". " + i.t + "\n   " + i.p.replace(/<[^>]+>/g,"") +
    (i.win ? "\n   Wirkung: " + i.win.replace(/<[^>]+>/g,"") : "") +
    "\n   Aufwand: " + AUFWAND_TXT[i.aufwand] + (i.zeit ? " · " + i.zeit : "")
  ).join("\n\n");
  navigator.clipboard?.writeText(txt).then(
    () => flash("In die Zwischenablage kopiert"),
    () => flash("Kopieren hat nicht geklappt")
  );
}

let flashT = null;
function flash(msg){
  let n = $("#flash");
  if(!n){
    n = el("div", {id:"flash", style:"position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:100px;font-size:.85rem;box-shadow:var(--shadow-lg)"});
    document.body.appendChild(n);
  }
  n.textContent = msg;
  n.style.opacity = "1";
  clearTimeout(flashT);
  flashT = setTimeout(() => { n.style.opacity = "0"; n.style.transition = "opacity .4s ease"; }, 1900);
}

   auf 1'850 produktive Stunden. Rechenweg in Recherche 01. */
const CALC_DEFAULT = {personen:6, stunden:6, satz:54, quote:55, setup:12000, monat:250};
let C = {...CALC_DEFAULT};
let calcPreset = null;

const PRESETS = [];   /* wird mit den Inhalten gefüllt */

function renderRechner(v){
  $("#topTitle").textContent = "Nutzenrechner";

  p.appendChild(el("div", null,
    el("div", {class:"masslinie masslinie--full", text:"Rechner · eure Zahlen"}),
    el("h1", {style:"font-size:clamp(1.7rem,3.4vw,2.5rem);letter-spacing:-.03em;font-weight:800;margin:.4em 0 .3em;line-height:1.05",
              text:"Rechnet es sich?"}),
    el("p", {style:"color:var(--ink-2);max-width:64ch;font-size:1rem;line-height:1.55",
             html:"Regler verschieben, bis die Zahlen eurem Betrieb entsprechen. Der Rechner nimmt bewusst <b>keine</b> optimistischen Werte an: er rechnet nur mit Zeit, die tatsächlich anders eingesetzt werden kann, und zieht Einführung und Betrieb ab."})
  ));

  if(PRESETS.length){
    p.appendChild(el("div", {class:"panel"},
      el("div", {class:"panel__h"}, el("h2", {text:"Ausgangslage wählen"}), el("span", {class:"sub", text:"dann anpassen"})),
      el("div", {class:"filters"}, PRESETS.map(ps => el("button", {
        class:"pill " + (ps.spur === "bau" ? "pill--bau" : "pill--care"),
        type:"button", "aria-pressed": calcPreset === ps.id ? "true":"false",
        onclick:() => { C = {...C, ...ps.v}; calcPreset = ps.id; render(); }
      }, ps.t)))
    ));
  }

  const fields = [
    {k:"personen", l:"Betroffene Personen", min:1, max:60, step:1, fmt:n => n + (n===1?" Person":" Personen"),
     d:"Wie viele Mitarbeitende machen diese Arbeit heute?"},
    {k:"stunden", l:"Stunden pro Person und Woche", min:0.5, max:25, step:.5, fmt:n => nf.format(n) + " h",
     d:"Nur die Zeit für genau diese Aufgabe — ehrlich geschätzt, lieber zu tief."},
    {k:"satz", l:"Vollkosten pro Stunde", min:30, max:180, step:5, fmt:n => "CHF " + n,
     d:"Lohn plus Sozialabgaben plus Arbeitsplatz. Nicht der Nettolohn."},
    {k:"quote", l:"Anteil, der wirklich wegfällt", min:10, max:90, step:5, fmt:n => n + " %",
     d:"Realistisch sind 40–70 %. Der Rest bleibt Kontrolle, Ausnahmen und Nachfragen."},
    {k:"setup", l:"Einführung, einmalig", min:0, max:120000, step:1000, fmt:n => chf(n),
     d:"Bau, Schnittstellen, Schulung, Begleitung in den ersten Wochen."},
    {k:"monat", l:"Betrieb pro Monat", min:0, max:3000, step:50, fmt:n => chf(n),
     d:"Hosting, Modellkosten, Wartung, kleine Anpassungen."}
  ];

  const left = el("div", {class:"panel"});
  left.appendChild(el("div", {class:"panel__h"}, el("h2", {text:"Eure Zahlen"}), el("span", {class:"sub", text:"schätzen genügt"})));
  for(const f of fields){
    const val = el("span", {class:"field__v", text:f.fmt(C[f.k])});
    const rng = el("input", {type:"range", min:f.min, max:f.max, step:f.step, value:C[f.k],
      "aria-label":f.l});
    rng.addEventListener("input", e => {
      C[f.k] = parseFloat(e.target.value);
      val.textContent = f.fmt(C[f.k]);
      calcPreset = null;
      paintResult();
    });
    left.appendChild(el("div", {class:"field"},
      el("div", {class:"field__h"}, el("span", {class:"field__l", text:f.l}), val),
      rng,
      el("div", {class:"field__d", text:f.d})
    ));
  }

  const right = el("div", {class:"result", id:"calcResult"});

  p.appendChild(el("div", {class:"calc"}, left, right));

  p.appendChild(el("div", {class:"callout", html:"<b>So lesen, dass es hält</b>Diese Rechnung ist ein Gedankenmodell, kein Angebot. Sie zeigt die Grössenordnung. Vor einem Piloten messen wir den Ist-Zustand zwei Wochen lang — erst diese gemessene Zahl gilt."}));

function calcResult(){
  const stdJahr = C.personen * C.stunden * 45;          /* 45 Arbeitswochen */
  const frei = stdJahr * (C.quote / 100);
  const brutto = frei * C.satz;
  const betrieb = C.monat * 12;
  const netto1 = brutto - betrieb - C.setup;
  const nettoLauf = brutto - betrieb;
  const amort = nettoLauf > 0 ? (C.setup / (nettoLauf / 12)) : Infinity;
  return {stdJahr, frei, brutto, betrieb, netto1, nettoLauf, amort, drei: brutto*3 - betrieb*3 - C.setup};
}

function paintResult(){
  const r = $("#calcResult");
  if(!r) return;
  const x = calcResult();
  const max = Math.max(x.brutto, 1);
  r.innerHTML = "";
  r.appendChild(el("div", {class:"masslinie", text:"Ergebnis erstes Jahr"}));
  r.appendChild(el("div", {class:"result__big"},
    el("span", {class:"result__n", style:x.netto1 < 0 ? "color:var(--crit)" : "", text:chf(x.netto1)}),
    el("span", {class:"result__l", html:"Rechnerischer Wert der frei werdenden Zeit, <b>nach Einführung und Betrieb</b> — " +
      nf.format(Math.round(x.frei)) + " Stunden pro Jahr. Ein Franken wird daraus erst, wenn ihr die Stunden anders einsetzt oder eine offene Stelle nicht mehr besetzen müsst."})
  ));

  const bar = (label, val, cls) => el("div", {class:"bar"},
    el("div", {class:"bar__h"}, el("span", {text:label}), el("b", {text:chf(Math.round(val))})),
    el("div", {class:"bar__t"}, el("div", {class:"bar__f " + (cls||""), style:"width:" + Math.max(0, Math.min(100, val/max*100)) + "%"}))
  );

  r.appendChild(el("div", {class:"bars"},
    bar("Gewonnene Zeit, in Geld", x.brutto),
    bar("Betrieb pro Jahr", x.betrieb, "bar__f--dim"),
    bar("Einführung, einmalig", C.setup, "bar__f--dim")
  ));

  r.appendChild(el("div", {style:"height:1px;background:var(--line-soft)"}));

  r.appendChild(el("div", {class:"grid grid--2", style:"gap:12px"},
    el("div", null,
      el("div", {class:"kpi__n", style:"font-size:1.5rem", text:chf(Math.max(x.brutto,0))}),
      el("div", {class:"field__d", text:"Wert der gewonnenen Zeit vor Abzügen"})
    ),
    el("div", null,
      el("div", {class:"kpi__n", style:"font-size:1.5rem", text: isFinite(x.amort) ? (x.amort < 1 ? "unter 1" : nf.format(Math.round(x.amort))) + " Mt." : "—"}),
      el("div", {class:"field__d", text: isFinite(x.amort) ? "bis die Einführung bezahlt ist" : "trägt sich in dieser Einstellung nicht"})
    ),
    el("div", null,
      el("div", {class:"kpi__n", style:"font-size:1.5rem", text:chf(x.drei)}),
      el("div", {class:"field__d", text:"über drei Jahre gerechnet"})
    ),
    el("div", null,
      el("div", {class:"kpi__n", style:"font-size:1.5rem", text:nf.format(Math.round(x.frei/45/C.personen*10)/10) + " h"}),
      el("div", {class:"field__d", text:"pro Person und Woche zurück"})
    )
  ));

  r.appendChild(el("div", {class:"src", style:"font-size:.7rem",
    html:"Gerechnet mit 45 Arbeitswochen. Vollkosten, nicht Nettolohn. Gewonnene Zeit ist nur dann Geld, wenn sie tatsächlich anders eingesetzt wird — sonst ist sie Entlastung, was auch etwas wert ist, aber nicht in dieser Spalte steht."}));
}
